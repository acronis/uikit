spec_version: '1.0'
component: Treemap

# Framework-agnostic contract. Treemap has NO cva variant axes — `aspectRatio` is
# a plain geometry prop and nesting is out of v1 scope, so there are no variant
# enums to conformance-check. v1 is a flat treemap (a list of leaves), themed via
# a custom cell renderer.
contract:
  properties:
    - name: data
      type: ReadonlyArray<Record<string, string | number>>
      required: true
      description: Row-per-leaf data — each row holds a `nameKey` label and a `dataKey` numeric size.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Leaves take their colour from the container's `palette`; each entry,
        keyed by the leaf's `nameKey` value, maps that leaf to a `label` and an
        optional `tone`. Resolved into the `--color-<name>` custom properties the
        cells fill from.
    - name: dataKey
      type: string
      required: true
      description: The numeric field that sizes each leaf's rectangle.
    - name: nameKey
      type: string
      required: true
      description: >-
        The field that keys each leaf (drives the legend, tooltip, and
        `--color-<name>` lookup). Values should be unique and CSS-safe (they
        become part of a custom-property name) — the human name shown on the tile
        is the leaf's config label.
    - name: aspectRatio
      type: number
      required: false
      default: '1.3333'
      description: Width-to-height ratio the tiling targets (default 4 / 3).
    - name: showLabels
      type: boolean
      required: false
      default: 'true'
      description: Render each leaf's label inside its cell (when it fits).
    - name: labelAlign
      type: "'bottom-start' | 'top-start' | 'center'"
      required: false
      default: "'bottom-start'"
      description: >-
        Where a cell's label block sits — anchored at the tile's bottom start
        corner (the design's placement), at its top start corner, or centered in
        the tile. Named for the start edge, not a physical one: the corner
        variants mirror under dir="rtl".
    - name: secondaryKeys
      type: ReadonlyArray<string>
      required: false
      description: >-
        Fields whose values make up a second label line under the leaf's name
        (e.g. a value and a count). Dropped on cells too short to hold it.
    - name: secondaryFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each secondary value. Receives the field's index in secondaryKeys,
        so one formatter can cover fields of different kinds.
    - name: secondarySeparator
      type: string
      required: false
      default: "' · '"
      description: Separator drawn between multiple secondary values.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'false'
      description: >-
        Render the legend — one entry per distinct leaf name. Off by default: a
        treemap labels its own cells.
    - name: legendPos
      type: "'top' | 'bottom'"
      required: false
      default: "'bottom'"
      description: Which edge the legend sits on.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
  events: []
  methods: []

adapters:
  react:
    component: Treemap
    status: implemented
    import: "import { Treemap } from '@acronis-platform/ui-react'"
    example: |
      <Treemap
        config={config}
        data={data}
        dataKey="size"
        nameKey="name"
        className="h-[320px] w-[520px]"
      />
  vue:
    component: AvTreemap
    status: planned
    import: "import { AvTreemap } from '@acronis-platform/ui-vue'"
    example: |
      <AvTreemap :config="config" :data="data" data-key="size" name-key="name" />
  web-components:
    element: ui-treemap
    status: planned
    import: "import '@acronis-platform/ui-wc/treemap'"
    example: |
      <ui-treemap></ui-treemap>
