spec_version: '1.0'
component: Treemap

# References only. Values live in @acronis-platform/tokens-pd. Treemap has no
# token tier of its own, and needs none: cell colours come from the shared
# `--ui-dataviz-*` palettes on the semantic tier, resolved by ChartContainer out
# of the `palette` prop. The tooltip chrome is inherited from the shared Chart
# primitives.
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-text-on-status-strong-neutral
    affects: cells
    description: >-
      On-cell label text, both lines — the "text on a strong colored surface"
      token (constant white in both themes), readable over the saturated series
      colors. The hierarchy between the lines is carried by the title's weight, not
      a second color: the on-strong *secondary* text token resolves to a dark grey
      in dark mode, which a cell's fill stays saturated behind.
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: tooltip-content
    description: Tooltip value text (text-foreground).
  - name: --ui-text-on-surface-secondary
    affects: tooltip-content, legend-content
    description: >-
      Muted tooltip row label (text-muted-foreground), and a legend entry's
      custom `config` icon when one is given
      (`[&>svg]:text-muted-foreground`) — a legend entry's own label text
      inherits the surface's text color rather than this token.
  - name: --ui-border-on-surface-border
    affects: tooltip-content
    description: Tooltip border (border-border).
