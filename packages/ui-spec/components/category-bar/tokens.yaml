spec_version: '1.0'
component: CategoryBar

# References only. Values live in @acronis-platform/tokens-pd. CategoryBar has no
# token tier of its own, and needs none: segment fills come from the shared
# `--ui-dataviz-*` palettes on the semantic tier, resolved by ChartContainer out
# of the `palette` prop. Only the track background and the legend/tooltip chrome
# use the tokens below.
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-border-on-surface-border
    affects: track
    description: >-
      Track background behind the segments (bg-input) and the tooltip border
      (border-border).
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: legend
    description: Legend value text (text-foreground).
  - name: --ui-text-on-surface-secondary
    affects: legend
    description: >-
      Legend label + percentage text and muted tooltip text
      (text-muted-foreground).
