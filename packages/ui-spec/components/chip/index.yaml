spec_version: '1.0'
component: Chip
name: chip
status: ready
category: data-display
description: >-
  A compact, interactive label for a selection, a removable token, or an inline
  action. The `removable` variant carries a trailing × button; `selectable` is a
  toggle that shows an active style when selected; `operational` is a plain
  action chip with a strong-link label. All three accept an optional leading
  icon.
