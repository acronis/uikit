spec_version: '1.0'
component: Avatar

# `color` is the only cva axis (its enum matches the cva keys in the ui-react
# source). `variant`/`label`/`icon` are plain (non-cva) content props — they
# select what auto-renders when no `children` are composed; they don't change
# any class. Image and fallback are also composable as child parts
# (AvatarImage / AvatarFallback), which always take precedence over them.
# AvatarGroup is a sibling layout component.
#
# "No children composed" throughout this spec means the content slot is
# `undefined` specifically, not merely empty: an explicit `null` child is a
# deliberate "render nothing" and leaves the circle empty rather than falling
# back to `label`/`icon`.
contract:
  properties:
    - name: color
      type: "'teal' | 'violet' | 'red' | 'yellow' | 'orange' | 'blue' | 'gray' | 'green'"
      required: false
      default: teal
      description: >-
        Color scheme for the fallback. Maps to `--ui-avatar-color-<scheme>`
        (background) and `--ui-avatar-label-color-<scheme>` (initials). Ignored
        once an image is shown.
    - name: variant
      type: "'text' | 'icon'"
      required: false
      default: text
      description: >-
        Selects the auto-rendered fallback content when no `children` are
        composed: initials (`label`) or an `icon`. Ignored once `children`
        (e.g. `AvatarImage`/`AvatarFallback`) are composed directly — including
        an explicit `null`, which renders an empty circle.
    - name: label
      type: string
      required: false
      default: SB
      description: >-
        Initials shown for the `text` variant when no `children` are
        composed.
    - name: icon
      type: ReactNode
      required: false
      description: >-
        Icon shown for the `icon` variant when no `children` are composed —
        typically a 16px icon from `@acronis-platform/icons-react`.

  events: []

  content:
    - name: default
      description: >-
        The avatar's children — an `AvatarImage` and/or an `AvatarFallback`
        (the initials). When the slot is left unset, `variant`/`label`/`icon`
        drive the content instead; an explicitly empty (`null`) slot renders an
        empty circle and does not fall back to them.

  methods: []

adapters:
  react:
    component: Avatar
    status: implemented
    import: "import { Avatar, AvatarImage, AvatarFallback, AvatarGroup } from '@acronis-platform/ui-react'"
    example: |
      <Avatar color="teal">
        <AvatarImage src="/me.png" alt="Sam N." />
        <AvatarFallback>SN</AvatarFallback>
      </Avatar>

      <Avatar color="blue" label="SB" />
      <Avatar color="blue" variant="icon" icon={<UserIcon size={16} />} />

      <AvatarGroup>
        <Avatar color="teal"><AvatarFallback>SN</AvatarFallback></Avatar>
        <Avatar color="violet"><AvatarFallback>GA</AvatarFallback></Avatar>
      </AvatarGroup>
  vue:
    component: AvAvatar
    status: planned
    import: "import { AvAvatar } from '@acronis-platform/ui-vue'"
    example: |
      <AvAvatar color="teal">SN</AvAvatar>
  web-components:
    element: ui-avatar
    status: planned
    import: "import '@acronis-platform/ui-wc/avatar'"
    example: |
      <ui-avatar color="teal">SN</ui-avatar>
