spec_version: '1.0'
component: ChatMenuItemExtras

# References only. Values live in @acronis-platform/tokens-pd (generated from
# @acronis-platform/design-tokens) and resolve per brand/theme at paint time.
#
# NOTE ON NAMING: the Figma node binds this cluster to the
# `components/SidebarSecondary/MenuItemExtras/_global/*` variable group, so the
# tokens below carry `sidebar-secondary` in their names even though the component
# is a Chat part. That is the design's own reference — repointing it at the
# `--ui-chat-*` tier here would silently fork the value away from the design.
# Raised with design as a naming/ownership question (see README).
#
# The `tag` part consumes no token from this list: it is the shipped `Tag`
# component, which binds its own `--ui-tag-*` tier (see components/tag).
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-sidebar-secondary-menu-item-extras-global-container-gap
    affects: root
    description: Gap between the cluster's children.
  - name: --ui-sidebar-secondary-menu-item-extras-global-shortcut-color
    affects: shortcut
    description: Muted text color of the keyboard-shortcut label.
