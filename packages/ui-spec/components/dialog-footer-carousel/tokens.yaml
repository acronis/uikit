spec_version: '1.0'
component: DialogFooterCarousel

# References only. Values live in @acronis-platform/tokens-pd (generated from
# @acronis-platform/design-tokens) and resolve per brand/theme at paint time.
# The token schema forbids a value/default key here — never restate values.
source: '@acronis-platform/tokens-pd'

tokens:
  - {
      name: --ui-footer-carousel-color,
      affects: root,
      description: Root background color (transparent by default — inherits the surface behind it),
    }
  - {
      name: --ui-footer-global-height,
      affects: root,
      description: Fixed row height (64px),
    }
  - {
      name: --ui-footer-global-padding-x,
      affects: root,
      description: Horizontal padding,
    }
  - {
      name: --ui-carousel-dialog-list-indicator-gap,
      affects: listIndicator,
      description: Gap between dots,
    }
  - {
      name: --ui-glyph-on-surface-primary,
      affects: listIndicator,
      description: Active dot color,
    }
  - {
      name: --ui-glyph-on-surface-disabled,
      affects: listIndicator,
      description: Inactive dot color,
    }
