spec_version: '1.0'
component: RadarChart

# References only. Values live in @acronis-platform/tokens-pd. RadarChart has no
# token tier of its own, and needs none: series colours come from the shared
# `--ui-dataviz-*` palettes on the semantic tier, resolved by ChartContainer out
# of the `palette` prop. The chrome (tooltip, legend, polar grid) is inherited
# from the shared Chart primitives; the component adds a local override so the
# polar angle-axis labels resolve the muted-foreground token (the shared
# container themes only cartesian ticks).
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-text-on-surface-secondary
    affects: angle-axis
    description: >-
      Polar angle-axis (spoke) labels, radius-axis (value scale) tick labels, and
      muted tooltip/legend label text (fill-muted-foreground /
      text-muted-foreground).
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: tooltip-content
    description: Tooltip value text (text-foreground).
  - name: --ui-border-on-surface-border
    affects: grid
    description: >-
      Tooltip border, the recharts polar-grid web lines, and the radius-axis
      scale line (border-border / stroke-border).
