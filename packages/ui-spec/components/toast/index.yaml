spec_version: '1.0'
component: Toast
name: toast
status: stable
category: feedback
description: >-
  A transient notification in a corner stack: a neutral card carrying its severity
  through a status-colored border and a status line down the leading edge, with a
  fixed status icon per severity, an optional description, and optional action
  buttons. Triggered imperatively via the `toast(...)` API and rendered by a single
  `<Toaster>` region.
since: 0.41.0
dependencies:
  components:
    - Button
    - ButtonIcon
