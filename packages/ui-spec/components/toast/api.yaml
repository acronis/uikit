spec_version: '1.0'
component: Toast

# Toast is imperative: a `<Toaster>` region (these properties) plus a `toast(...)`
# API (these methods). There is no per-toast React component to take props, so the
# Figma's `variant` is selected by which `toast.*` method is called.
contract:
  properties:
    - name: timeout
      type: number
      required: false
      default: '5000'
      description: >-
        Default auto-dismiss delay (ms) for toasts that don't set their own. `0`
        keeps a toast until dismissed.
    - name: limit
      type: number
      required: false
      default: '3'
      description: Maximum toasts shown at once; the oldest is dropped past it.
    - name: label
      type: string
      required: false
      default: "'Notifications'"
      description: Accessible name for the toast region.
    - name: closeAriaLabel
      type: string
      required: false
      default: "'Close'"
      description: Accessible name for each toast's dismiss control.
  events: []
  methods:
    - name: toast
      signature: 'toast(title, options?) => string'
      description: >-
        Show a toast with the default `info` severity and return its id.
        `options`: description, timeout, actions, id (re-adding the same id
        updates the toast in place).
    - name: toast.info
      signature: 'toast.info(title, options?) => string'
      description: Show an info toast (blue border, CircleInfoBlue icon).
    - name: toast.success
      signature: 'toast.success(title, options?) => string'
      description: Show a success toast (green border, CircleCheckGreen icon).
    - name: toast.warning
      signature: 'toast.warning(title, options?) => string'
      description: Show a warning toast (yellow border, TriangleWarningYellow icon).
    - name: toast.critical
      signature: 'toast.critical(title, options?) => string'
      description: Show a critical toast (orange border, CircleWarningOrange icon).
    - name: toast.danger
      signature: 'toast.danger(title, options?) => string'
      description: Show a danger toast (red border, DiamondWarningRed icon).
    - name: toast.loading
      signature: 'toast.loading(title, options?) => string'
      description: >-
        Show a persistent loading toast — a spinner in place of the status glyph,
        borrowing the info chrome, with no auto-dismiss. Has no Figma variant.
    - name: toast.dismiss
      signature: 'toast.dismiss(id?) => void'
      description: Dismiss the toast with the id, or all toasts when omitted.
    - name: toast.promise
      signature: 'toast.promise(promise, { loading, success, error }) => Promise'
      description: >-
        Tie a toast to a promise, swapping its content as it settles. Its failure
        branch resolves to the danger visual.

  content:
    - name: options.dismissable
      description: >-
        Whether the toast renders its dismiss control and can be swiped away.
        Defaults to true, matching the Figma's `dismissable` boolean. Setting it
        false also revokes swipe-to-dismiss, so the control and the capability
        never disagree; combined with `timeout: 0` the toast can then only be
        removed with `toast.dismiss(id)`.
    - name: options.actions
      description: >-
        Action-button descriptors — `{ label, onClick?, variant? }` — rendered in a
        wrapping row under the text. The first defaults to the `secondary` button
        style and the rest to `ghost`, matching the Figma. Clicking one runs its
        handler; it does not dismiss the toast.

adapters:
  react:
    component: Toaster
    status: implemented
    import: "import { Toaster, toast } from '@acronis-platform/ui-react'"
    example: |
      // once, near the app root:
      <Toaster />

      // anywhere:
      toast.success('Profile saved', { description: 'Your changes were saved.' });
      toast.danger('Delete failed', {
        description: 'Please try again or contact support.',
        actions: [{ label: 'Retry', onClick: retry }],
      });
  vue:
    component: AvToaster
    status: planned
    import: "import { AvToaster, toast } from '@acronis-platform/ui-vue'"
    example: |
      <AvToaster />
  web-components:
    element: ui-toaster
    status: planned
    import: "import '@acronis-platform/ui-wc/toast'"
    example: |
      <ui-toaster></ui-toaster>
