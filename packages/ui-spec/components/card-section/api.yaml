spec_version: '1.0'
component: CardSection

# Framework-agnostic contract. `hasHeader` and `title` are a *dependent pair*:
# the header row always renders a title, so a title is required whenever the
# header is shown. The React adapter enforces this at compile time with a
# discriminated union; other frameworks should enforce the same rule with
# whatever their type system offers.
contract:
  properties:
    - name: variant
      type: "'slot' | 'tag' | 'list' | 'table-actions' | 'card-primary' | 'card-secondary'"
      required: false
      default: slot
      description: >-
        Which body shape the section renders. `slot` takes arbitrary content;
        `tag` a wrapping row of tags; `list` title/description key-value rows;
        `table-actions` a table with row actions, rendered flush so its rows
        run edge-to-edge; `card-primary` / `card-secondary` a nested `Card` on
        the primary or secondary surface. Maps to Figma's `Slot` / `Tag` /
        `List` / `Table + Actions` / `Card (primary)` / `Card (secondary)`.

    - name: hasBottomBorder
      type: boolean
      required: false
      default: false
      description: >-
        Adds a bottom divider plus the matching bottom padding, separating this
        section from the next one stacked below it in the same card body.

    - name: hasHeader
      type: boolean
      required: false
      default: false
      description: >-
        Shows the section's own mini-header row (14px medium title), distinct
        from the card-level `CardHeader`. Requires `title`.

    - name: title
      type: string
      required: false
      default: undefined
      description: >-
        The section header's title. Required whenever `hasHeader` is set, and
        rejected when it is not — the title has nowhere to render without the
        header row.

    - name: extras
      type: 'ReactNode'
      required: false
      default: undefined
      description: Content rendered inline next to the title in the header row.

    - name: actions
      type: 'ReactNode'
      required: false
      default: undefined
      description: Actions rendered at the end of the header row (e.g. a menu button).

    - name: content
      type: 'ReactNode'
      required: false
      default: undefined
      description: Body of the `slot` variant — arbitrary passthrough content.

    - name: contentTag
      type: 'ReactNode'
      required: false
      default: undefined
      description: >-
        Body of the `tag` variant. Has no built-in default: like
        `contentList`, the consumer supplies the tags.

    - name: contentList
      type: 'ReactNode'
      required: false
      default: undefined
      description: >-
        Body of the `list` variant — title/description key-value rows. Has no
        built-in default: the `ListItem` tokens the design references
        (`--ui-card-body-section-item-*`) do not exist in tokens-pd yet.

    - name: contentTable
      type: 'ReactNode'
      required: false
      default: undefined
      description: Body of the `table-actions` variant.

    - name: render
      type: 'RenderProp'
      required: false
      default: undefined
      description: >-
        Base UI composition prop — replaces the rendered element with another
        component (e.g. a `<section>`) while merging props and classes.
        React-only; other frameworks use their own polymorphism.

  events: []

  content:
    - name: default
      description: >-
        For `card-primary` / `card-secondary`, the nested card's parts
        (`CardHeader`, `CardContent`, …). For every other variant, extra
        content appended after the variant body.

  methods: []

adapters:
  react:
    component: CardSection
    status: implemented
    import: "import { CardSection } from '@acronis-platform/ui-react'"
    example: |
      <Card>
        <CardHeader title="Workload" />
        <CardContent className="p-0 pb-4">
          <CardSection
            variant="list"
            hasHeader
            title="Network details"
            hasBottomBorder
            contentList={rows}
          />
          <CardSection variant="tag" hasHeader title="Labels" contentTag={tags} />
        </CardContent>
      </Card>

      // Nested card on the secondary surface.
      <CardSection variant="card-secondary" hasHeader title="Retention">
        <CardHeader title="Policy" />
        <CardContent>Keep daily backups for 30 days.</CardContent>
      </CardSection>

  vue:
    component: AvCardSection
    status: planned
    import: "import { AvCardSection } from '@acronis-platform/ui-vue'"
    example: |
      <AvCardSection variant="tag" has-header title="Labels" />

  web-components:
    element: ui-card-section
    status: planned
    import: "import '@acronis-platform/ui-wc/card-section'"
    example: |
      <ui-card-section variant="tag" has-header title="Labels"></ui-card-section>
