spec_version: '1.0'
component: Card

schematic: |
  root: <div> (rounded border + surface, red border when hasError)
  +-----------------------------------------------------------------+
  |  header (border-bottom divider)                                 |
  |   [drag-handle] [switch] [avatar] title [rename] [extras]  [actions]
  |                          description                              |
  |  content                                                         |
  |   +-------------------------------------------------------------+ |
  |   | arbitrary children                                          | |
  |   +-------------------------------------------------------------+ |
  |  footer (border-top divider)                                    |
  |   +-------------------------------------------------------------+ |
  |   | actions                                                     | |
  |   +-------------------------------------------------------------+ |
  +-------------------------------------------------------------------+
     root      -> background/text/border resolve to shared semantic tokens;
                  border switches to the error token when hasError is set
     header    -> single row: optional drag-handle, optional switch,
                  optional avatar, title + optional rename + extras (start),
                  optional description below the title, actions (end)
     content   -> arbitrary children, no built-in layout
     footer    -> horizontal row of actions

root:
  element: div
  description: >-
    The card surface: a rounded, 1px-bordered container. Polymorphic via the
    `render` prop (e.g. render as `<article>`/`<section>`). Background and
    text resolve to the shared semantic tokens; the border color depends on
    the `hasError` variant.

parts:
  - id: header
    description: >-
      Top region (`<div>`) laying out the drag handle, switch, avatar, title
      block, and actions in a single row. Owns the divider and padding.
    element: div
    optional: true
  - id: drag-handle
    description: >-
      Grip icon shown at the start of the header when `isDraggable` is set,
      signaling the card can be reordered.
    element: svg
    optional: true
  - id: switch
    description: >-
      Toggle shown at the start of the header when `isSwitchable` is set.
    element: button
    optional: true
  - id: avatar
    description: >-
      Avatar shown before the title when `hasAvatar` is set. Defaults to an
      initials avatar (`avatarLabel`); replaceable via the `avatar` slot.
    element: div
    optional: true
  - id: title
    description: The card's title text, truncated with an ellipsis if it overflows.
    element: p
    optional: false
  - id: rename
    description: >-
      Icon button shown next to the title when `hasRename` is set; fires
      `onRename`.
    element: button
    optional: true
  - id: extras
    description: Arbitrary content slot rendered inline after the title/rename.
    element: slot
    optional: true
  - id: description
    description: >-
      Secondary supporting copy below the title, shown when `hasDescription`
      is set.
    element: p
    optional: true
  - id: actions
    description: Arbitrary content slot rendered at the end of the header.
    element: slot
    optional: true
  - id: content
    description: Primary body region (`<div>`) holding arbitrary children.
    element: div
    optional: true
  - id: footer
    description: >-
      Bottom region (`<div>`) laying actions out in a horizontal row. Owns the
      divider and padding.
    element: div
    optional: true

layout:
  type: flex
  direction: column
  order: [header, content, footer]

states:
  - id: has-error
    trigger: 'hasError=true'
    kind: prop
    prop: hasError
    affects: [root]
