spec_version: '1.0'
component: Card

# Framework-agnostic contract for a *composable* card: the surface is assembled
# from parts (see anatomy.yaml). `Card` (root) only carries `hasError`; the
# header's rich feature set (drag handle, switch, avatar, rename, extras,
# actions, description) lives on `CardHeader`. Property names are neutral;
# see `adapters` for per-framework syntax.
contract:
  properties:
    - name: hasError
      type: boolean
      required: false
      default: false
      description: >-
        Switches the root border to the error token. Set on the root (`Card`),
        not the header.

    - name: render
      type: 'RenderProp'
      required: false
      default: undefined
      description: >-
        Base UI composition prop available on the root and every part —
        replaces the rendered element with another component (e.g. render the
        root as `<article>`) while merging props and classes. React-only;
        other frameworks use their own polymorphism.

    - name: header.title
      type: string
      required: false
      default: 'Title'
      description: The card's title text.

    - name: header.description
      type: string
      required: false
      default: undefined
      description: Helper text shown under the title; only rendered when `header.hasDescription` is set.

    - name: header.hasDescription
      type: boolean
      required: false
      default: false
      description: Shows `header.description` below the title.

    - name: header.isDraggable
      type: boolean
      required: false
      default: false
      description: Shows a drag handle at the start of the header, for reorderable lists.

    - name: header.dragHandleLabel
      type: string
      required: false
      default: 'Reorder'
      description: Accessible label for the drag handle.

    - name: header.isSwitchable
      type: boolean
      required: false
      default: false
      description: Shows a toggle switch at the start of the header.

    - name: header.switchChecked
      type: boolean
      required: false
      default: undefined
      description: Controlled checked state of the header switch.

    - name: header.defaultSwitchChecked
      type: boolean
      required: false
      default: undefined
      description: Uncontrolled initial checked state of the header switch.

    - name: header.switchDisabled
      type: boolean
      required: false
      default: undefined
      description: Disables the header switch.

    - name: header.switchLabel
      type: string
      required: false
      default: 'Toggle card'
      description: Accessible label for the header switch.

    - name: header.hasAvatar
      type: boolean
      required: false
      default: false
      description: Shows an avatar before the title.

    - name: header.avatarLabel
      type: string
      required: false
      default: undefined
      description: Initials shown in the default avatar; ignored if `header.avatar` is provided.

    - name: header.avatar
      type: 'ReactNode'
      required: false
      default: undefined
      description: Replaces the default initials avatar with custom content.

    - name: header.hasRename
      type: boolean
      required: false
      default: false
      description: Shows a rename button next to the title.

    - name: header.renameLabel
      type: string
      required: false
      default: 'Rename'
      description: Accessible label for the rename button.

    - name: header.extras
      type: 'ReactNode'
      required: false
      default: undefined
      description: Extra content rendered inline next to the title (e.g. a tag or badge).

    - name: header.actions
      type: 'ReactNode'
      required: false
      default: undefined
      description: Actions rendered at the end of the header (e.g. a menu button).

    - name: header.isCollapsible
      type: boolean
      required: false
      default: false
      description: >-
        Shows a disclosure trigger at the end of the header. Only has an
        effect when the header renders inside a collapsible
        `AccordionContainer` — see the collapsible composition example.

    - name: header.collapseLabel
      type: string
      required: false
      default: 'Collapse card'
      description: Accessible label for the collapse trigger.

  events:
    - name: header.onSwitchCheckedChange
      description: Fires when the header switch is toggled.
    - name: header.onRename
      description: Fires when the rename button is activated.

  content:
    - name: default
      description: >-
        The composed card. Author it from the parts: an optional header
        (title, description, drag handle, switch, avatar, rename, extras,
        actions), a content region, and an optional footer for actions. All
        parts are optional and may be used in any combination.

  methods: []

adapters:
  react:
    component: Card
    status: implemented
    import: >-
      import { Card, CardHeader, CardContent, CardFooter } from
      '@acronis-platform/ui-react'
    example: |
      <Card>
        <CardHeader title="Backup status" description="Last run 5 minutes ago" hasDescription />
        <CardContent>All workloads protected.</CardContent>
        <CardFooter>
          <Button>View report</Button>
        </CardFooter>
      </Card>

      // Collapsible: compose with AccordionContainer, and set
      // CardHeader's isCollapsible to render the trigger.
      <Card>
        <AccordionContainer collapsible defaultOpen>
          <CardHeader title="Backup policy" isCollapsible />
          <AccordionContainer.Content>
            <CardContent>Applies to 12 workloads.</CardContent>
            <CardFooter>
              <Button>Save</Button>
            </CardFooter>
          </AccordionContainer.Content>
        </AccordionContainer>
      </Card>

  vue:
    component: AvCard
    status: planned
    import: "import { AvCard, AvCardHeader, AvCardContent } from '@acronis-platform/ui-vue'"
    example: |
      <AvCard>
        <AvCardHeader title="Backup status" />
        <AvCardContent>All workloads protected.</AvCardContent>
      </AvCard>

  web-components:
    element: ui-card
    status: planned
    import: "import '@acronis-platform/ui-wc/card'"
    example: |
      <ui-card>
        <ui-card-header title="Backup status"></ui-card-header>
        <ui-card-content>All workloads protected.</ui-card-content>
      </ui-card>
