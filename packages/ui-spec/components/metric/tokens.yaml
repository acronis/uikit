spec_version: '1.0'
component: Metric

# References only. Values live in @acronis-platform/tokens-pd. No dedicated
# Metric token tier — Metric uses existing semantic tokens directly. Geometry
# (typography scale, spacing, radius) uses the Tailwind scale; no --ui-* type/
# space tier exists. The icon badge is always info-tinted (no status axis).
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-text-on-surface-primary
    affects: value
    description: Primary value color (text-foreground).
  - name: --ui-text-on-surface-secondary
    affects: unit, supporting-text, tooltip-info
    description: Unit, supporting text, and the info icon color (text-muted-foreground).
  - name: --ui-background-status-info
    affects: icon-badge
    description: Icon badge background — always the info tint, regardless of context.
  - name: --ui-glyph-on-surface-neutral-dark
    affects: icon-badge
    description: Icon color inside the badge.
  - name: --ui-background-surface-active
    affects: value
    description: Skeleton fill shown in place of the value while `loading` is true.
  - name: --ui-text-on-status-success
    affects: trend-row
    description: TrendIndicator color when `trend="up"` (positive sentiment).
  - name: --ui-text-on-status-danger
    affects: trend-row
    description: TrendIndicator color when `trend="down"` (negative sentiment).
  - name: --ui-text-on-status-neutral
    affects: trend-row
    description: TrendIndicator color when `trend="stable"` (neutral sentiment).
