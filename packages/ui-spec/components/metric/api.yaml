spec_version: '1.0'
component: Metric

# No cva — Metric is a plain presentational layout with no style variants.
# The kit never computes or formats the value; `trend` derives direction and
# sentiment automatically so the caller doesn't compose TrendIndicator manually.
contract:
  properties:
    - name: value
      type: ReactNode
      required: true
      description: >-
        The primary value, already formatted (`73`, `"94%"`, `"$72K"`, `"2.8"`).
        The kit does not format currency, units, or decimals.
    - name: unit
      type: ReactNode
      required: false
      description: >-
        Unit shown next to the value at a smaller, muted size — e.g. "%" or "hours".
    - name: caption
      type: ReactNode
      required: false
      description: Caption at the right end of the stats row — e.g. a timeframe `Tag`.
    - name: trend
      type: "'up' | 'down' | 'stable'"
      required: false
      description: >-
        Trend direction — renders a `TrendIndicator` on its own row below the
        value. Sentiment follows direction automatically: `up` → positive,
        `down` → negative, `stable` → neutral. Pair with `trendValue` for the
        change text.
    - name: trendValue
      type: ReactNode
      required: false
      description: >-
        Already-formatted change text shown next to the trend arrow — e.g. "20%",
        "+3". Requires `trend`.
    - name: supportingText
      type: ReactNode
      required: false
      description: >-
        Secondary line below the trend — e.g. a target or note.
    - name: badge
      type: ReactNode
      required: false
      description: >-
        A small badge / metadata slot beside the value — e.g. a Tag.
    - name: icon
      type: ReactNode
      required: false
      description: >-
        Icon rendered in a status-info-tinted badge before the value. Always
        uses the info tint — the badge is a contextual cue, not a status signal.
        The icon is cloned to 16 px (icons-react sizes from a `size` prop).
    - name: tooltip
      type: ReactNode
      required: false
      description: Contextual hint shown on an info affordance next to the value (Base UI Tooltip).
    - name: tooltipLabel
      type: string
      required: false
      default: More information
      description: Accessible name for the info affordance that reveals `tooltip`.
    - name: loading
      type: boolean
      required: false
      default: 'false'
      description: Show a skeleton in place of the value, preserving its space.

  content:
    - name: default
      description: >-
        Content below the stats strip (`children`) — e.g. a chart, a
        `Separator`, an AI-insight line. Composed by the consumer.

  events: []
  methods: []

adapters:
  react:
    component: Metric
    status: implemented
    import: "import { Metric } from '@acronis-platform/ui-react'"
    example: |
      <Metric
        value="73"
        unit="%"
        caption={<Tag>Last 30 days</Tag>}
        icon={<ChartPieIcon />}
        trend="down"
        trendValue="5%"
        supportingText="Target: 80%"
      >
        <BarChart {...} />
        <Separator className="my-3" />
        <p>Margin eroding — check labor cost per client…</p>
      </Metric>
  vue:
    component: AvMetric
    status: planned
    import: "import { AvMetric } from '@acronis-platform/ui-vue'"
    example: |
      <AvMetric value="73" unit="%" trend="down" trend-value="5%" />
  web-components:
    element: ui-metric
    status: planned
    import: "import '@acronis-platform/ui-wc/metric'"
    example: |
      <ui-metric value="73" unit="%" trend="down" trend-value="5%"></ui-metric>
