spec_version: '1.0'
component: Metric
name: metric
status: draft
category: data-display
description: >-
  A presentational stats strip: an optional info-tinted icon badge + primary
  value + unit on the left, an optional caption on the right, an optional trend
  row (auto-composed from `trend` + `trendValue` as a `TrendIndicator`), optional
  supporting text, and an optional `children` body (a chart, divider, insight
  line, …). No Card wrapper, no size or status axes — nest inside `ChartWidget`
  or a `Card` when card chrome is needed. It owns visual hierarchy and layout
  only; it never computes or formats the value or decides whether a change is
  good or bad. Design-pending v1.
dependencies:
  components:
    - TrendIndicator
    - Skeleton
    - Tooltip
