spec_version: '1.0'
component: Metric

schematic: |
  root: <div> (flex-col gap-2 — no Card wrapper)
    stats-row: <div> (justify-between gap-2)
      left:  [icon-badge?] value [unit?] [badge?] [tooltip-info?]
      right: [caption?]
    trend-row: TrendIndicator (from `trend` + `trendValue`) — optional
    supporting-text — optional
    body (children) — optional

root:
  element: div
  description: >-
    A plain `<div className="flex flex-col gap-2">`. No Card wrapper, no
    padding, no border — nest inside `ChartWidget` or a `Card` when card chrome
    is needed. The consumer controls outer sizing and spacing.

parts:
  - id: stats-row
    element: div
    description: >-
      A `justify-between` flex row. Left side: optional icon badge, value + unit
      sharing one baseline, optional metadata badge, optional tooltip affordance.
      Right side: optional caption.
  - id: icon-badge
    element: span
    description: >-
      Optional rounded badge (`size-9`) holding a contextual icon (`aria-hidden`),
      always tinted with the info status (`--ui-background-status-info` fill,
      `--ui-glyph-on-surface-neutral-dark` icon color). Icon is cloned to 16 px.
    optional: true
    visible_when: an `icon` is provided
  - id: value
    description: >-
      The primary value — highest hierarchy, `text-2xl font-semibold`. Rendered
      as a `<Skeleton>` while `loading` is true.
  - id: unit
    description: Optional unit beside the value at `text-xs text-muted-foreground`.
    optional: true
    visible_when: a `unit` is provided
  - id: badge
    description: Optional small metadata slot beside the value (e.g. a `Tag`).
    optional: true
    visible_when: a `badge` is provided
  - id: tooltip-info
    description: >-
      Optional info affordance (`CircleInfoIcon`, 16 px) next to the value,
      named by `tooltipLabel`. Reveals `tooltip` on hover/focus via Base UI
      Tooltip.
    optional: true
    visible_when: a `tooltip` is provided
  - id: caption
    element: div
    description: Optional right-aligned caption at the end of the stats row — e.g. a timeframe `Tag`.
    optional: true
    visible_when: a `caption` is provided
  - id: trend-row
    element: div
    description: >-
      Auto-rendered `TrendIndicator` from the first-class `trend` prop. Direction
      and sentiment are derived (`up`→positive, `down`→negative, `stable`→neutral);
      `trendValue` is forwarded as TrendIndicator's `value`.
    optional: true
    visible_when: '`trend` is provided'
  - id: supporting-text
    element: div
    description: >-
      Optional secondary line at text-xs text-muted-foreground — e.g. a target
      or note.
    optional: true
    visible_when: a `supportingText` is provided
  - id: body
    description: >-
      Optional content below the stats strip (`children`) — e.g. a chart, a
      divider, an AI-insight line. Composed by the consumer.
    optional: true
    visible_when: '`children` are provided'

layout:
  type: flex
  direction: column
  align: stretch
  order: [stats-row, trend-row, supporting-text, body]

states:
  - {
      id: loading,
      trigger: 'loading is true',
      kind: prop,
      prop: loading,
      affects: [value],
    }
