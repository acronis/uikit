spec_version: '1.0'
component: LineChart

# Framework-agnostic contract. `curve` and `lineStyle` are the CVA variant axes
# (conformance-checked against the ui-react cva keys). `data` / `config` /
# `dataKeys` / `xKey` are the data contract; the rest toggle chrome and stroke
# detail. Single vs multi line is not a variant — it is driven by how many
# `dataKeys` are plotted.
contract:
  properties:
    - name: curve
      type: "'linear' | 'monotone' | 'step'"
      required: false
      default: "'monotone'"
      description: >-
        How each line interpolates between points. `linear` = straight segments;
        `monotone` = a smoothed curve; `step` = stepped (right-angle) segments.
    - name: lineStyle
      type: "'solid' | 'dashed'"
      required: false
      default: "'solid'"
      description: Stroke style of every line — solid or dashed.
    - name: data
      type: ReadonlyArray<Record<string, string | number | null>>
      required: true
      description: >-
        Row-per-point data — each row holds `xKey` plus one numeric field per
        series. A `null` breaks the line at that point unless `connectNulls`.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Per-series map of label / color (from the shared Chart primitives).
        Turned into `--color-<key>` custom properties. Colors are caller-supplied.
    - name: dataKeys
      type: string[]
      required: true
      description: Series to plot — one line per key. Each must exist in `config` and every data row.
    - name: xKey
      type: string
      required: true
      description: The category dimension key shared across rows.
    - name: comparisonKeys
      type: string[]
      required: false
      description: >-
        Subset of `dataKeys` rendered as comparison/trend overlays (e.g. a
        previous quarter or year) — dashed, dimmed, and dot-less, keeping each
        series' own `config` color.
    - name: deltaBands
      type: '[string, string][]'
      required: false
      description: >-
        Pairs `[current, comparison]` to shade a delta band between — a dimmed
        area filling the gap between the two series at each point (the QoQ/YoY
        difference), tinted with the first key's `config` color.
    - name: xAxisLabel
      type: string
      required: false
      description: Title rendered beneath the horizontal (X) axis.
    - name: yAxisLabel
      type: string
      required: false
      description: Title rendered beside the vertical (Y) axis (rotated).
    - name: yUnit
      type: string
      required: false
      description: >-
        Unit suffix appended to Y-axis tick values (recharts `unit`); the X axis
        is categorical.
    - name: strokeWidth
      type: number
      required: false
      default: '2'
      description: Stroke width of each line.
    - name: showDots
      type: boolean
      required: false
      default: 'true'
      description: Render a dot at each data point.
    - name: connectNulls
      type: boolean
      required: false
      default: 'false'
      description: Bridge `null` gaps in the data instead of breaking the line.
    - name: showGrid
      type: boolean
      required: false
      default: 'true'
      description: Render the CartesianGrid.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: showXAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the X axis (its ticks and title). Set false to hide it.
    - name: showYAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the Y axis (its ticks and title). Set false to hide it.
    - name: xTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each X-axis tick value. Unlike the `unit` suffix (append-only), a
        formatter transforms the value — abbreviate, prefix a symbol, or map to a
        label. Use formatCompactNumber / formatPercent / createTickFormatter from
        the shared Chart primitives, or any function.
    - name: yTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each Y-axis tick value (see xTickFormatter).
    - name: xAxisAngle
      type: number
      required: false
      description: Rotate the X-axis tick labels by this many degrees (a negative angle tilts them up toward the right); the tick anchor + axis height adjust.
    - name: xAxisInterval
      type: "number | 'preserveStart' | 'preserveEnd' | 'preserveStartEnd' | 'equidistantPreserveStart'"
      required: false
      description: >-
        X-axis tick density — a recharts placement strategy, or a fixed number of
        ticks to skip between two rendered ones (recharts interval: 0 shows every
        tick, 1 every other one, 2 every third).
    - name: yAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the value axis (recharts tickCount; a hint, not
        exact). Applies to whichever axis holds the values — Y for most charts, X
        for BarChart with orientation="horizontal".
    - name: yAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Value-axis domain preset — auto (fit the data at both ends; the axis need
        not include 0), zero (anchor the axis at 0, which is also recharts'
        behaviour when the prop is omitted), or dataMin-dataMax (tight to the
        data, no padding). Applies to whichever axis holds the values — Y for most
        charts, X for BarChart with orientation="horizontal".
    - name: gridDashed
      type: boolean
      required: false
      description: Draw grid lines dashed instead of solid.
    - name: gridHorizontal
      type: boolean
      required: false
      description: Show horizontal grid lines (defaults to the chart's own default when unset).
    - name: gridVertical
      type: boolean
      required: false
      description: Show vertical grid lines (defaults to the chart's own default when unset).
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
    - name: showLabels
      type: boolean
      required: false
      default: 'false'
      description: Render a value label on each data point/segment.
    - name: labelPosition
      type: "'top' | 'bottom' | 'left' | 'right' | 'center' | 'insideTop' | 'insideBottom' | 'insideLeft' | 'insideRight' | 'insideStart' | 'insideEnd'"
      required: false
      description: Where the value labels sit.
    - name: labelFormatter
      type: '(value) => string'
      required: false
      description: Format each label value (reuses the tick formatters).
  events: []
  methods: []

adapters:
  react:
    component: LineChart
    status: implemented
    import: "import { LineChart } from '@acronis-platform/ui-react'"
    example: |
      <LineChart
        config={config}
        data={data}
        dataKeys={['desktop', 'mobile']}
        xKey="month"
        curve="monotone"
        lineStyle="solid"
        className="h-[320px] w-[560px]"
      />
  vue:
    component: AvLineChart
    status: planned
    import: "import { AvLineChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvLineChart :config="config" :data="data" :data-keys="['desktop']" x-key="month" />
  web-components:
    element: ui-line-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/line-chart'"
    example: |
      <ui-line-chart></ui-line-chart>
