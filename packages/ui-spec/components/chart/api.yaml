spec_version: '1.0'
component: Chart

# Chart is a multi-part composition. ChartContainer takes the `config` and the
# recharts plot as children; the tooltip/legend chrome take recharts' content
# props plus the display options below. ChartTooltip / ChartLegend are direct
# re-exports of recharts' Tooltip / Legend.
contract:
  properties:
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Per-series map of label / icon / tone. ChartContainer resolves each
        entry's colour out of `palette` and emits it as a `--color-<key>` custom
        property. Declare exactly the series the chart plots: a stop is assigned
        by an entry's position here, so an entry for a series that isn't drawn
        still consumes a colour and shifts the ones that follow.
    - name: palette
      type: ChartPalette
      required: false
      default: "{ type: 'categorical' }"
      description: >-
        The dataviz palette the series are painted from — `categorical` (16
        hues), `sequential` (a `ramp` of 8 stops), `diverging` (a `pair` of 6),
        or `status` (6 semantic tones). Series walk it in its defined order.
        There is no free-form colour and no "no palette" state, so a chart
        cannot paint a hue outside the design system.
    - name: tone
      type: ChartSeriesTone
      required: false
      description: >-
        Per-entry override inside `config`. `{ slot }` picks another categorical
        hue; `{ status }` names a tone under the status palette; `{ sameAs }`
        paints whatever another series paints, for a twin series (a forecast
        tail, a projection band) that must not read as a second metric.
        `sequential` and `diverging` take no override — their stops are a ramp,
        meaningful only in relation to each other.
    - name: active
      type: boolean
      required: false
      description: >-
        Whether the tooltip is showing (set by recharts on hover/focus). Drives
        ChartTooltipContent rendering.
    - name: hideLabel
      type: boolean
      required: false
      default: 'false'
      description: Hide the tooltip's heading label.
    - name: hideIndicator
      type: boolean
      required: false
      default: 'false'
      description: Hide the per-series color dot in the tooltip.
    - name: hideIcon
      type: boolean
      required: false
      default: 'false'
      description: Hide the per-series icon in the legend (use the color swatch).
    - name: nameKey
      type: string
      required: false
      description: Config key to resolve each series' label from the payload.
    - name: labelKey
      type: string
      required: false
      description: Config key to resolve the tooltip's heading label.
  events: []
  methods: []

adapters:
  react:
    component: ChartContainer
    status: implemented
    import: "import { ChartContainer, ChartTooltip, ChartTooltipContent, ChartLegend, ChartLegendContent } from '@acronis-platform/ui-react'"
    example: |
      <ChartContainer config={config} className="h-[300px] w-[500px]">
        <BarChart data={data}>
          <ChartTooltip content={<ChartTooltipContent />} />
          <Bar dataKey="desktop" fill="var(--color-desktop)" />
        </BarChart>
      </ChartContainer>
  vue:
    component: AvChart
    status: planned
    import: "import { AvChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvChart :config="config" />
  web-components:
    element: ui-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/chart'"
    example: |
      <ui-chart></ui-chart>
