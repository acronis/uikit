spec_version: '1.0'
component: Chart

# References only. Values live in @acronis-platform/tokens-pd. Chart has no token
# tier of its own, and needs none: series colours come from the shared
# `--ui-dataviz-*` palettes on the semantic tier (see the `palette` prop), so a
# per-component alias layer would be pure indirection. The chrome
# (container, tooltip, legend) and the recharts grid/axis overrides use the
# shared semantic vocabulary via the bridged Tailwind names that resolve to these
# `--ui-*` tokens. The tooltip surface additionally borrows the shape tokens from
# the Tooltip component's own tier (`--ui-tooltip-container-*`) so a chart tooltip
# and a plain tooltip read as the same object.
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: tooltip-content
    description: Tooltip value text (text-foreground).
  - name: --ui-text-on-surface-secondary
    affects: tooltip-content
    description: >-
      Muted tooltip/legend label text and axis tick labels
      (text-muted-foreground / fill-muted-foreground).
  - name: --ui-border-on-surface-border
    affects: tooltip-content
    description: >-
      Tooltip border and recharts grid / cursor / reference lines
      (border-border / stroke-border).
  - name: --ui-background-surface-secondary
    affects: container
    description: >-
      Recharts muted fills — radial-bar background and tooltip cursor rectangle
      (fill-muted).
  - name: --ui-tooltip-container-border-radius
    affects: tooltip-content
    description: Tooltip corner radius, borrowed from the Tooltip tier.
  - name: --ui-tooltip-container-padding-x
    affects: tooltip-content
    description: Tooltip horizontal padding, borrowed from the Tooltip tier.
  - name: --ui-tooltip-container-padding-y
    affects: tooltip-content
    description: Tooltip vertical padding, borrowed from the Tooltip tier.

