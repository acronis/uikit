spec_version: '1.0'
component: BarChart

schematic: |
  orientation="vertical" (default) — the chart

  root: <div data-orientation="vertical" data-layout>   (variant wrapper)
    container: <ChartContainer>                     (themed, sized, responsive)
      plot: recharts <BarChart layout="horizontal">
        grid:    <CartesianGrid>                    (horizontal lines)
        x-axis:  <XAxis>   the category axis (xKey)
        y-axis:  <YAxis>   the numeric value axis
        band:    <ReferenceArea> per referenceArea entry (behind the bars)
        series:  one <Bar> per dataKey (grouped side-by-side or stacked)
          bar-track: <path> full-height track behind a bar (optional)
        tooltip: <ChartTooltip> → tooltip-content   (hover card)
        legend:  <ChartLegend>  → legend-content    (per-series swatch + label)
        brush:   <Brush>                            (only when showBrush)

  orientation="horizontal" — the labelled bar list

  root: <div data-orientation="horizontal">         (variant wrapper)
    bar-row: one per items entry                    (role="meter")
      bar-row-label:  the item label
      bar-row-value:  the formatted value + its share of max
      bar-row-track:  the track, filled to value/max in the item color
      tooltip-content: <TooltipContent>             (hover/focus card)

root:
  element: div
  description: >-
    The variant wrapper. Mirrors the resolved variants onto `data-orientation` /
    `data-layout` (`data-layout` only in the vertical mode). Under
    `orientation="vertical"` it renders the shared `ChartContainer` (sized to
    fill the wrapper) around the recharts `BarChart`; under
    `orientation="horizontal"` it is a plain column of `bar-row`s and carries no
    chart at all.

parts:
  - id: container
    element: div
    description: >-
      The shared `ChartContainer` — supplies the per-series `--color-<key>`
      custom properties from `config` and themes recharts' internals.
  - id: plot
    element: svg
    description: >-
      The recharts `BarChart`. Its `layout` names the axis the categories run
      along, which for bars rising out of an X axis is its `horizontal`.
  - id: grid
    element: g
    description: '`CartesianGrid` — horizontal lines, one per value tick.'
  - id: x-axis
    element: g
    description: '`XAxis` — the category axis (`xKey`).'
  - id: y-axis
    element: g
    description: '`YAxis` — the numeric value axis.'
  - id: series
    element: g
    description: >-
      One `Bar` per entry in `dataKeys`, filled from its `--color-<key>` var.
      Side-by-side when `layout=grouped`; sharing a `stackId` when `stacked`.
  - id: band
    element: g
    description: >-
      A `ReferenceArea` per `referenceArea` entry — a shaded region spanning a
      range of the category axis, drawn behind the bars. Its label captions the
      band, and the category ticks it covers render in the accent style unless
      the entry sets `highlightTicks: false`. With `divider`, a dashed rule
      marks the band's leading edge.
  - id: bar-track
    element: path
    description: >-
      The track behind a bar (a recharts `Rectangle`, so a `path`). Drawn for
      every bar when `showBackground` is on, or only over a `barSettings` range
      when that entry sets `background`.
      `background: true` fills the plot height; a data field name caps the track
      at that row's value, rendering it as a headroom segment stacked on the bar
      (grouped layout only).
  - id: tooltip-content
    element: div
    description: >-
      `ChartTooltipContent` — hover card with the category label and one row per
      series (color indicator + name + value). Rendered when `showTooltip`.
  - id: legend-content
    element: div
    description: >-
      `ChartLegendContent` — one swatch + label per series. Rendered when
      `showLegend`.
  - id: brush
    element: g
    description: >-
      `<Brush>` — the range selector rendered beneath the plot when `showBrush`
      is set. `brushHeight` sizes the strip; the handles and the range captions
      take the muted text token, the strip its secondary-surface background.
  - id: bar-row
    element: div
    description: >-
      `orientation="horizontal"` only. One row per `items` entry — Base UI's
      `Meter.Root`, so `role="meter"` with `aria-valuenow` / `aria-valuemax` and
      an `aria-valuetext` reading the value, the max, and the percentage. It
      takes focus only when `showTooltip` is on, so the tooltip is reachable
      without a pointer.
  - id: bar-row-label
    element: span
    description: >-
      `Meter.Label` — the item's label, truncated when the row is too narrow.
  - id: bar-row-value
    element: span
    description: >-
      The formatted value (`valueFormatter`) followed by its share of `max`,
      rounded to a whole percent.
  - id: bar-row-track
    element: div
    description: >-
      `Meter.Track` + `Meter.Indicator` — a rounded track filled to `value/max`
      in the item's own `color`.

states:
  - id: orientation-variant
    trigger: the orientation prop selects the chart or the labelled bar list
    kind: prop
    prop: orientation
    affects: [container, plot, grid, x-axis, y-axis, series, bar-row]
  - id: layout-variant
    trigger: the layout prop selects grouped or stacked bars
    kind: prop
    prop: layout
    # `stacked` sums the series, so it also grows the value-axis domain and its
    # grid ticks — not just the series arrangement.
    affects: [series, x-axis, y-axis, grid]
  - id: range-override
    trigger: a barSettings entry matches the bar's category
    kind: prop
    prop: barSettings
    affects: [series, bar-track]
  - id: bar-hover
    trigger: the pointer is over a bar and showActiveBar is on
    kind: pseudo
    pseudo: ':hover'
    affects: [series]
