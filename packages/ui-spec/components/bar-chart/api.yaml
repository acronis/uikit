spec_version: '1.0'
component: BarChart

# Framework-agnostic contract. `orientation` and `layout` are the CVA variant
# axes (conformance-checked against the ui-react cva keys). `data` / `config` /
# `dataKeys` / `xKey` are the data contract; the rest toggle chrome.
contract:
  properties:
    - name: orientation
      type: "'vertical' | 'horizontal'"
      required: false
      default: "'vertical'"
      description: >-
        Direction the bars grow. `vertical` = bars rise (category on the x-axis);
        `horizontal` = bars extend rightward (category on the y-axis).
    - name: layout
      type: "'grouped' | 'stacked'"
      required: false
      default: "'grouped'"
      description: >-
        How multiple series are arranged. `grouped` = side-by-side bars;
        `stacked` = segments summed on a shared `stackId`.
    - name: data
      type: ReadonlyArray<Record<string, string | number>>
      required: true
      description: Row-per-category data — each row holds `xKey` plus one numeric field per series.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Per-series map of label / color (from the shared Chart primitives).
        Turned into `--color-<key>` custom properties. Colors are caller-supplied.
    - name: dataKeys
      type: string[]
      required: true
      description: Series to plot — one bar per key. Each must exist in `config` and every data row.
    - name: xKey
      type: string
      required: true
      description: The category dimension key shared across rows.
    - name: referenceLine
      type: 'Line | Line[]  where Line = { value?: number; average?: boolean | string; label?: string }'
      required: false
      description: >-
        One or more dashed reference/average lines on the value axis (Y for
        vertical bars, X for horizontal). Pass a single object or an array. Per
        line, a fixed `value` wins; otherwise the mean of one series
        (`average: '<key>'`) or of every plotted series (`average: true`). An
        optional `label` captions each.
    - name: xAxisLabel
      type: string
      required: false
      description: Title rendered beneath the horizontal (X) axis.
    - name: yAxisLabel
      type: string
      required: false
      description: Title rendered beside the vertical (Y) axis (rotated).
    - name: xUnit
      type: string
      required: false
      description: >-
        Unit suffix appended to X-axis tick values (recharts `unit`); applies
        when the X axis is numeric (horizontal orientation).
    - name: yUnit
      type: string
      required: false
      description: >-
        Unit suffix appended to Y-axis tick values (recharts `unit`); applies
        when the Y axis is numeric (vertical orientation).
    - name: barRadius
      type: number
      required: false
      default: '4'
      description: Corner radius on the growing end of each bar (0 for square corners).
    - name: showGrid
      type: boolean
      required: false
      default: 'true'
      description: Render the CartesianGrid.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: showXAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the X axis (its ticks and title). Set false to hide it.
    - name: showYAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the Y axis (its ticks and title). Set false to hide it.
    - name: xTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each X-axis tick value. Unlike the `unit` suffix (append-only), a
        formatter transforms the value — abbreviate, prefix a symbol, or map to a
        label. Use formatCompactNumber / formatPercent / createTickFormatter from
        the shared Chart primitives, or any function.
    - name: yTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each Y-axis tick value (see xTickFormatter).
    - name: xAxisAngle
      type: number
      required: false
      description: Rotate the X-axis tick labels by this many degrees (a negative angle tilts them up toward the right); the tick anchor + axis height adjust.
    - name: xAxisInterval
      type: "number | 'preserveStart' | 'preserveEnd' | 'preserveStartEnd' | 'equidistantPreserveStart'"
      required: false
      description: >-
        X-axis tick density — a recharts placement strategy, or a fixed number of
        ticks to skip between two rendered ones (recharts interval: 0 shows every
        tick, 1 every other one, 2 every third).
    - name: yAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the value axis (recharts tickCount; a hint, not
        exact). Applies to whichever axis holds the values — Y for most charts, X
        for BarChart with orientation="horizontal".
    - name: yAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Value-axis domain preset — auto (fit the data at both ends; the axis need
        not include 0), zero (anchor the axis at 0, which is also recharts'
        behaviour when the prop is omitted), or dataMin-dataMax (tight to the
        data, no padding). Applies to whichever axis holds the values — Y for most
        charts, X for BarChart with orientation="horizontal".
    - name: gridDashed
      type: boolean
      required: false
      description: Draw grid lines dashed instead of solid.
    - name: gridHorizontal
      type: boolean
      required: false
      description: Show horizontal grid lines (defaults to the chart's own default when unset).
    - name: gridVertical
      type: boolean
      required: false
      description: Show vertical grid lines (defaults to the chart's own default when unset).
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
  events: []
  methods: []

adapters:
  react:
    component: BarChart
    status: implemented
    import: "import { BarChart } from '@acronis-platform/ui-react'"
    example: |
      <BarChart
        config={config}
        data={data}
        dataKeys={['desktop', 'mobile']}
        xKey="month"
        orientation="vertical"
        layout="grouped"
        className="h-[320px] w-[560px]"
      />
  vue:
    component: AvBarChart
    status: planned
    import: "import { AvBarChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvBarChart :config="config" :data="data" :data-keys="['desktop']" x-key="month" />
  web-components:
    element: ui-bar-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/bar-chart'"
    example: |
      <ui-bar-chart></ui-bar-chart>
