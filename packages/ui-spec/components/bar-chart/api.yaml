spec_version: '1.0'
component: BarChart

# Framework-agnostic contract. `orientation` and `layout` are the CVA variant
# axes (conformance-checked against the ui-react cva keys). `orientation` also
# selects which of the two renderings applies: `vertical` takes the
# `data` / `config` / `dataKeys` / `xKey` chart contract plus the chrome
# toggles, `horizontal` takes `items` / `max` / `valueFormatter` / `tooltip`.
contract:
  properties:
    - name: orientation
      type: "'vertical' | 'horizontal'"
      required: false
      default: "'vertical'"
      description: >-
        Which of the two renderings to use. `vertical` (the default) draws the
        chart: bars rising from a category x-axis, with axes, grid, tooltip and
        legend. `horizontal` draws a labelled proportional bar list instead —
        one row per `items` entry, no axes or grid. The two modes take different
        props: `data`/`config`/`dataKeys`/`xKey` and every chart knob below
        apply only to `vertical`; `items`, `max`, `valueFormatter` and `tooltip`
        only to `horizontal`.
    - name: items
      type: 'Array<{ label: string; value: number; color?: string; tone?: { status: ChartStatusTone }; forecast?: number }>'
      required: false
      description: >-
        Required when `orientation="horizontal"`. One row per entry — each
        renders as a labelled proportional bar carrying its value and share of
        `max`. Provide `color` (any CSS color; prefer a `--ui-*` token) when no
        `palette` is used, or `tone` together with `palette` to resolve the
        color from the palette. `color` and `tone` may both be set; `color`
        takes precedence. Optional `forecast`: projected total value — renders a
        translucent bar (30% opacity) extending beyond the actual value; the
        actual bar renders solid on top. Ignored when `forecast <= value`. ARIA
        values reflect the actual value; `aria-valuetext` also mentions the
        forecast. Ignored when `orientation="vertical"`.
    - name: max
      type: number
      required: false
      description: >-
        `orientation="horizontal"` only. Upper bound the item values are shares
        of. Defaults to the sum of every `items[].value`.
    - name: valueFormatter
      type: '(value: number) => string'
      required: false
      description: >-
        `orientation="horizontal"` only. Formats the numeric value in each row's
        label. Defaults to `toLocaleString()`.
    - name: tooltip
      type: ReactNode
      required: false
      description: >-
        `orientation="horizontal"` only. Tooltip content shared by every row,
        replacing the default (swatch + label + value of max + percentage).
        Ignored when `showTooltip` is false.
    - name: palette
      type: ChartPalette
      required: false
      description: >-
        `orientation="horizontal"` only. Dataviz palette to resolve each item's
        color from. When provided, each `items` entry should carry a `tone`
        (and can omit `color`). Colors are resolved in the same order and with
        the same tone rules as the vertical chart — `status` tones pick a
        specific stop, slot-less items consume the next available stop.
    - name: layout
      type: "'grouped' | 'stacked'"
      required: false
      default: "'grouped'"
      description: >-
        Vertical only. How multiple series are arranged. `grouped` =
        side-by-side bars; `stacked` = segments summed on a shared `stackId`.
    - name: data
      type: ReadonlyArray<Record<string, string | number>>
      required: false
      description: >-
        Required when `orientation="vertical"`. Row-per-category data — each row
        holds `xKey` plus one numeric field per series.
    - name: config
      type: ChartConfig
      required: false
      description: >-
        Required when `orientation="vertical"`. Series take their colour from
        the container's `palette`; each entry maps a data key to a `label` and
        an optional `tone`. Resolved into the `--color-<key>` custom properties
        the bars fill from.
    - name: dataKeys
      type: string[]
      required: false
      description: >-
        Required when `orientation="vertical"`. Series to plot — one bar per
        key. Each must exist in `config` and every data row.
    - name: xKey
      type: string
      required: false
      description: >-
        Required when `orientation="vertical"`. The category dimension key
        shared across rows.
    - name: referenceLine
      type: 'Line | Line[]  where Line = { value?: number; average?: boolean | string; label?: string }'
      required: false
      description: >-
        One or more dashed reference/average lines on the value (Y) axis. Pass a
        single object or an array. Per line, a fixed `value` wins; otherwise the
        mean of one series
        (`average: '<key>'`) or of every plotted series (`average: true`). An
        optional `label` captions each. Vertical only.
    - name: xAxisLabel
      type: string
      required: false
      description: Title rendered beneath the horizontal (X) axis.
    - name: yAxisLabel
      type: string
      required: false
      description: Title rendered beside the vertical (Y) axis (rotated).
    - name: yUnit
      type: string
      required: false
      description: >-
        Unit suffix appended to Y-axis tick values (recharts `unit`) — the Y
        axis is the numeric one.
    - name: referenceArea
      type: 'Area | Area[]  where Area = { from?: string | number; to?: string | number; label?: string; highlightTicks?: boolean; divider?: boolean }'
      required: false
      description: >-
        One or more shaded bands behind a range of categories — e.g. a forecast
        period. `from`/`to` are inclusive and take either the category's value
        or its 0-based row index; an omitted bound runs to that end of the data.
        The category ticks under a band pick up the accent styling unless
        `highlightTicks` is false, and `divider` adds a dashed rule on the
        band's leading edge for a forecast hand-off.
    - name: barSettings
      type: 'Record<string, { from?: string | number; to?: string | number; fill?: string; opacity?: number; dashed?: boolean; shape?: BarShape; background?: boolean | string }>'
      required: false
      description: >-
        Per-series style override for a range of categories, keyed by `dataKeys`
        entry — e.g. a projection tail that reads translucent and dashed over
        its own track. `background` takes `true` for a full-height track or a
        data field name to cap it at that row's value (the headroom up to an
        upper bound, which stacks on the bar and so needs `layout="grouped"`).
        Bars outside the range, and series with no entry, render normally.
    - name: barRadius
      type: number
      required: false
      default: '8'
      description: Corner radius on the growing end of each bar (0 for square corners).
    - name: barShape
      type: "'rounded' | 'pill' | 'gradient' | 'pattern'"
      required: false
      default: "'rounded'"
      description: >-
        How every bar is painted: the growing end rounded by `barRadius`, a
        capsule, a fade of the series color, or diagonal hatching in it.
        Per-range overrides come from `barSettings`.
    - name: barSize
      type: number
      required: false
      default: '8'
      description: Fixed bar thickness in px; unset, recharts sizes bars from the available width.
    - name: maxBarSize
      type: number
      required: false
      description: Upper bound on the computed bar thickness, in px.
    - name: barGap
      type: number | string
      required: false
      default: '4'
      description: Gap between the bars of one category, in px or a percentage string.
    - name: barCategoryGap
      type: number | string
      required: false
      description: Gap between category groups, in px or a percentage string.
    - name: minPointSize
      type: number
      required: false
      description: Minimum rendered length for a non-zero bar, in px, so tiny values stay visible.
    - name: showBackground
      type: boolean
      required: false
      default: 'false'
      description: Draw a full-height track behind every bar.
    - name: backgroundFill
      type: string
      required: false
      default: "'var(--ui-background-surface-secondary)'"
      description: Fill for the track background.
    - name: showActiveBar
      type: boolean
      required: false
      default: 'false'
      description: Highlight the hovered bar.
    - name: activeBar
      type: '{ fill?: string; opacity?: number }'
      required: false
      description: Painting of the hovered bar when `showActiveBar` is on; defaults to the series color.
    - name: showGrid
      type: boolean
      required: false
      default: 'true'
      description: Render the CartesianGrid.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: >-
        Render the hover tooltip — recharts' for `vertical`, the per-row tooltip
        for `horizontal`.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: showXAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the X axis (its ticks and title). Set false to hide it.
    - name: showYAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the Y axis (its ticks and title). Set false to hide it.
    - name: xTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each X-axis tick value. Unlike the `unit` suffix (append-only), a
        formatter transforms the value — abbreviate, prefix a symbol, or map to a
        label. Use formatCompactNumber / formatPercent / createTickFormatter from
        the shared Chart primitives, or any function.
    - name: yTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each Y-axis tick value (see xTickFormatter).
    - name: xAxisAngle
      type: number
      required: false
      description: Rotate the X-axis tick labels by this many degrees (a negative angle tilts them up toward the right); the tick anchor + axis height adjust.
    - name: xAxisInterval
      type: "number | 'preserveStart' | 'preserveEnd' | 'preserveStartEnd' | 'equidistantPreserveStart'"
      required: false
      description: >-
        X-axis tick density — a recharts placement strategy, or a fixed number of
        ticks to skip between two rendered ones (recharts interval: 0 shows every
        tick, 1 every other one, 2 every third).
    - name: yAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the value (Y) axis (recharts tickCount; a
        hint, not exact).
    - name: yAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Value-axis domain preset — auto (fit the data at both ends; the axis need
        not include 0), zero (anchor the axis at 0, which is also recharts'
        behaviour when the prop is omitted), or dataMin-dataMax (tight to the
        data, no padding). Applies to the value (Y) axis.
    - name: gridDashed
      type: boolean
      required: false
      default: 'true'
      description: Draw grid lines dashed instead of solid.
    - name: gridHorizontal
      type: boolean
      required: false
      description: Show horizontal grid lines (defaults to the chart's own default when unset).
    - name: gridVertical
      type: boolean
      required: false
      description: Show vertical grid lines (defaults to the chart's own default when unset).
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
    - name: showLabels
      type: boolean
      required: false
      default: 'false'
      description: Render a value label on each bar segment.
    - name: labelPosition
      type: "'top' | 'bottom' | 'left' | 'right' | 'center' | 'insideTop' | 'insideBottom' | 'insideLeft' | 'insideRight' | 'insideStart' | 'insideEnd'"
      required: false
      description: >-
        Where the value labels sit. Defaults to the bar's growing end (top), or
        center when layout is stacked.
    - name: labelFormatter
      type: '(value) => string'
      required: false
      description: Format each label value (reuses the tick formatters).
    - name: showBrush
      type: boolean
      required: false
      default: 'false'
      description: >-
        Render a range brush beneath the chart — drag a handle (or the selected
        window) to zoom the series into a slice of the data.
    - name: brushHeight
      type: number
      required: false
      default: '28'
      description: >-
        Height of the brush strip in px. A non-positive value falls back to the
        default rather than erasing the brush.
    - name: brushAriaLabel
      type: string
      required: false
      default: "'Chart range selector'"
      description: >-
        Accessible name for the brush's two range handles, which are focusable
        `role="slider"` elements. Consumers localize by passing their own.
  events: []
  methods: []

adapters:
  react:
    component: BarChart
    status: implemented
    import: "import { BarChart } from '@acronis-platform/ui-react'"
    example: |
      <BarChart
        config={config}
        data={data}
        dataKeys={['desktop', 'mobile']}
        xKey="month"
        layout="grouped"
        className="h-[320px] w-[560px]"
      />

      <BarChart
        orientation="horizontal"
        palette={{ type: 'status' }}
        items={[
          { label: 'Critical', value: 6, tone: { status: 'danger' } },
          { label: 'High', value: 9, tone: { status: 'warning' } },
        ]}
        max={29}
      />
  vue:
    component: AvBarChart
    status: planned
    import: "import { AvBarChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvBarChart :config="config" :data="data" :data-keys="['desktop']" x-key="month" />
  web-components:
    element: ui-bar-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/bar-chart'"
    example: |
      <ui-bar-chart></ui-bar-chart>
