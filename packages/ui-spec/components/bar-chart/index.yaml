spec_version: '1.0'
component: BarChart
name: bar-chart
status: draft
category: data-display
description: >-
  Two renderings behind one name, selected by `orientation`. `vertical` (the
  default) is a typed bar-chart composition over the shared `Chart` primitives:
  `data` + `config` + a set of series `dataKeys` become a themed recharts
  `BarChart` inside a `ChartContainer`, with tooltip and legend chrome, grouped
  or stacked by `layout`. `horizontal` is a labelled proportional bar list —
  one row per `items` entry carrying its label, value, share of `max`, and a
  track bar — with no axes, grid, or recharts at all.
since: 0.57.0
