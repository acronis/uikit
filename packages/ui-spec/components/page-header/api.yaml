spec_version: '1.0'
component: PageHeader

# Parts take native element attributes. PageHeaderTitle also exposes a heading level.
contract:
  properties:
    - name: PageHeader.role
      type: string
      required: false
      default: banner
      description: >-
        Native role override for the root div. PageHeader is a banner landmark
        by default. Set role="none" when composing an embedded PageHeader
        beneath an existing page-level banner to avoid adding a second banner
        landmark; this does not change the heading semantics of its contents.
    - name: PageHeaderTitle.as
      type: "'h1' | 'h2'"
      required: false
      default: h1
      description: >-
        The heading element used for PageHeaderTitle. Use h1 for a page's primary
        title and h2 when the title is nested under an existing page title, such
        as an embedded view. Both levels share the same visual style.
  events: []
  methods: []

adapters:
  react:
    component: PageHeader
    status: implemented
    import: "import { PageHeader, PageHeaderRow, PageHeaderTitle, PageHeaderTags, PageHeaderActions, PageHeaderDescriptionRow, PageHeaderDescription } from '@acronis-platform/ui-react'"
    example: |
      <PageHeader>
        <PageHeaderRow>
          <PageHeaderTitle>Reports</PageHeaderTitle>
          <PageHeaderTags><Tag variant="info">Customer</Tag></PageHeaderTags>
          <PageHeaderActions><Button>New</Button></PageHeaderActions>
        </PageHeaderRow>
        <PageHeaderDescriptionRow>
          <PageHeaderDescription>All scheduled reports.</PageHeaderDescription>
        </PageHeaderDescriptionRow>
      </PageHeader>
  vue:
    component: AvPageHeader
    status: planned
    import: "import { AvPageHeader } from '@acronis-platform/ui-vue'"
    example: |
      <AvPageHeader title="Reports" />
  web-components:
    element: ui-page-header
    status: planned
    import: "import '@acronis-platform/ui-wc/page-header'"
    example: |
      <ui-page-header></ui-page-header>
