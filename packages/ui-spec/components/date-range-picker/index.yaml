spec_version: '1.0'
component: DateRangePicker
name: date-range-picker
status: draft
category: forms
description: >-
  A range date field: an `InputDatePicker` trigger opens a popover with a
  dual-month range `CalendarPanel`, whose own Cancel/Apply footer commits or
  reverts the draft. Edits stay in a draft until Apply commits them (Cancel or
  dismissing reverts).
since: 0.56.0
dependencies:
  components:
    - InputDatePicker
    - CalendarPanel
    - Popover
