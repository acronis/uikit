spec_version: '1.0'
component: DateRangePicker

schematic: |
  +-----------------------------------------------+
  | trigger: [ start – end            calendar ]  |  InputDatePicker (pickerType=dateRange)
  +-----------------------------------------------+
             │ opens
             ▼
  popup (Popover content) ────────────────────────────────────
  | calendar:  [Month ⌄][Year ⌄]      [Month ⌄][Year ⌄]         |
  |            Su Mo Tu … Sa       Su Mo Tu … Sa               |
  |            [range grid, dual-month, CalendarPanel variant=range,
  |             hideNavigation — no prev/next chevrons, month/year
  |             dropdowns are the only navigation]              |
  |-----------------------------------------------------------|
  | cancel "Cancel"                              apply "Apply" |
  ------------------------------------------------------------

root:
  element: div
  description: >-
    `Popover.Root` (Base UI) owns the open/draft state and renders no element of
    its own; the outermost DOM node is the `InputDatePicker` trigger's field
    `<div>`, which carries no role. The popover is portaled; positioning, focus
    management, and outside-press / Escape dismissal come from the Popover
    primitive.

parts:
  - id: trigger
    description: >-
      The `InputDatePicker` field (`pickerType="dateRange"`) showing the applied
      start–end range and a calendar icon; activating it opens the popup.
    element: button
  - id: popup
    description: >-
      The Popover content panel holding the `CalendarPanel`. Its own
      container chrome (border, radius, shadow, background) is neutralized
      via `className` so only `CalendarPanel`'s chrome is visible; Popover
      contributes positioning, portaling and dismissal only.
    element: div
  - id: calendar
    description: >-
      A `CalendarPanel` (`variant="range"`) bound to the draft range; its own
      Cancel/Apply footer is this component's footer.
    element: div
  - id: cancel
    description: The `CalendarPanel` footer's "Cancel" action, reverting the draft to the applied range and closing the popup.
    element: button
  - id: apply
    description: The `CalendarPanel` footer's "Apply" action, committing the draft via `onValueChange` and closing the popup.
    element: button

layout:
  type: stack
  direction: vertical
  align: start
  order: [trigger, popup, calendar, cancel, apply]

internal_state:
  - id: open
    type: boolean
    initial: false
    changed_by: trigger click opens; outside-press / Escape / Apply close
    description: Whether the popover is open.
  - id: draft
    type: DateRange
    initial: 'the applied range (snapshotted on open)'
    controllable_via: [value, default-value]
    changed_by: calendar selection
    description: >-
      The in-progress range being edited inside the popover. Committed to the
      applied value only on Apply; reverted to the applied value on Cancel or
      dismiss.

states:
  - id: hover
    trigger: pointer hover over the trigger (enabled)
    kind: pseudo
    pseudo: ':hover'
    affects: [trigger]
  - id: focus-visible
    trigger: keyboard focus on the trigger
    kind: pseudo
    pseudo: ':focus-visible'
    affects: [trigger]
  - id: open
    trigger: the popover is open
    kind: internal
    affects: [trigger, popup]
  - id: error
    trigger: 'error is set'
    kind: prop
    prop: error
    affects: [trigger]
  - id: disabled
    trigger: 'disabled === true'
    kind: prop
    prop: disabled
    affects: [trigger]
