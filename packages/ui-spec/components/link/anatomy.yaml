spec_version: '1.0'
component: Link

schematic: |
  +---------------------------+
  |  label  (icon)            |   root: <a> (role=link), inline
  +---------------------------+
   label -> the link text (semibold; underlines on hover)
   icon  -> optional trailing external-link icon (when `external`)

root:
  element: a
  role: link
  description: >-
    The inline anchor. Semibold 14/24 text in `--ui-link-<surface>-text-color-idle`,
    where `<surface>` is the `variant` prop (`normal` / `inverse`); hover adds the
    `--ui-link-global-text-decoration-hover` underline + `-color-hover`; `:active` uses
    `-color-active`. Polymorphic via `render` (e.g. a router link). When `disabled`,
    it is inert — removed from the tab order, no href — and on the `normal` surface also
    recolored to `--ui-link-normal-text-color-disabled`; the `inverse` surface has no
    disabled color (none is authored for a backdrop).

parts:
  - id: label
    description: The link text (the children).
    element: text
  - id: icon
    description: >-
      Optional trailing external-link icon (SquareArrowUpRightIcon), shown when
      `external` **and** `variant="normal"` — the design defines this part only on the
      normal surface. `--ui-link-normal-external-icon-color-*`, wired separately from
      the label color.
    element: svg
    optional: true

layout:
  type: flex
  direction: row
  align: center
  order: [label, icon]

states:
  - {
      id: hover,
      trigger: pointer hover,
      kind: pseudo,
      pseudo: ':hover',
      affects: [label, icon],
    }
  - {
      id: active,
      trigger: pressed (pointer down),
      kind: pseudo,
      pseudo: ':active',
      affects: [label, icon],
    }
  - {
      id: focus-visible,
      trigger: keyboard focus,
      kind: pseudo,
      pseudo: ':focus-visible',
      affects: [root],
    }
  - {
      id: disabled,
      trigger: 'disabled === true (variant="normal" only — ignored on "inverse")',
      kind: prop,
      prop: disabled,
      affects: [label, icon],
    }
