spec_version: '1.0'
component: ChartState

# References only. Values live in @acronis-platform/tokens-pd.
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-text-on-surface-primary
    affects: message
    description: The state message text.
  - name: --ui-text-on-surface-disabled
    affects: numeric-value
    description: Disabled-style KPI value in the number state.
  - name: --ui-background-status-neutral-hover
    affects: state-icon
    description: Background circle for the empty state glyph.
  - name: --ui-background-status-warning
    affects: state-icon
    description: Background circle for the warning state glyph.
  - name: --ui-background-status-critical
    affects: state-icon
    description: Background circle for the error state glyph.
  - name: --ui-background-brand-secondary
    affects: loading-spinner
    description: Loading spinner color inherited from the shared Spinner.
