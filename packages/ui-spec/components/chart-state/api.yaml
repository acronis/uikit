spec_version: '1.0'
component: ChartState

# No cva: state selects the semantic icon, default copy, and live-region role.
contract:
  properties:
    - name: state
      type: "'loading' | 'empty' | 'warning' | 'error' | 'number'"
      required: true
      description: >-
        Which state to show. Loading uses the shared spinner; empty, warning,
        and error use the shared circular status icon; number shows a centered
        disabled-style KPI value. Error is an assertive alert; other states are
        polite status messages.
    - name: description
      type: ReactNode
      required: false
      description: >-
        Localized or context-specific content. For `number`, this is the
        numeric readout. Defaults to "Data is loading…", "No data found",
        "Data may be incomplete", "Something went wrong", or "0".
  events: []
  methods: []

adapters:
  react:
    component: ChartState
    status: implemented
    import: "import { ChartState } from '@acronis-platform/ui-react'"
    example: |
      <ChartState state="loading" />
      <ChartState state="empty" description={t('chart.noData')} />
      <ChartState state="warning" description={t('chart.partialData')} />
      <ChartState state="error" description={t('chart.loadError')} />
      <ChartState state="number" description="0 GB" />
  vue:
    component: AvChartState
    status: planned
    import: "import { AvChartState } from '@acronis-platform/ui-vue'"
    example: |
      <AvChartState state="loading" />
  web-components:
    element: ui-chart-state
    status: planned
    import: "import '@acronis-platform/ui-wc/chart-state'"
    example: |
      <ui-chart-state state="loading"></ui-chart-state>
