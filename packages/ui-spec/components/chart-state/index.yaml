spec_version: '1.0'
component: ChartState
name: chart-state
status: draft
category: data-display
description: >-
  Shared loading / empty / warning / error / number visuals for a chart slot.
  Empty, warning, and error use the Breakpoints visual treatment: a 64px status
  circle with a 24px glyph and centered message. Number shows a centered KPI
  value; loading uses the shared spinner. Consumers select the state and may
  localize its content through `description`. Distinct from `WidgetPlaceholder`,
  which is the composable skeleton for a non-chart widget.
since: 0.58.0
