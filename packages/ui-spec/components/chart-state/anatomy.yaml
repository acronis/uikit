spec_version: '1.0'
component: ChartState

schematic: |
  root: <div role="status|alert"> (centered column, fills the chart slot)
    glyph: loading -> Spinner (lg) · empty -> the `variant`'s silhouette, or
           InboxIcon when no variant · error -> CircleWarningIcon
    label: <p> one line — the `description` for a per-type empty state, else the
           per-state message (overridable via `message`)
    action: error only — optional trailing node (e.g. a "Try again" button)

root:
  element: div
  role: status
  description: >-
    Centered column that fills its slot (`size-full`, `min-h-32`). Announces as
    a live region — `role="status"` (`aria-live="polite"`) for loading/empty and
    `role="alert"` (`aria-live="assertive"`) for error. No `aria-busy` on the
    region itself — it would risk suppressing the loading announcement.

parts:
  - id: glyph
    element: svg | div
    description: >-
      The leading state glyph — the shared `Spinner` (lg) for loading, the
      `CircleWarningIcon` for error, and for empty either the `variant`'s
      silhouette (geometry exported from the Figma empty-state instances, every
      path `currentColor`) or the `InboxIcon` when no variant is given.
  - id: label
    element: p
    description: >-
      One line of text, in one style whichever it is — Figma's `body/default` on
      `text/onSurface/primary` (14/24, centred), which the root already sets. For
      an `empty` state with a `description` that is the description; otherwise
      the per-state message, overridable via `message`.

  - id: action
    element: slot
    description: >-
      Optional trailing action, rendered for the error state only (e.g. a "Try
      again" button).

states:
  - {
      id: loading,
      trigger: "state === 'loading'",
      kind: prop,
      prop: state,
      affects: [root, glyph, label],
    }
  - {
      id: empty,
      trigger: "state === 'empty'",
      kind: prop,
      prop: state,
      affects: [root, glyph, label],
    }
  - {
      id: error,
      trigger: "state === 'error'",
      kind: prop,
      prop: state,
      affects: [root, glyph, label, action],
    }
