spec_version: '1.0'
component: ChartState

schematic: |
  root: <div role="status|alert"> (flex column, fills the chart slot)
    loading/empty: centered via `justify-center`
      glyph: Spinner (lg) or variant silhouette
      label: <p>
    error: scrollable via `overflow-y: auto`
      error-content: <div class="my-auto"> (centers when fits, top-aligns on overflow)
        glyph: CircleWarningIcon (shrink-0)
        label: <p class="break-words"> (wraps long unbroken strings)
        action: optional trailing node (e.g. a "Try again" button)

root:
  element: div
  role: status
  description: >-
    Flex column that fills its slot (`size-full`, `min-h-32`). Loading/empty
    center their content via `justify-center`. Error uses `overflow-y: auto` +
    `overflow-x: hidden`, with content wrapped in a `my-auto` div that centers
    short messages yet collapses to top-aligned when the description overflows.
    Announces as a live region — `role="status"` (`aria-live="polite"`) for
    loading/empty and `role="alert"` (`aria-live="assertive"`) for error. No
    `aria-busy` on the region itself — it would risk suppressing the loading
    announcement.

parts:
  - id: glyph
    element: svg | div
    description: >-
      The leading state glyph — the shared `Spinner` (lg) for loading, the
      `CircleWarningIcon` for error, and for empty either the `variant`'s
      silhouette (geometry exported from the Figma empty-state instances, every
      path `currentColor`) or nothing when no variant is given.
  - id: label
    element: p
    description: >-
      One line of text, in one style whichever it is — Figma's `body/default` on
      `text/onSurface/primary` (14/24, centred), which the root already sets. The
      `description` prop overrides the default for any state; otherwise the
      per-state default is used ("Data is loading…" / "No data found" /
      "Something went wrong").

  - id: action
    element: slot
    description: >-
      Optional trailing action, rendered for the error state only (e.g. a "Try
      again" button).

states:
  - {
      id: loading,
      trigger: "state === 'loading'",
      kind: prop,
      prop: state,
      affects: [root, glyph, label],
    }
  - {
      id: empty,
      trigger: "state === 'empty'",
      kind: prop,
      prop: state,
      affects: [root, glyph, label],
    }
  - {
      id: error,
      trigger: "state === 'error'",
      kind: prop,
      prop: state,
      affects: [root, glyph, label, action],
    }
