spec_version: '1.0'
component: ChartState

schematic: |
  root: <div role="status|alert"> (fills the chart slot)
    loading-spinner: Spinner (lg) + message, centered
    empty/warning/error: centered group
      state-icon: 64px status-colored circle
        glyph: 24px multi-color icon
      message: <p> (14px / 24px, centered)
    numeric-value: centered disabled-style value for number state (48px / 64px)

root:
  element: div
  role: status
  description: >-
    Fills the chart slot and centers its state content. Loading, empty, warning,
    and number announce through role="status" with aria-live="polite". Error
    announces through role="alert" with aria-live="assertive" and scrolls
    vertically when its diagnostic message exceeds the slot height. It has no
    fixed minimum height, so the component fits the card body Figma specifies.

parts:
  - id: state-icon
    element: span
    description: >-
      For empty, warning, and error, a 64px circle containing the matching 24px
      multi-color status glyph. The circle background uses the neutral-hover,
      warning, or critical semantic background token. Decorative to assistive
      technology; the message carries the state meaning.
  - id: message
    element: p
    description: >-
      Centered 14px / 24px text in the primary on-surface color. The consumer
      can provide localized or context-specific content through `description`.
  - id: loading-spinner
    element: div
    description: >-
      The shared large Spinner, hidden from assistive technology because the
      root live region announces the message.
  - id: numeric-value
    element: p
    description: >-
      Centered 48px / 64px KPI value in the disabled on-surface text color.
      Defaults to `0`; consumers can pass a value and unit in `description`.

states:
  - {
      id: loading,
      trigger: "state === 'loading'",
      kind: prop,
      prop: state,
      affects: [root, loading-spinner, message],
    }
  - {
      id: empty,
      trigger: "state === 'empty'",
      kind: prop,
      prop: state,
      affects: [root, state-icon, message],
    }
  - {
      id: warning,
      trigger: "state === 'warning'",
      kind: prop,
      prop: state,
      affects: [root, state-icon, message],
    }
  - {
      id: error,
      trigger: "state === 'error'",
      kind: prop,
      prop: state,
      affects: [root, state-icon, message],
    }
  - {
      id: number,
      trigger: "state === 'number'",
      kind: prop,
      prop: state,
      affects: [root, numeric-value],
    }
