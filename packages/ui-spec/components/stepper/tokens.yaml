spec_version: '1.0'
component: Stepper

# References only. Values live in @acronis-platform/tokens-pd and resolve per
# brand/theme at paint time; never restate values here.
#
# ── Dedicated `--ui-stepper-breakpoint-*` tier (re-synced 2026-08-24) ──
# @acronis-platform/tokens-pd now ships a `Stepper` tier
# (`packages/tokens-pd/css/Stepper/default.css`), generated from a Figma sync.
# This replaces the semantic/generic placeholder tokens (`--ui-gap-4`,
# `--ui-gap-8`, `--ui-text-on-surface-{secondary,primary}`) the implementation
# used before the tier existed. The tier defines one shared `value-color`/
# `label-color` pair for both the current-step line and the next-step line, so
# a single token covers both.
#
# The breakpoint itself is deliberately absent from this list, for two separate
# reasons. First, it is not a design token at all: `--ui-breakpoint-lg` is a
# hand-authored layout bridge var declared in ui-react's own
# `src/styles/index.css` (there is no Figma source for it, so style-dictionary
# emits nothing), not an entry in any `tokens-pd` tier — listing it here would
# claim a generated token that does not exist. Second, the layout switch does
# not read it anyway: a `@media` condition cannot read a custom property, so it
# is written with Tailwind's compile-time `lg:` variant. See the comment block
# in `stepper.tsx`.
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-stepper-breakpoint-default-line-gap
    affects: summary
    description: >-
      Vertical gap between the two summary lines in the compact (< 1024px) layout.
  - name: --ui-stepper-breakpoint-lg-container-gap
    affects: items-row
    description: >-
      Gap between `StepperItem` children in the wide row, both between columns and
      between wrapped lines. It is the only spacing the row owns — a step's own
      padding comes from `StepperItem`'s tokens.
  - name: --ui-stepper-breakpoint-default-label-color
    affects: current-line
    description: >-
      The generated prefix copy — "Step", "of", the counter digits, and "Next:"
      — on both summary lines.
  - name: --ui-stepper-breakpoint-default-value-color
    affects: next-line
    description: >-
      The step names themselves on both summary lines.
