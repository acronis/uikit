spec_version: '1.0'
component: InputSelect

# Framework-agnostic contract for a *composable* select field assembled from parts
# (see anatomy.yaml). Property names are neutral; see `adapters` for per-framework
# syntax. Selection and open state are each controllable or uncontrolled. The label,
# required marker, description, and error are field furniture composed around the
# trigger; the dropdown (search / sections / items / status) is composed inside the
# content.
contract:
  properties:
    - name: value
      type: string | string[]
      required: false
      description: Controlled selected value(s). Pair with the change event.
    - name: default-value
      type: string | string[]
      required: false
      description: Initial selection when uncontrolled.
    - name: open
      type: boolean
      required: false
      description: Controlled open state of the options popup.
    - name: default-open
      type: boolean
      required: false
      default: false
      description: Whether the popup is initially open when uncontrolled.
    - name: disabled
      type: boolean
      required: false
      default: false
      description: Disables the control; applies the disabled tokens and blocks opening.
    - name: multiple
      type: boolean
      required: false
      default: false
      description: >-
        Whether more than one option can be selected. Items show a leading
        checkbox and the popup stays open on select.
    - name: required
      type: boolean
      required: false
      default: false
      description: Marks the control required; the label shows a `*` marker.
    - name: name
      type: string
      required: false
      description: Form field name submitted with the form (via a hidden input).
    - name: placeholder
      type: string
      required: false
      description: Hint shown by the value part when nothing is selected.
    - name: items
      type: Record<string, string>
      required: false
      description: >-
        Map of value → label for every selectable option, so the value part
        can render a selected option's label while the popup is closed
        without inspecting the rendered items.
    - name: side
      type: "'top' | 'bottom' | 'left' | 'right' | 'inline-start' | 'inline-end'"
      required: false
      default: "'bottom'"
      description: On the content — which side of the trigger the popup renders on.
    - name: align
      type: "'start' | 'center' | 'end'"
      required: false
      default: "'start'"
      description: On the content — alignment along the chosen side.
    - name: side-offset
      type: number
      required: false
      default: 4
      description: On the content — distance in px from the trigger.
    - name: align-offset
      type: number
      required: false
      default: 0
      description: >-
        On the content — offset in px along the alignment axis (perpendicular
        to `side`), to nudge the popup along the trigger's edge without
        changing its alignment.
    - name: collision-avoidance
      type: "{ side?: 'flip' | 'shift' | 'none'; align?: 'flip' | 'shift' | 'none'; fallbackAxisSide?: 'start' | 'end' | 'none' }"
      required: false
      default: the platform default (flip/shift)
      description: >-
        On the content — collision-avoidance strategy. Pass `{ side: 'none',
        fallbackAxisSide: 'none' }` alongside an explicit `side`/`align` to
        lock the popup to that placement with no auto-flip fallback.
    - name: anchor
      type: Element | VirtualElement | RefObject<Element | null> | (() => Element | VirtualElement | null) | null
      required: false
      default: the trigger element
      description: >-
        On the content — element (or ref/getter) the popup positions itself
        against, overriding the default of anchoring to the trigger. Use when
        the visible trigger isn't the element tracked internally — e.g. an
        external button drives a hidden trigger, and the popup should align
        with the button instead.
    - name: portal-container
      type: Element | ShadowRoot | null | RefObject<Element | ShadowRoot | null>
      required: false
      default: 'nearest PortalContainerProvider, or document.body'
      description: >-
        On the content — container to portal the dropdown into. Pass an
        element to scope the portal (e.g. a shadow root, so the popup
        inherits styles defined there).
    - name: is-popover-styled
      type: boolean
      required: false
      default: false
      description: >-
        On the content — render the dropdown chrome like `PopoverContent`
        (fade/zoom/slide animation, no shadow) instead of the default
        static-shadow dropdown chrome.

  events:
    - name: value-change
      payload: string | string[]
      description: >-
        Fired when the selection changes (React: `onValueChange`).
    - name: open-change
      payload: boolean
      description: >-
        Fired when the popup opens or closes (React: `onOpenChange`).

  content:
    - name: default
      description: >-
        The composed field: a field wrapper holding the label, the trigger (with
        the value), and the description / error; then the content holding the
        optional search, sections, items, or a status row. Provide an `items` map
        on the root so the value part can render a selected option's label while
        the popup is closed.

  methods:
    - name: use-input-select-filter
      signature: '() => { query: string, setQuery: (query: string) => void }'
      description: >-
        Reads/sets the search query set by the search part; for custom (e.g.
        tree) item renderers that need to filter outside the default
        `InputSelectItem` auto-filter. Must be called within `InputSelect`
        (React: `useInputSelectFilter`).

adapters:
  react:
    component: InputSelect
    status: implemented
    import: >-
      import { InputSelect, InputSelectField, InputSelectLabel, InputSelectTrigger,
      InputSelectValue, InputSelectContent, InputSelectSearch, InputSelectSection,
      InputSelectSectionLabel, InputSelectItem, InputSelectExpander,
      InputSelectDescription, InputSelectError, InputSelectStatus,
      useInputSelectFilter } from '@acronis-platform/ui-react'
    example: |
      <InputSelect items={{ apple: 'Apple', banana: 'Banana' }} value={fruit} onValueChange={setFruit}>
        <InputSelectField>
          <InputSelectLabel required>Fruit</InputSelectLabel>
          <InputSelectTrigger aria-invalid={Boolean(error)}>
            <InputSelectValue placeholder="Select an option" />
          </InputSelectTrigger>
          {error ? (
            <InputSelectError>{error}</InputSelectError>
          ) : (
            <InputSelectDescription>Pick your favourite</InputSelectDescription>
          )}
        </InputSelectField>
        <InputSelectContent>
          <InputSelectSearch placeholder="Search" value={q} onChange={(e) => setQ(e.target.value)} />
          <InputSelectSection>
            <InputSelectSectionLabel>Fruits</InputSelectSectionLabel>
            <InputSelectItem value="apple">Apple</InputSelectItem>
            <InputSelectItem value="banana">Banana</InputSelectItem>
          </InputSelectSection>
        </InputSelectContent>
      </InputSelect>

      {/* Status (instead of items) */}
      <InputSelectContent>
        <InputSelectStatus variant="empty">No data found</InputSelectStatus>
      </InputSelectContent>
  vue:
    component: AvInputSelect
    status: planned
    import: "import { AvInputSelect } from '@acronis-platform/ui-vue'"
    example: |
      <AvInputSelect v-model="fruit" :items="items" label="Fruit" placeholder="Select an option" />
  web-components:
    element: ui-input-select
    status: planned
    import: "import '@acronis-platform/ui-wc/input-select'"
    example: |
      <ui-input-select label="Fruit" placeholder="Select an option"></ui-input-select>
