spec_version: '1.0'
component: ComposedChart

schematic: |
  root: <div>                                       (wrapper)
    container: <ChartContainer>                     (themed, sized, responsive)
      plot: recharts <ComposedChart>
        grid:    <CartesianGrid>                    (horizontal value lines)
        x-axis:  <XAxis>   category (xKey)
        y-axis:  <YAxis>   primary numeric value axis
        y-axis-secondary: <YAxis>  second value axis, opposite side
                                   (only when a series selects it)
        series:  one <Bar> / <Line> / <Area> per series[] entry (per its type)
        tooltip: <ChartTooltip> → tooltip-content   (hover card)
        legend:  <ChartLegend>  → legend-content    (per-series swatch + label)
        brush:   <Brush>                            (only when showBrush)

root:
  element: div
  description: >-
    The wrapper. Renders the shared `ChartContainer` (sized to fill it) around
    the recharts `ComposedChart`. ComposedChart has no CVA variants, so the root
    carries no variant data-attributes.

parts:
  - id: container
    element: div
    description: >-
      The shared `ChartContainer` — supplies the per-series `--color-<key>`
      custom properties from `config` and themes recharts' internals.
  - id: plot
    element: svg
    description: The recharts `ComposedChart` holding the axes, grid, and mixed series.
  - id: grid
    element: g
    description: '`CartesianGrid` — horizontal value lines (vertical lines suppressed).'
  - id: x-axis
    element: g
    description: '`XAxis` — the category axis (`xKey`).'
  - id: y-axis
    element: g
    description: >-
      `YAxis` — the primary numeric value axis, shared by every series that does
      not select the secondary one. Sits on the side given by `yAxisOrientation`
      (left by default), and is the axis the grid's horizontal lines follow. Not
      rendered at all when every series selects the secondary axis: it would have
      nothing measured against it, so it gives up its gutter and the grid follows
      the secondary axis instead.
  - id: y-axis-secondary
    element: g
    description: >-
      A second `YAxis` on the opposite side, with its own unit, tick formatter,
      tick count, and domain. Present only when at least one `series[]` entry sets
      `yAxis: secondary`; `showSecondaryYAxis: false` hides its chrome while
      keeping its scale.
  - id: series
    element: g
    description: >-
      One recharts element per `series[]` entry, chosen by its `type`: `<Bar>`
      (rounded by `barRadius`), `<Area>` (filled at `fillOpacity`, curved by
      `curve`), or `<Line>` (curved by `curve`). Rendered in the caller's
      `series` order — later entries paint on top. Each paints from its
      `--color-<key>` var.
  - id: brush
    element: g
    description: >-
      `<Brush>` — the range selector rendered beneath the plot when `showBrush`
      is set. `brushHeight` sizes the strip; the handles and the range captions
      take the muted text token, the strip its secondary-surface background.
  - id: tooltip-content
    element: div
    description: >-
      `ChartTooltipContent` — hover card with the category label and one row per
      series (color indicator + name + value). Rendered when `showTooltip`.
  - id: legend-content
    element: div
    description: >-
      `ChartLegendContent` — one swatch + label per series. Rendered when
      `showLegend`.

states:
  - id: curve-variant
    trigger: the curve prop sets the interpolation for line and area series
    kind: prop
    prop: curve
    affects: [series]
  - id: dual-value-axis
    trigger: a series[] entry sets yAxis to secondary
    kind: prop
    prop: series
    affects: [y-axis-secondary, series]
