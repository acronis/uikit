spec_version: '1.0'
component: ComposedChart

# Framework-agnostic contract. `orientation` is the single cva variant axis
# (conformance-checked against the ui-react cva keys); the mark mix is not a
# variant — it is data-driven via each `series[].type` (bar / line / area) over
# one shared category axis.
contract:
  properties:
    - name: orientation
      type: "'vertical' | 'horizontal'"
      required: false
      default: "'vertical'"
      description: >-
        Direction the marks grow. `vertical` = bars rise and the categories sit on
        the x-axis; `horizontal` = bars extend rightward, the categories move to
        the y-axis and the values to x (where a secondary value axis becomes a
        second x-axis along the top edge).
    - name: data
      type: ReadonlyArray<Record<string, string | number | null>>
      required: true
      description: >-
        Row-per-category data — each row holds `xKey` plus one numeric field per
        series. A null value breaks the line/area at that point unless
        `connectNulls` is set.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Per-series map of label / color, keyed by `series[].key` (from the shared
        Chart primitives). Turned into `--color-<key>` custom properties. Colors
        are caller-supplied.
    - name: series
      type: ComposedSeries[]
      required: true
      description: >-
        Series to plot, each `{ key, type }` plus any per-series override.
        `type` is `bar` / `line` / `area`. Rendered in array order — later entries
        sit on top, whatever their mark type; order them so a thin line comes after
        the bars/areas it should overlay. Each key must exist in `config` and every
        data row. Per-series keys, each overriding the chart-level default of the
        same name where one exists — `yAxis` (`primary` / `secondary`, which value
        axis the series is measured against), `color`, `stackId` (stacks with the
        series of the same mark type carrying that id; ignored on a line),
        `curve`, `strokeWidth`, `strokeDasharray`, `showDots`, `showActiveDots`,
        `connectNulls`, `barRadius`, `barSize`, `showActiveBar`, `showBackground`,
        `fillOpacity`, and `legendType` (`line` / `rect` / `none`, where `none`
        keeps the series off the legend).
    - name: xKey
      type: string
      required: true
      description: The category dimension key shared across rows.
    - name: xAxisLabel
      type: string
      required: false
      description: Title rendered beneath the horizontal (X) axis.
    - name: yAxisLabel
      type: string
      required: false
      description: Title rendered beside the vertical (Y) axis (rotated).
    - name: yUnit
      type: string
      required: false
      description: >-
        Unit suffix appended to Y-axis tick values (recharts `unit`); the X axis
        is categorical.
    - name: referenceLine
      type: ComposedChartReferenceLine | ComposedChartReferenceLine[]
      required: false
      description: >-
        One or more dashed rules. A `value` (or an `average` of one/every series)
        places the rule on the value axis; a `category` places it across the
        category axis at that category — the hand-off into a forecast. Each takes
        an optional `label`; a value position wins when both are given, and a
        category that is not in the data draws nothing.
    - name: referenceArea
      type: ComposedChartReferenceArea | ComposedChartReferenceArea[]
      required: false
      description: >-
        One or more shaded bands behind a range of categories (`from` / `to`,
        inclusive, each a category value or a row index, either omittable) with an
        optional `label`.
    - name: curve
      type: "'linear' | 'monotone' | 'step'"
      required: false
      default: "'monotone'"
      description: Interpolation for the line and area series. Per-series `curve` overrides it.
    - name: xUnit
      type: string
      required: false
      description: >-
        Unit suffix on the value-axis tick values when the values are on X
        (`orientation="horizontal"`).
    - name: strokeWidth
      type: number
      required: false
      default: '2 (line series)'
      description: >-
        Stroke width for the line series. Area series keep the thinner outline
        unless this is set explicitly.
    - name: showDots
      type: boolean
      required: false
      default: 'false'
      description: Render a dot at each point of the line and area series.
    - name: showActiveDots
      type: boolean
      required: false
      description: >-
        Render the hover dot on the line and area series. Unset, the renderer's own
        default applies.
    - name: connectNulls
      type: boolean
      required: false
      default: 'false'
      description: Bridge null gaps in the data instead of breaking the line/area.
    - name: barSize
      type: number
      required: false
      description: Fixed bar thickness in px. Unset, bars are sized from the available width.
    - name: barGap
      type: number | string
      required: false
      description: Gap between bars of the same category, in px or a percentage string.
    - name: barCategoryGap
      type: number | string
      required: false
      description: Gap between category groups, in px or a percentage string.
    - name: showBackground
      type: boolean
      required: false
      default: 'false'
      description: Draw a full-height track behind every bar.
    - name: backgroundFill
      type: string
      required: false
      default: 'the secondary surface token'
      description: Fill for the track background.
    - name: showActiveBar
      type: boolean
      required: false
      default: 'false'
      description: Highlight the hovered bar.
    - name: margin
      type: '{ top?: number; right?: number; bottom?: number; left?: number }'
      required: false
      description: >-
        Plot-area inset. Any side left out keeps the chart's own default (which is
        already widened when `showLabels` is on, so a label's value can't be clipped
        at the plot edge).
    - name: tooltipCursor
      type: boolean
      required: false
      default: 'true'
      description: Draw the hover cursor (the band/rule under the tooltip).
    - name: legendPosition
      type: "'top' | 'bottom'"
      required: false
      default: "'bottom'"
      description: Which edge the legend sits on.
    - name: barRadius
      type: number
      required: false
      default: '4'
      description: >-
        Corner radius on the growing end of bar series (0 for square corners). In a
        stack only the segment at the top of the stack is rounded.
    - name: fillOpacity
      type: number
      required: false
      default: '0.3'
      description: Flat-fill opacity for area series. Per-series `fillOpacity` overrides it.
    - name: showGrid
      type: boolean
      required: false
      default: 'true'
      description: Render the CartesianGrid.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: showXAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the X axis (its ticks and title). Set false to hide it.
    - name: showYAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the Y axis (its ticks and title). Set false to hide it.
    - name: xTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each X-axis tick value. Unlike the `unit` suffix (append-only), a
        formatter transforms the value — abbreviate, prefix a symbol, or map to a
        label. Use formatCompactNumber / formatPercent / createTickFormatter from
        the shared Chart primitives, or any function.
    - name: yTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each Y-axis tick value (see xTickFormatter).
    - name: xAxisAngle
      type: number
      required: false
      description: Rotate the X-axis tick labels by this many degrees (a negative angle tilts them up toward the right); the tick anchor + axis height adjust.
    - name: xAxisInterval
      type: "number | 'preserveStart' | 'preserveEnd' | 'preserveStartEnd' | 'equidistantPreserveStart'"
      required: false
      description: >-
        X-axis tick density — a recharts placement strategy, or a fixed number of
        ticks to skip between two rendered ones (recharts interval: 0 shows every
        tick, 1 every other one, 2 every third).
    - name: yAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the value axis (recharts tickCount; a hint, not
        exact). Applies to whichever axis holds the values — Y for most charts, X
        for BarChart with orientation="horizontal".
    - name: yAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Value-axis domain preset — auto (fit the data at both ends; the axis need
        not include 0), zero (anchor the axis at 0, which is also recharts'
        behaviour when the prop is omitted), or dataMin-dataMax (tight to the
        data, no padding). Applies to whichever axis holds the values — Y for most
        charts, X for BarChart with orientation="horizontal".
    - name: yAxisOrientation
      type: "'left' | 'right'"
      required: false
      default: "'left'"
      description: >-
        Which side the primary value axis sits on. The secondary axis always takes
        the opposite side, so the pair mirrors as a whole.
    - name: showSecondaryYAxis
      type: boolean
      required: false
      default: 'true'
      description: >-
        Render the secondary axis's ticks and title. Setting it false keeps the
        second scale — series measured against it stay scaled that way — and drops
        only its chrome, the meaning showYAxis has for the primary axis. Inert
        unless a series selects the secondary axis.
    - name: secondaryYAxisLabel
      type: string
      required: false
      description: Title rendered beside the secondary value axis (rotated).
    - name: secondaryYUnit
      type: string
      required: false
      description: Unit suffix appended to the secondary axis's tick values.
    - name: secondaryYTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each secondary-axis tick value — the counterpart of yTickFormatter.
    - name: secondaryYAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the secondary axis (recharts tickCount; a hint,
        not exact).
    - name: secondaryYAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Domain preset for the secondary axis — the same presets as yAxisDomain,
        resolved independently of it.
    - name: gridDashed
      type: boolean
      required: false
      description: Draw grid lines dashed instead of solid.
    - name: gridHorizontal
      type: boolean
      required: false
      description: Show horizontal grid lines (defaults to the chart's own default when unset).
    - name: gridVertical
      type: boolean
      required: false
      description: Show vertical grid lines (defaults to the chart's own default when unset).
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
    - name: showLabels
      type: boolean
      required: false
      default: 'false'
      description: Render a value label on each data point/segment.
    - name: labelPosition
      type: "'top' | 'bottom' | 'left' | 'right' | 'center' | 'insideTop' | 'insideBottom' | 'insideLeft' | 'insideRight' | 'insideStart' | 'insideEnd'"
      required: false
      description: Where the value labels sit.
    - name: labelFormatter
      type: '(value) => string'
      required: false
      description: Format each label value (reuses the tick formatters).
    - name: showBrush
      type: boolean
      required: false
      default: 'false'
      description: >-
        Render a range brush beneath the chart — drag a handle (or the selected
        window) to zoom the series into a slice of the data.
    - name: brushHeight
      type: number
      required: false
      default: '28'
      description: >-
        Height of the brush strip in px. A non-positive value falls back to the
        default rather than erasing the brush.
    - name: brushAriaLabel
      type: string
      required: false
      default: "'Chart range selector'"
      description: >-
        Accessible name for the brush's two range handles, which are focusable
        `role="slider"` elements. Consumers localize by passing their own.
  events: []
  methods: []

adapters:
  react:
    component: ComposedChart
    status: implemented
    import: "import { ComposedChart } from '@acronis-platform/ui-react'"
    example: |
      <ComposedChart
        config={config}
        data={data}
        series={[
          { key: 'revenue', type: 'bar', stackId: 'total' },
          { key: 'forecast', type: 'bar', stackId: 'total' },
          { key: 'profit', type: 'line', showDots: true },
        ]}
        xKey="month"
        className="h-[320px] w-[560px]"
      />
  vue:
    component: AvComposedChart
    status: planned
    import: "import { AvComposedChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvComposedChart :config="config" :data="data" :series="series" x-key="month" />
  web-components:
    element: ui-composed-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/composed-chart'"
    example: |
      <ui-composed-chart></ui-composed-chart>
