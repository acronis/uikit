spec_version: '1.0'
component: ComposedChart

# Framework-agnostic contract. ComposedChart has NO cva variant axes — the mix is
# data-driven via each `series[].type` (bar / line / area) over one shared
# category axis — so there are no variant enums to conformance-check.
contract:
  properties:
    - name: data
      type: ReadonlyArray<Record<string, string | number>>
      required: true
      description: Row-per-category data — each row holds `xKey` plus one numeric field per series.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Per-series map of label / color, keyed by `series[].key` (from the shared
        Chart primitives). Turned into `--color-<key>` custom properties. Colors
        are caller-supplied.
    - name: series
      type: ComposedSeries[]
      required: true
      description: >-
        Series to plot, each `{ key, type, yAxis? }`. `type` is `bar` / `line` /
        `area`. Rendered in array order — later entries sit on top, whatever their
        mark type; order them so a thin line comes after the bars/areas it should
        overlay. `yAxis` is `primary` (the default) or `secondary`, selecting which
        value axis the series is measured against. Each key must exist in `config`
        and every data row.
    - name: xKey
      type: string
      required: true
      description: The category dimension key shared across rows.
    - name: xAxisLabel
      type: string
      required: false
      description: Title rendered beneath the horizontal (X) axis.
    - name: yAxisLabel
      type: string
      required: false
      description: Title rendered beside the vertical (Y) axis (rotated).
    - name: yUnit
      type: string
      required: false
      description: >-
        Unit suffix appended to Y-axis tick values (recharts `unit`); the X axis
        is categorical.
    - name: curve
      type: "'linear' | 'monotone' | 'step'"
      required: false
      default: "'monotone'"
      description: Interpolation for the line and area series.
    - name: barRadius
      type: number
      required: false
      default: '4'
      description: Corner radius on the growing end of bar series (0 for square corners).
    - name: fillOpacity
      type: number
      required: false
      default: '0.3'
      description: Flat-fill opacity for area series.
    - name: showGrid
      type: boolean
      required: false
      default: 'true'
      description: Render the CartesianGrid.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: showXAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the X axis (its ticks and title). Set false to hide it.
    - name: showYAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the Y axis (its ticks and title). Set false to hide it.
    - name: xTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each X-axis tick value. Unlike the `unit` suffix (append-only), a
        formatter transforms the value — abbreviate, prefix a symbol, or map to a
        label. Use formatCompactNumber / formatPercent / createTickFormatter from
        the shared Chart primitives, or any function.
    - name: yTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each Y-axis tick value (see xTickFormatter).
    - name: xAxisAngle
      type: number
      required: false
      description: Rotate the X-axis tick labels by this many degrees (a negative angle tilts them up toward the right); the tick anchor + axis height adjust.
    - name: xAxisInterval
      type: "number | 'preserveStart' | 'preserveEnd' | 'preserveStartEnd' | 'equidistantPreserveStart'"
      required: false
      description: >-
        X-axis tick density — a recharts placement strategy, or a fixed number of
        ticks to skip between two rendered ones (recharts interval: 0 shows every
        tick, 1 every other one, 2 every third).
    - name: yAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the value axis (recharts tickCount; a hint, not
        exact). Applies to whichever axis holds the values — Y for most charts, X
        for BarChart with orientation="horizontal".
    - name: yAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Value-axis domain preset — auto (fit the data at both ends; the axis need
        not include 0), zero (anchor the axis at 0, which is also recharts'
        behaviour when the prop is omitted), or dataMin-dataMax (tight to the
        data, no padding). Applies to whichever axis holds the values — Y for most
        charts, X for BarChart with orientation="horizontal".
    - name: yAxisOrientation
      type: "'left' | 'right'"
      required: false
      default: "'left'"
      description: >-
        Which side the primary value axis sits on. The secondary axis always takes
        the opposite side, so the pair mirrors as a whole.
    - name: showSecondaryYAxis
      type: boolean
      required: false
      default: 'true'
      description: >-
        Render the secondary axis's ticks and title. Setting it false keeps the
        second scale — series measured against it stay scaled that way — and drops
        only its chrome, the meaning showYAxis has for the primary axis. Inert
        unless a series selects the secondary axis.
    - name: secondaryYAxisLabel
      type: string
      required: false
      description: Title rendered beside the secondary value axis (rotated).
    - name: secondaryYUnit
      type: string
      required: false
      description: Unit suffix appended to the secondary axis's tick values.
    - name: secondaryYTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each secondary-axis tick value — the counterpart of yTickFormatter.
    - name: secondaryYAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the secondary axis (recharts tickCount; a hint,
        not exact).
    - name: secondaryYAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Domain preset for the secondary axis — the same presets as yAxisDomain,
        resolved independently of it.
    - name: gridDashed
      type: boolean
      required: false
      description: Draw grid lines dashed instead of solid.
    - name: gridHorizontal
      type: boolean
      required: false
      description: Show horizontal grid lines (defaults to the chart's own default when unset).
    - name: gridVertical
      type: boolean
      required: false
      description: Show vertical grid lines (defaults to the chart's own default when unset).
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
    - name: showLabels
      type: boolean
      required: false
      default: 'false'
      description: Render a value label on each data point/segment.
    - name: labelPosition
      type: "'top' | 'bottom' | 'left' | 'right' | 'center' | 'insideTop' | 'insideBottom' | 'insideLeft' | 'insideRight' | 'insideStart' | 'insideEnd'"
      required: false
      description: Where the value labels sit.
    - name: labelFormatter
      type: '(value) => string'
      required: false
      description: Format each label value (reuses the tick formatters).
    - name: showBrush
      type: boolean
      required: false
      default: 'false'
      description: >-
        Render a range brush beneath the chart — drag a handle (or the selected
        window) to zoom the series into a slice of the data.
    - name: brushHeight
      type: number
      required: false
      default: '28'
      description: >-
        Height of the brush strip in px. A non-positive value falls back to the
        default rather than erasing the brush.
    - name: brushAriaLabel
      type: string
      required: false
      default: "'Chart range selector'"
      description: >-
        Accessible name for the brush's two range handles, which are focusable
        `role="slider"` elements. Consumers localize by passing their own.
  events: []
  methods: []

adapters:
  react:
    component: ComposedChart
    status: implemented
    import: "import { ComposedChart } from '@acronis-platform/ui-react'"
    example: |
      <ComposedChart
        config={config}
        data={data}
        series={[
          { key: 'revenue', type: 'bar' },
          { key: 'profit', type: 'line' },
        ]}
        xKey="month"
        className="h-[320px] w-[560px]"
      />
  vue:
    component: AvComposedChart
    status: planned
    import: "import { AvComposedChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvComposedChart :config="config" :data="data" :series="series" x-key="month" />
  web-components:
    element: ui-composed-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/composed-chart'"
    example: |
      <ui-composed-chart></ui-composed-chart>
