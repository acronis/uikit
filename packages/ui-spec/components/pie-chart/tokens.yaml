spec_version: '1.0'
component: PieChart

# References only. Values live in @acronis-platform/tokens-pd. PieChart has no
# token tier of its own, and needs none: slice colours come from the shared
# `--ui-dataviz-*` palettes on the semantic tier, resolved by ChartContainer out
# of the `palette` prop. The chrome (tooltip, legend) is inherited from the
# shared Chart primitives, which resolve the semantic tokens below.
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-background-surface-primary
    affects: tooltip-content
    description: Tooltip surface (bg-background).
  - name: --ui-text-on-surface-primary
    affects: tooltip-content
    description: Tooltip value text (text-foreground).
  - name: --ui-text-on-surface-primary
    affects: data-label
    description: >-
      Fill of a data label that sits on the chart surface — an `outside`
      placement, including every leader-line label.
  - name: --ui-text-on-status-strong-neutral
    affects: data-label
    description: >-
      Fill of a data label placed on the slice itself (any on-arc
      `labelPosition`) — white in both themes, so it survives a saturated
      palette slice colour.
  - name: --ui-text-on-surface-secondary
    affects: legend-content
    description: >-
      Muted tooltip/legend label text
      (text-muted-foreground / fill-muted-foreground).
  - name: --ui-border-on-surface-border
    affects: tooltip-content
    description: Tooltip border (border-border).
