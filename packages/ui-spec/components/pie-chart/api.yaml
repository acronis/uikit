spec_version: '1.0'
component: PieChart

# Framework-agnostic contract. `shape` is the CVA variant axis
# (conformance-checked against the ui-react cva keys). `data` / `config` /
# `dataKey` / `nameKey` are the data contract; the rest tune the arc geometry
# and chrome. Unlike the cartesian charts, a pie plots a single `dataKey` across
# rows and names each slice by `nameKey`.
contract:
  properties:
    - name: shape
      type: "'pie' | 'donut'"
      required: false
      default: "'pie'"
      description: >-
        Arc shape. `pie` fills to the centre; `donut` leaves a hollow centre
        (`innerRadius`).
    - name: data
      type: ReadonlyArray<Record<string, string | number>>
      required: true
      description: Row-per-slice data — each row holds a `nameKey` label and a `dataKey` numeric value.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Per-slice map of label / color, keyed by the slice's `nameKey` value
        (from the shared Chart primitives). Turned into `--color-<name>` custom
        properties. Colors are caller-supplied.
    - name: dataKey
      type: string
      required: true
      description: The numeric field that sizes each slice.
    - name: nameKey
      type: string
      required: true
      description: >-
        The label field that names each slice (drives legend, tooltip, and the
        `--color-<name>` lookup). Values should be unique per chart — rows
        sharing a name share one config/color entry.
    - name: innerRadius
      type: number
      required: false
      default: '60'
      description: Inner radius of the arc when `shape="donut"` (ignored for `shape="pie"`).
    - name: centerLabel
      type: '{ value?: string | number; label?: string | number }'
      required: false
      description: >-
        Custom content for the donut hole — a headline `value` and/or a `label`
        caption, stacked and centered. Rendered only for `shape="donut"`.
    - name: outerRadius
      type: number
      required: false
      description: Outer radius of the arc. Omit to use recharts' responsive default.
    - name: paddingAngle
      type: number
      required: false
      default: '0'
      description: Gap between slices, in degrees.
    - name: cornerRadius
      type: number
      required: false
      description: Corner radius of each slice.
    - name: startAngle
      type: number
      required: false
      description: >-
        Angle the sweep starts at, in degrees (0 is 3 o'clock, counter-clockwise).
        Pair with endAngle for a semicircle (180 → 0) or an arc.
    - name: endAngle
      type: number
      required: false
      description: Angle the sweep ends at, in degrees. Defaults to a full 360 circle.
    - name: minAngle
      type: number
      required: false
      description: >-
        Smallest angle a non-zero slice may occupy, in degrees — keeps a tiny
        slice visible (and hoverable) at the cost of being drawn out of
        proportion.
    - name: sliceSettings
      type: 'Record<string, { color?: string; hideLabel?: boolean; labelFormat?: PieChartLabelFormat }>'
      required: false
      description: >-
        Per-slice overrides keyed by the slice's nameKey value: its color, and
        whether/how its data label reads. A name with no entry keeps the
        chart-level behavior.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend.
    - name: legendPos
      type: "'top' | 'bottom'"
      required: false
      default: "'bottom'"
      description: Which edge the legend sits on.
    - name: margin
      type: '{ top?: number; right?: number; bottom?: number; left?: number }'
      required: false
      description: Plot-area margin, in px. Omit to use the renderer's default (5 on every side).
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Takes precedence over
        tooltipFormat. Ignored when showTooltip is false.
    - name: tooltipFormat
      type: "'value' | 'value-percent'"
      required: false
      default: "'value'"
      description: >-
        How the default tooltip reads a slice: its value alone, or the value
        followed by its share of the total.
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
    - name: showLabels
      type: boolean
      required: false
      default: 'false'
      description: Render a value label on each slice.
    - name: labelPosition
      type: "'outside' | 'center' | 'centerTop' | 'centerBottom' | 'insideStart' | 'insideEnd' | 'end'"
      required: false
      default: "'outside'"
      description: >-
        Where the value labels sit. Defaults to outside the arc, on the chart
        surface — the only placement guaranteed to have contrast against
        caller-supplied slice colors. Inside placements switch the label to the
        on-fill token. Ignored when labelLine is on — a leader line only ever
        ends outside the arc.
    - name: labelFormat
      type: "'value' | 'name-value' | 'name-percent' | 'percent'"
      required: false
      default: "'value'"
      description: >-
        What each data label reads — the value alone, or the slice name and/or
        its share of the total (to one decimal). Overridable per slice via
        sliceSettings.
    - name: labelLine
      type: boolean
      required: false
      default: 'false'
      description: >-
        Draw a leader line from each slice to its data label, in the slice's own
        color. Moves the labels outside the arc; a slice whose label is hidden by
        sliceSettings gets no line either.
    - name: labelFormatter
      type: '(value) => string'
      required: false
      description: >-
        Format each label value (reuses the tick formatters). Applies to the
        numeric part only, so labels stay in the same units under every
        labelFormat.
  events: []
  methods: []

adapters:
  react:
    component: PieChart
    status: implemented
    import: "import { PieChart } from '@acronis-platform/ui-react'"
    example: |
      <PieChart
        config={config}
        data={data}
        dataKey="value"
        nameKey="browser"
        shape="donut"
        className="h-[360px] w-[360px]"
      />
  vue:
    component: AvPieChart
    status: planned
    import: "import { AvPieChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvPieChart :config="config" :data="data" data-key="value" name-key="browser" />
  web-components:
    element: ui-pie-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/pie-chart'"
    example: |
      <ui-pie-chart></ui-pie-chart>
