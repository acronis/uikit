spec_version: '1.0'
component: DataTable

schematic: |
  bulk-actions-bar: [ Delete ] [ … ]        "N items selected:" [ Deselect ]
  toolbar:   [ search input ] [ filters ▾ ] [ Reset ✕ ]
  applied-filters: ( status: Success ✕ ) ( … )        (chip row, when filtering)
  table: <div> rounded border wrapper
    column-header: per-column header — title + single-click sort toggle (↑/↓/↕)
    header-hint:   hover/focus tooltip listing that column's gestures        ⚙
    resize-handle: drag handle at a resizable header's trailing edge (opt-in)
    pinned column: meta.pin left/right → position: sticky cell
    row:           data row (selectable; selected → tinted; roving Tab stop)  ⋯
    select-column: leading fixed 48px column (consumer's id: 'select') → Checkbox
    expand-trigger: chevron toggle inside a cell → toggles the row's expansion
    expanded-row:  optional detail row under an expanded row
    empty-state:   "No results." row when there is no data
    sentinel:      aria-hidden row that triggers onLoadMore on scroll (infinite mode)
    loading-row:   trailing "loading more" row (role=status) while isLoadingMore
    action-column: trailing sticky 48px column — settings cog (⚙) in the header,
                   per-row overflow-actions ellipsis (⋯) in each row
      view-options: [ ⚙ ] ▾ column-visibility menu opened from that header cog
  pagination: "N of M selected"   [Rows per page ▾]  Page X of Y   ⏮ ◀ ▶ ⏭

root:
  element: div
  description: >-
    The bordered table wrapper. Renders a TanStack table over the Table
    primitives. Manages sorting / filtering / visibility / selection /
    pagination / expansion / column-sizing / pinning state internally
    (DataTable), or accepts a caller-built `table` instance for the companion
    parts.

parts:
  - id: table
    element: table
    description: The table grid (Table / TableHeader / TableBody / rows / cells).
  - id: column-header
    element: button
    description: >-
      Sortable column header (DataTableColumnHeader) — a single-click toggle: the
      title plus a trailing arrow (up = ascending, down = descending, both in the
      active blue; a muted up/down arrow when unsorted). One click cycles the sort
      direction. Column hiding lives behind the settings cog in the trailing
      action column's header cell (the `view-options` menu), not here.
  - id: header-hint
    element: div
    description: >-
      A `Tooltip` on the whole header cell (not just its sort button) listing one
      line per gesture that column actually supports — "Sort column: Click",
      "Reorder column: Drag", "Resize column: Drag border" (copy overridable per
      capability via `headerHints`). A column with no capability renders no
      tooltip, and the hint is suppressed while any column is being resized or
      dragged so it can't pop up over a neighboring cell.
    optional: true
  - id: resize-handle
    element: div
    description: >-
      A drag handle rendered at the trailing edge of each resizable header when
      `enableColumnResizing` is set (from TanStack's `header.getResizeHandler()`).
      Appears on hover / while dragging; `role="separator"`, `aria-orientation`
      vertical, labelled "Resize column".
    optional: true
  - id: row
    element: tr
    description: >-
      A data row; selectable, tinted when selected. A column with `meta.pin`
      renders as sticky cells with an opaque row background so scrolled cells
      don't show through.
  - id: select-column
    element: td/th
    description: >-
      The leading row-selection column, when the consumer's own `ColumnDef`
      array declares one with the reserved `id: 'select'` — DataTable
      recognizes that id and forces a fixed 48px width with no resize handle,
      the same way the built-in trailing `__actions` column is always 48px.
      Unlike `action-column`, this column is not built in: the consumer still
      supplies its own `header`/`cell` render functions (typically a
      `Checkbox` bound to `table.toggleAllPageRowsSelected` /
      `row.toggleSelected`). Rendered with the plain `TableCell`/`TableHead`
      primitives, not `Table`'s hand-authored `TableSelectCell` (which is a
      different, 32px column used only in standalone `Table` compositions).
    optional: true
  - id: action-column
    element: td/th
    description: >-
      The built-in trailing action column (shown unless `hideActionColumn`; a
      no-op with an external `table`). A real `ColumnDef` (`id: '__actions'`,
      48px, `meta.pin: 'right'`) so TanStack's own pinning geometry measures and
      offsets it: its header cell is a `TableSettingsCell` holding the
      column-visibility cog (`DataTableViewOptions` with `iconOnly`, labelled by
      `columnSettingsLabel`), and each row's cell is a `TableActionsCell` holding
      the overflow-actions trigger (an ellipsis `ButtonIcon` labelled by
      `rowActionsLabel`, opening a `DropdownMenu` whose content comes from
      `renderRowActions`). Without `renderRowActions` the column is still
      reserved but the row renders no trigger; while a bulk selection is active
      (`isBulkSelectionActive(table)`) the row cell renders empty and untinted.
    optional: true
  - id: view-options
    element: div
    description: >-
      DataTableViewOptions — the column-visibility menu opened from the settings
      cog in the action column's header cell (`iconOnly`, inside a
      `TableSettingsCell`); it is not part of the toolbar. A thin TanStack
      adapter over the `TableViewOptions` primitive: it maps
      `table.getAllColumns()` onto the plain `{ id, label, hidden }[]` shape and
      routes `onToggle` back through `column.toggleVisibility()`.
    optional: true
  - id: bulk-actions-bar
    element: div
    description: >-
      DataTableBulkActionsBar — a selection-aware bar rendered above the grid
      over the same `table` instance the selection column feeds. The consumer's
      bulk actions (`children`) sit leading inside a native `<fieldset>` whose
      `disabled` state follows `isBulkSelectionActive(table)`, so every nested
      control picks the state up for free; the trailing side shows the selection
      summary (`selectedLabel`) plus a Deselect control wired to
      `table.resetRowSelection()`, or `loadedLabel` when there is no selection to
      summarize.
    optional: true
  - id: expand-trigger
    element: button
    description: >-
      DataTableExpandTrigger — a chevron toggle placed inside a column's `cell`
      render function. Reads the row's `getCanExpand` / `getIsExpanded` and calls
      `toggleExpanded()`; renders nothing when the row can't expand. Carries
      `aria-expanded` and an "Expand row" / "Collapse row" label.
    optional: true
  - id: expanded-row
    element: tr
    description: Optional detail row rendered under an expanded row.
  - id: empty-state
    element: tr
    description: A single "No results." row shown when there is no data.
  - id: sentinel
    element: tr
    description: >-
      An `aria-hidden` zero-height row (`paginationMode="infinite"`) whose
      intersection with the viewport calls `onLoadMore`. Rendered only once
      there is at least one row and `hasNextPage` is true.
    optional: true
  - id: loading-row
    element: tr
    description: >-
      A trailing animated-placeholder row shown while `isLoadingMore` is true
      (`paginationMode="infinite"`); carries `role="status"`/`aria-live="polite"`
      with an `sr-only` text so the in-flight fetch is announced.
    optional: true
  - id: toolbar
    element: div
    description: >-
      DataTableToolbar — a column search box, an optional per-column filters
      popover (its `children`), and a Reset button (when filtered and no filter
      fields). Column visibility is not here: it lives behind the settings cog
      in the action column's header cell.
  - id: filters
    element: div
    description: >-
      The per-column filters popover (FilterSearchFilters) rendered when the
      toolbar is given filter-field `children`. Each field is wired to a column
      via `useFilterSearchFilters()` keyed by column id.
    optional: true
  - id: applied-filters
    element: div
    description: >-
      A sibling chip row (FilterSearchAppliedFilters) below the toolbar, shown
      when filtering; each chip removes its column's filter. Labels come from
      `getFilterChipLabel`.
    optional: true
  - id: pagination
    element: div
    description: >-
      DataTablePagination — selection count, rows-per-page select, page indicator,
      and first / prev / next / last controls.

states:
  - id: empty
    trigger: data is empty
    kind: prop
    prop: data
    affects: [empty-state]
  - id: expandable
    trigger: getRowCanExpand is provided
    kind: prop
    prop: getRowCanExpand
    affects: [row, expanded-row]
  - id: expandable-column
    trigger: a column's cell renders a DataTableExpandTrigger (with getRowCanExpand set)
    kind: prop
    prop: getRowCanExpand
    affects: [expand-trigger, expanded-row]
  - id: striped
    trigger: striped is set
    kind: prop
    prop: striped
    affects: [row]
  - id: bordered
    trigger: bordered is set
    kind: prop
    prop: bordered
    affects: [table]
  - id: current
    trigger: highlightCurrentRow is set and a row is clicked
    kind: prop
    prop: highlightCurrentRow
    affects: [row]
  - id: skeleton
    trigger: skeleton is set
    kind: prop
    prop: skeleton
    affects: [row, table]
  - id: resizable
    trigger: enableColumnResizing is set
    kind: prop
    prop: enableColumnResizing
    affects: [column-header, resize-handle]
  - id: reorderable
    trigger: enableColumnReordering is set
    kind: prop
    prop: enableColumnReordering
    affects: [column-header, header-hint]
  - id: column-dragging
    trigger: a draggable header cell is being dragged (pointer only)
    kind: internal
    affects: [column-header, header-hint]
  - id: action-column-hidden
    trigger: hideActionColumn is set (or an external table is passed)
    kind: prop
    prop: hideActionColumn
    affects: [action-column, view-options]
  - id: bulk-selection-active
    trigger: >-
      a bulk selection is in play — isBulkSelectionActive(table); see api.yaml
      for the threshold
    kind: internal
    affects: [action-column, bulk-actions-bar]
  - id: row-focused
    trigger: >-
      a data row is the current roving Tab stop (focused by Tab, a click, or
      Arrow Up/Down)
    kind: internal
    affects: [row]
  - id: pinned
    trigger: "a column's meta.pin is 'left' or 'right'"
    kind: prop
    prop: meta.pin
    affects: [row, column-header]
  - id: wrapping
    trigger: a column's meta.wrap is set
    kind: prop
    prop: meta.wrap
    affects: [row, column-header]
  - id: external-table
    trigger: >-
      table is provided — DataTable renders from a caller-built TanStack
      instance instead of its own; several other props become no-ops, and
      meta.pin-driven pinning is skipped (see api.yaml's `table` description)
    kind: prop
    prop: table
    affects: [table]
  - id: manual-sorting
    trigger: >-
      manualSorting is set — the sort-toggle button still fires, but
      DataTable stops reordering rows itself; the caller maps
      sorting/onSortingChange to a query and supplies already-sorted data
    kind: prop
    prop: manualSorting
    affects: [column-header]
  - id: infinite-scroll
    trigger: paginationMode is 'infinite' and hasNextPage is true
    kind: prop
    prop: paginationMode
    affects: [sentinel]
  - id: loading-more
    trigger: isLoadingMore is set (paginationMode="infinite")
    kind: prop
    prop: isLoadingMore
    affects: [loading-row]
  - id: custom-empty-state
    trigger: renderEmptyState is provided and there are no rows
    kind: prop
    prop: renderEmptyState
    affects: [empty-state]

internal_state:
  - id: row-selection
    type: 'Record<rowId, boolean>'
    initial: '{}'
    controllable_via: [rowSelection]
    emits: onRowSelectionChange
    changed_by: toggling a row's / the header's selection checkbox
    description: >-
      Which rows are selected. `isBulkSelectionActive(table)` derives the
      bulk-selection state from it (see api.yaml), which in turn blanks each
      row's action cell and enables the bulk-actions bar's actions.
  - id: dragged-column
    type: 'string | undefined'
    initial: undefined
    changed_by: >-
      dragstart on a draggable header cell sets it; drop / dragend clears it
      (pointer only — there is no keyboard path, see accessibility.md)
    description: >-
      The header cell currently being dragged (`enableColumnReordering`). Dims
      that cell and suppresses the header hints while the gesture is in flight;
      the resulting order goes through TanStack's `columnOrder`.
  - id: focused-row-index
    type: number
    initial: 0
    changed_by: >-
      Arrow Up / Arrow Down on a row, or focusing a row (Tab or a click)
    description: >-
      The roving-tabindex cursor — the one data row that is a Tab stop. Clamped
      against the live row count, so shrinking `rows` can't leave it past the
      end.
