spec_version: '1.0'
component: DataTable

# DataTable takes columns/data and owns table state by default. The companion
# parts (DataTableToolbar / DataTablePagination / DataTableColumnHeader /
# DataTableViewOptions / DataTableBulkActionsBar) take a TanStack `table`
# instance — see README. As of
# this revision, DataTable itself can also take a `table` instance (below) —
# when passed, DataTable owns no state and several props become no-ops (see
# each property's description).
contract:
  properties:
    - name: columns
      type: 'ColumnDef<TData, TValue>[]'
      required: false
      description: >-
        TanStack column definitions (header / cell renderers, accessors).
        Required unless `table` (an externally-built instance) is passed.
    - name: data
      type: 'TData[]'
      required: false
      description: The row data. Required unless `table` is passed.
    - name: resize-column-label
      type: string
      required: false
      default: "'Resize column'"
      description: >-
        Accessible name of a column's resize handle (`enableColumnResizing`
        only). Override to localize.
    - name: empty-label
      type: string
      required: false
      default: "'No results.'"
      description: >-
        Text of the default empty-state row; ignored when `renderEmptyState` is
        given. Override to localize.
    - name: rows-per-page-label
      type: string
      required: false
      default: "'Rows per page'"
      description: >-
        On the pagination part — label of the rows-per-page select (also its
        accessible name). Override to localize. The pagination part also takes
        `first-page-label`, `previous-page-label`, `next-page-label`,
        `last-page-label`, `page-label` and `summary-label`. `summary-label` is
        `(selected: number, total: number) => string`, always called with
        concrete counts — unlike `TablePagination`'s
        `(selectedRows: number | undefined, totalRows: number) => string |
        null`, it never receives `undefined`/`null`.
    - name: expand-label
      type: string
      required: false
      default: "'Expand row'"
      description: >-
        On the expand-trigger part — accessible name while the row is collapsed.
        Override to localize.
    - name: collapse-label
      type: string
      required: false
      default: "'Collapse row'"
      description: >-
        On the expand-trigger part — accessible name while the row is expanded.
        Override to localize.
    - name: sort-label
      type: '(title: string) => string'
      required: false
      default: '(title) => `Sort by ${title}`'
      description: >-
        On the column-header part — builds the accessible label of the sort
        toggle from the column title. Override to localize.
    - name: table
      type: 'Table<TData>'
      required: false
      description: >-
        Render from an externally-built TanStack `table` instance instead of
        DataTable's own — DataTable then owns no state. Makes the following
        no-ops (configure the equivalent on the external instance instead):
        columnVisibility, onColumnVisibilityChange, onColumnSizingChange,
        enableColumnResizing, getRowCanExpand, manualSorting, sorting,
        onSortingChange, paginationMode, onLoadMore, loadMoreRootMargin,
        hasNextPage, isLoadingMore. meta.pin-driven column pinning is also
        skipped — pin/unpin the external instance directly via TanStack's
        `column.pin()`.
    - name: getRowCanExpand
      type: '(row: Row<TData>) => boolean'
      required: false
      description: Enables row expansion for rows that return true. Pair with renderExpandedRow.
    - name: renderExpandedRow
      type: '(row: Row<TData>) => ReactNode'
      required: false
      description: Renders the detail content for an expanded row.
    - name: striped
      type: boolean
      required: false
      default: 'false'
      description: Alternating row backgrounds (borrowed from the Vue AvTable).
    - name: bordered
      type: boolean
      required: false
      default: 'false'
      description: Vertical borders between columns (rows already have horizontal borders).
    - name: highlightCurrentRow
      type: boolean
      required: false
      default: 'false'
      description: Highlight the row the user last clicked (the "current" row).
    - name: skeleton
      type: boolean
      required: false
      default: 'false'
      description: Render placeholder skeleton rows instead of data (loading state).
    - name: skeletonRows
      type: number
      required: false
      default: '5'
      description: Number of skeleton rows when skeleton is set.
    - name: enableColumnResizing
      type: boolean
      required: false
      default: 'false'
      description: >-
        Opt in to interactive column resizing — renders a drag handle at the
        trailing edge of each resizable header (TanStack's native
        `columnResizing`, `columnResizeMode: 'onChange'`).
    - name: enableColumnReordering
      type: boolean
      required: false
      default: 'false'
      description: >-
        Opt in to column reordering by dragging a header cell onto another one
        (native HTML5 drag-and-drop driving TanStack's `columnOrder`; the dragged
        header dims while the gesture is in flight). Pinned columns are excluded
        — they're anchored to a table edge by definition. Pointer-only: there is
        no keyboard equivalent yet. No-op when `table` is passed.
    - name: columnOrder
      type: ColumnOrderState
      required: false
      description: >-
        Controlled column-order state; pairs with `onColumnOrderChange` (e.g. to
        persist the user's order). Uncontrolled (internal state) when omitted.
        No-op when `table` is passed.
    - name: rowSelection
      type: RowSelectionState
      required: false
      description: >-
        Controlled row-selection state; pairs with `onRowSelectionChange` (e.g.
        to share one selection state with an external `useReactTable` instance
        that feeds a composed toolbar/bulk-actions bar). Uncontrolled (internal
        state) when omitted.
    - name: hideActionColumn
      type: boolean
      required: false
      default: 'false'
      description: >-
        Hide the trailing sticky action column — the column-visibility cog in
        the header and each row's overflow-actions ellipsis. Shown by default.
        No-op when `table` is passed (build the column into that instance's own
        `columns` instead).
    - name: renderRowActions
      type: '(row: Row<TData>) => ReactNode'
      required: false
      description: >-
        Renders the content of a row's overflow-actions menu (e.g. Edit/Delete
        items), opened from the ellipsis trigger in the trailing action column.
        Omit to render that row without a trigger — the 48px column is still
        reserved. Suppressed (like the trigger itself) while a bulk selection is
        active, per `TableActionsCell`.
    - name: rowActionsLabel
      type: string
      required: false
      default: "'Row actions'"
      description: >-
        Accessible name of a row's overflow-actions trigger. Override to
        localize.
    - name: columnSettingsLabel
      type: string
      required: false
      description: >-
        Accessible name of the action column's column-visibility trigger.
        Override to localize; falls through to the view-options part's own
        default ("Column settings") when omitted.
    - name: headerHints
      type: 'Partial<DataTableHeaderHints>'
      required: false
      default: "{ sort: { label: 'Sort column', action: 'Click' }, reorder: { label: 'Reorder column', action: 'Drag' }, resize: { label: 'Resize column', action: 'Drag border' } }"
      description: >-
        Copy of the tooltip shown while a header cell is hovered/focused — one
        `{ label, action }` line per capability that column actually has
        (`sort` / `reorder` / `resize`). Merged over the defaults, so any subset
        can be overridden to localize; a column with no capability shows no
        tooltip at all.
    - name: bulkSelectionActive
      type: boolean
      required: false
      default: 'false'
      description: >-
        On the `TableActionsCell` part — suppress this row's actions because a
        *bulk* selection is in play. The cell still reserves its 48px column but
        renders no children and no hover/press tint. Pass
        `isBulkSelectionActive(table)` (exported alongside DataTable) rather than
        re-deriving the threshold: **one or more rows selected**, including
        exactly one.
    - name: meta.pin
      type: "'left' | 'right'"
      required: false
      description: >-
        Set on a `ColumnDef.meta` (not a DataTable prop) — pins the column to a
        table edge. DataTable drives TanStack's native column-pinning and renders
        the column as `position: sticky` cells with an opaque row background.
    - name: meta.wrap
      type: boolean
      required: false
      description: >-
        Set on a `ColumnDef.meta` (not a DataTable prop) — allows a column's
        header and cell content to wrap onto multiple lines instead of
        truncating, mirroring the `Table` primitives' `wrap` prop.
    - name: children
      type: ReactNode
      required: false
      description: >-
        On DataTableToolbar — filter fields rendered inside a
        `FilterSearchFilters` popover (wire each to a column via
        `useFilterSearchFilters()` keyed by column id). When provided, the
        toolbar renders the filter popover plus a `FilterSearchAppliedFilters`
        chip row below it.
    - name: filtersLabel
      type: ReactNode
      required: false
      default: "'Filters'"
      description: On DataTableToolbar — label for the filters trigger button.
    - name: getFilterChipLabel
      type: '(key: string, value: unknown) => ReactNode'
      required: false
      description: >-
        On DataTableToolbar — formats an applied-filter chip's label (defaults to
        "<id>: <value>").
    - name: selectedLabel
      type: '(count: number) => string'
      required: false
      default: "(count) => `${count} item${count === 1 ? '' : 's'} selected:`"
      description: >-
        On DataTableBulkActionsBar — builds the trailing selection summary from
        `table.getSelectedRowModel().rows.length`. Override to localize. The bar
        also takes `clear-label` (default "Deselect"), the trailing control that
        calls `table.resetRowSelection()`, and `children` — the bulk actions,
        rendered *leading* (ahead of the trailing summary/Deselect group, which
        is pushed to the far edge with `ms-auto`) and wrapped in a native
        `<fieldset disabled>` while nothing is selected, so every nested control
        picks up the disabled state without per-action wiring. The bar is not
        rendered by DataTable: the consumer mounts it over the same external
        `table` instance that feeds the checkbox column (see the
        `data-table-bulk-actions` pattern). It is **always mounted** — it never
        renders nothing. Instead it toggles between two states on
        `isBulkSelectionActive(table)` (one or more rows selected): with nothing
        selected the actions are disabled and the trailing side shows
        `loadedLabel`; from the first selected row on, the actions enable and the
        trailing side shows the selection summary plus the clear control.
    - name: loadedLabel
      type: ReactNode
      required: false
      description: >-
        On DataTableBulkActionsBar — trailing text shown in place of the
        selection summary while nothing is selected (e.g. "25 of 1250 items
        loaded"). Omit to render nothing in that state. Override to localize.
    - name: manualSorting
      type: boolean
      required: false
      default: 'false'
      description: >-
        Opt out of client-side sorting — pass already-sorted `data` and drive
        sorting via `sorting`/`onSortingChange` (e.g. mapped to a server
        query by the caller). Mapping sort state to a query and refetching
        stays the caller's job. No-op when `table` is passed.
    - name: sorting
      type: SortingState
      required: false
      description: >-
        Controlled sorting state; pairs with `onSortingChange`. Uncontrolled
        (internal state) when omitted. No-op when `table` is passed.
    - name: renderRow
      type: '(row: Row<TData>, rowIndex: number) => ReactNode'
      required: false
      description: >-
        Renders a full row, bypassing DataTable's default per-cell
        `flexRender` path entirely. Use to swap in a custom, independently
        memoizable row component — the caller owns the row's markup and
        equality semantics. Reuse the exported `getCellStyle` /
        `getPinnedStyle` / `getColumnWidth` helpers to match DataTable's
        default cell styling if desired. Also bypasses `renderExpandedRow` —
        a row rendered via `renderRow` never gets an expanded-content row
        appended; read `row.getIsExpanded()` and render it yourself if
        needed.
    - name: renderEmptyState
      type: '(context: { hasFilters: boolean }) => ReactNode'
      required: false
      description: >-
        Renders a custom empty state instead of the default "No results."
        row. Receives `hasFilters` (whether any column filter is currently
        applied) so the caller can distinguish "no data at all" from "no
        matches" — the copy/wording/localization stays the caller's job.
    - name: paginationMode
      type: "'page' | 'infinite'"
      required: false
      default: "'page'"
      description: >-
        `'page'` keeps today's client-paginated behavior. `'infinite'` omits
        the paginated row model — `data` is the full accumulated array the
        caller appends to on each `onLoadMore` — and renders a sentinel row
        that calls `onLoadMore` once it scrolls into view. The sentinel
        requires at least one row already rendered, so it cannot drive an
        empty table's very first fetch — seed the first page yourself (e.g.
        on mount) and use `onLoadMore` for subsequent pages. No-op when
        `table` is passed. Does not compose with virtualization; for a large
        accumulated list, virtualize the raw `Table` primitives yourself
        instead.
    - name: loadMoreRootMargin
      type: string
      required: false
      description: >-
        Expands the sentinel's `IntersectionObserver` root margin (native CSS
        margin syntax, e.g. "400px") so `onLoadMore` fires before the
        sentinel is literally visible, reducing how often the trailing
        loading row is seen. `paginationMode="infinite"` only; no-op when
        `table` is passed. How far this actually prefetches also depends on
        page size — a large margin with small pages can trigger several
        `onLoadMore` calls back-to-back as the user scrolls normally, which
        is expected; tune it relative to page size.
    - name: hasNextPage
      type: boolean
      required: false
      default: 'false'
      description: >-
        Whether more rows are available to load. `paginationMode="infinite"`
        only.
    - name: isLoadingMore
      type: boolean
      required: false
      default: 'false'
      description: >-
        Whether a load is in flight — suppresses further `onLoadMore` calls
        and renders a trailing loading row. `paginationMode="infinite"` only.
  events:
    - name: onColumnOrderChange
      payload: 'ColumnOrderState (TanStack OnChangeFn)'
      description: >-
        Passthrough for the `columnOrder` state; pairs with `columnOrder`. Fires
        with the new order after a header drop when `enableColumnReordering` is
        set. No-op when `table` is passed.
    - name: onRowSelectionChange
      payload: 'RowSelectionState (TanStack OnChangeFn)'
      description: >-
        Passthrough for the `rowSelection` state; pairs with `rowSelection`.
    - name: onColumnSizingChange
      payload: 'ColumnSizingState (TanStack OnChangeFn)'
      description: >-
        Passthrough for the `columnSizing` state so a consumer can persist
        column widths when `enableColumnResizing` is set.
    - name: onSortingChange
      payload: 'SortingState (TanStack OnChangeFn)'
      description: >-
        Passthrough for the `sorting` state; pairs with `sorting`. No-op when
        `table` is passed.
    - name: onLoadMore
      description: >-
        Called when the infinite-scroll sentinel intersects the viewport.
        `paginationMode="infinite"` only. Requires at least one row already
        rendered — never fires from an empty table. The fetch-more call,
        cursor/offset tracking, dedup, and accumulating `data` stay the
        caller's job.
  methods: []

adapters:
  react:
    component: DataTable
    status: implemented
    import: "import { DataTable, type ColumnDef } from '@acronis-platform/ui-react'"
    example: |
      <DataTable columns={columns} data={rows} />
  vue:
    component: AvDataTable
    status: planned
    import: "import { AvDataTable } from '@acronis-platform/ui-vue'"
    example: |
      <AvDataTable :columns="columns" :data="rows" />
  web-components:
    element: ui-data-table
    status: planned
    import: "import '@acronis-platform/ui-wc/data-table'"
    example: |
      <ui-data-table></ui-data-table>
