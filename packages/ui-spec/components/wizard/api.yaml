spec_version: '1.0'
component: Wizard

# Markup-only; every part takes its native element attributes. No
# component-specific props, and in particular no `step` / `currentStep` /
# `onNext` / `onBack`: step state, navigation, and which of Cancel / Back /
# Next / Submit shows on a given step are the consuming UI block's concern per
# the design brief, not the kit's. The step indicator is a composed `Stepper`,
# which takes its own `currentStep` / `totalSteps` props.
contract:
  properties: []
  events: []
  methods: []

adapters:
  react:
    component: Wizard
    status: implemented
    import: "import { Wizard, WizardHeader, WizardSubtitle, WizardBody } from '@acronis-platform/ui-react'"
    example: |
      <Wizard>
        <WizardHeader>
          <Breadcrumb>
            <BreadcrumbList>
              <BreadcrumbItem><BreadcrumbLink href="#">Dashboards</BreadcrumbLink></BreadcrumbItem>
              <BreadcrumbSeparator />
              <BreadcrumbItem><BreadcrumbPage>Create dashboard</BreadcrumbPage></BreadcrumbItem>
            </BreadcrumbList>
          </Breadcrumb>
          <PageHeaderRow>
            <PageHeaderTitle>Create dashboard</PageHeaderTitle>
            <PageHeaderActions>
              <Button variant="secondary">Cancel</Button>
              <Button variant="secondary">Back</Button>
              <Button>Next</Button>
            </PageHeaderActions>
          </PageHeaderRow>
          <WizardSubtitle>Name it, pick its widgets, choose who can see it.</WizardSubtitle>
          <Stepper currentStep={2} totalSteps={3} current="Choose widgets" next="Set permissions">
            <StepperItem variant="completed" label="Name the dashboard" avatar={<Avatar color="green" className="[box-shadow:none]"><AvatarFallback>1</AvatarFallback></Avatar>} />
            <StepperItem variant="current" label="Choose widgets" avatar={<Avatar color="blue" className="[box-shadow:none] text-[var(--ui-stepper-item-current-label-color)]"><AvatarFallback>2</AvatarFallback></Avatar>} />
            <StepperItem variant="future" label="Set permissions" avatar={<Avatar color="gray" className="[box-shadow:none] text-[var(--ui-stepper-item-future-label-color)]"><AvatarFallback>3</AvatarFallback></Avatar>} />
          </Stepper>
        </WizardHeader>
        <WizardBody>
          <Section>
            <SectionHeader title="Choose widgets" />
            <SectionContent>{/* step fields */}</SectionContent>
          </Section>
        </WizardBody>
      </Wizard>
  vue:
    component: AvWizard
    status: planned
    import: "import { AvWizard } from '@acronis-platform/ui-vue'"
    example: |
      <AvWizard />
  web-components:
    element: ui-wizard
    status: planned
    import: "import '@acronis-platform/ui-wc/wizard'"
    example: |
      <ui-wizard></ui-wizard>
