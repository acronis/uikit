spec_version: '1.0'
component: ChartWidget

# Deliberately small. The header surface is `Card`'s, reached by spreading
# `header` onto `CardHeader` — listing those props again here would be a second
# source of truth that drifts the moment Card gains one.
contract:
  properties:
    - name: header
      type: CardHeaderProps
      required: false
      description: >-
        The card header, forwarded verbatim to `CardHeader` — `title`,
        `description`, `extras` (a filter chip), `actions` (the ⋯ menu),
        `isDraggable`, `isSwitchable`, `hasAvatar`, `hasRename`,
        `isCollapsible`. Omit for a header-less widget.
    - name: orientation
      type: "'vertical' | 'horizontal'"
      required: false
      default: vertical
      description: >-
        How the `metric` and plot are arranged inside the card body.
        `vertical` (default) — metric above the plot, full width; the metric
        takes its natural height and the plot fills the rest.
        `horizontal` — metric and plot side by side, each `flex-1`; use for
        compact (sm/288px) widgets where vertical space is at a premium.
    - name: metric
      type: ReactNode
      required: false
      description: >-
        The readout beside or above the plot (depending on `orientation`),
        typically a `Metric`.
    - name: state
      type: "'loading' | 'empty' | 'warning' | 'error' | 'number'"
      required: false
      description: >-
        Renders `ChartState` in place of the metric and plot, keeping the
        header. The consumer selects the state; no state is inferred from the
        data. Card chrome remains consistent for all states.
    - name: stateDescription
      type: ReactNode
      required: false
      description: >-
        Localized or context-specific content shown by `ChartState`. For
        `number`, pass the numeric value and unit. Defaults to per-state
        fallback content, including `0` for `number`.
    - name: bodyClassName
      type: string
      required: false
      description: >-
        Class for the card body. Rarely needed — the body already fills the
        card. For the case where neither the grid nor the content gives a
        height, e.g. a placeholder-only widget outside a sized cell.
    - name: children
      type: ReactNode
      required: false
      description: The selected state replaces this chart and the metric while `state` is set.
    - name: render
      type: useRender.RenderProp
      required: false
      description: >-
        Replace the rendered `<div>` with another element or component (Base UI
        composition), forwarded to `Card`. How a dashboard gives each widget a
        landmark role — `render={<section aria-label="Sessions" />}` — which is
        the one thing the widget can't infer for itself.
  events: []
  methods: []

adapters:
  react:
    component: ChartWidget
    status: implemented
    import: "import { ChartWidget } from '@acronis-platform/ui-react'"
    example: |
      <ChartWidget
        header={{
          title: 'Active alerts by severity',
          extras: <Tag variant="info">Last 6 months</Tag>,
          actions: <ButtonIcon aria-label="Widget actions"><EllipsisIcon size={16} /></ButtonIcon>,
        }}
        className="h-[300px] w-[592px]"
      >
        <AreaChart config={config} data={data} dataKeys={['sessions']} xKey="month" className="size-full" />
      </ChartWidget>

      <ChartWidget header={{ title: 'Severity' }} state="empty" bodyClassName="h-[252px]" />
  vue:
    component: AvChartWidget
    status: planned
    import: "import { AvChartWidget } from '@acronis-platform/ui-vue'"
    example: |
      <AvChartWidget state="empty" />
  web-components:
    element: ui-chart-widget
    status: planned
    import: "import '@acronis-platform/ui-wc/chart-widget'"
    example: |
      <ui-chart-widget state="empty"></ui-chart-widget>
