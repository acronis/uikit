spec_version: '1.0'
component: ChartWidget

schematic: |
  root: Card (surface, radius, standard border for every state)
    header: CardHeader — title · description · extras (filter chip) · actions (⋯)
            [drag handle · switch · avatar · rename · collapse trigger, all Card's]
            draws its own bottom divider
    body: CardContent — flex-1 min-h-0; 16px padding, 16px gap
      [vertical]   metric: shrink-0 full-width row above plot
                   plot:   flex-1 min-h-0 — the chart, or the placeholder while `state` is set
      [horizontal] metric: flex-[1_0_0] min-w-0 — metric and plot side by side, equal halves

root:
  element: div
  description: >-
    A `Card`, laid out as a full-height flex column so the height the grid gives
    it reaches the plot. The card chrome is consistent across states; state
    visuals live in ChartState inside the body. Carries
    `data-slot="chart-widget"`.

parts:
  - id: header
    element: slot
    description: >-
      A `CardHeader`, receiving the `header` object verbatim. Not re-declared
      here: a header feature added to `Card` reaches this component without a
      change. Omitted entirely when `header` is absent.
  - id: body
    element: div
    description: >-
      A `CardContent` carrying the 16px padding and 16px gap the design draws.
      `flex-1 min-h-0`, so it takes whatever height the header leaves of the
      card — which is how a `size-full` chart ends up filling the widget.
  - id: metric
    element: slot
    description: >-
      Optional readout — a `Metric` or any node. Layout depends on
      `orientation`: `vertical` (default) renders it as a `shrink-0` row above
      the plot at its natural height; `horizontal` gives it `flex-[1_0_0]
      min-w-0` so it shares the body width equally with the plot side by side.
    optional: true
    visible_when: a `metric` is provided
  - id: plot
    element: div
    description: >-
      The chart while `state` is unset, or `ChartState` when the consumer sets
      it. A selected state replaces both metric and plot. In `vertical` mode:
      `flex-1 min-h-0`, so it fills the height the metric row leaves. In
      `horizontal` mode: `flex-[1_0_0] min-w-0`, so it shares width equally with
      the metric slot. Either way a tall or wide chart shrinks inside the card
      instead of pushing past it.

states:
  - id: vertical
    trigger: "orientation === 'vertical' (default)"
    kind: prop
    prop: orientation
    affects: [body, metric, plot]
    exclusive_with: [horizontal]
  - id: horizontal
    trigger: "orientation === 'horizontal'"
    kind: prop
    prop: orientation
    affects: [body, metric, plot]
    exclusive_with: [vertical]
  - id: default
    trigger: '`state` is unset — the plot renders'
    kind: prop
    prop: state
    exclusive_with: [loading, empty, warning, error, number]
  - id: loading
    trigger: 'state="loading"'
    kind: prop
    prop: state
    affects: [body, metric, plot]
    exclusive_with: [default, empty, warning, error, number]
  - id: empty
    trigger: 'state="empty"'
    kind: prop
    prop: state
    affects: [body, metric, plot]
    exclusive_with: [default, loading, warning, error, number]
  - id: warning
    trigger: 'state="warning"'
    kind: prop
    prop: state
    affects: [body, metric, plot]
    exclusive_with: [default, loading, empty, error, number]
  - id: error
    trigger: 'state="error"'
    kind: prop
    prop: state
    affects: [body, metric, plot]
    exclusive_with: [default, loading, empty, warning, number]
  - id: number
    trigger: 'state="number"'
    kind: prop
    prop: state
    affects: [body, metric, plot]
    exclusive_with: [default, loading, empty, warning, error]
