spec_version: '1.0'
component: TrendIndicator

schematic: |
  +-------------------+
  |  [icon]  value    |   root: <span>
  +-------------------+
     ^        ^
     icon     value
  direction -> icon glyph
  sentiment -> color

root:
  element: span
  description: >-
    An inline `<span>`. `sentiment` drives the text color (the glyph inherits it
    via `currentColor`). With an `ariaLabel` it becomes `role="img"` with that
    label; as a tooltip trigger it is focusable (`tabIndex={0}`).

parts:
  - id: icon
    description: >-
      Decorative direction glyph (`aria-hidden`) chosen from `direction` —
      up/down trend arrows, or a horizontal arrow for `flat`. Mirrors under
      `dir="rtl"` via `rtl:-scale-x-100`. Hidden when `showIcon` is false.
    element: svg
    optional: true
    visible_when: showIcon is true (default)
  - id: value
    description: >-
      The already-formatted change (`value`) — numeric (`12%`, `3.5 h`) or
      qualitative (`Improving`). Rendered with `tabular-nums`.
    optional: true
    visible_when: a `value` is provided

layout:
  type: flex
  direction: row
  align: center
  order: [icon, value]

# A pure function of its props. `sentiment` is the only cva axis;
# direction selects the glyph and does not change any styles itself.
states:
  - {
      id: positive,
      trigger: "sentiment === 'positive'",
      kind: prop,
      prop: sentiment,
      affects: [root, icon, value],
    }
  - {
      id: negative,
      trigger: "sentiment === 'negative'",
      kind: prop,
      prop: sentiment,
      affects: [root, icon, value],
    }
  - {
      id: neutral,
      trigger: "sentiment === 'neutral'",
      kind: prop,
      prop: sentiment,
      affects: [root, icon, value],
    }
