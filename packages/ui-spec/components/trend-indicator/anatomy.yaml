spec_version: '1.0'
component: TrendIndicator

schematic: |
  +-------------------------------------+
  |  [icon]  value   comparison-label   |   root: <span>
  +-------------------------------------+
     ^        ^       ^
     icon     value   comparison-label
  direction -> icon glyph
  sentiment -> color (+ badge tint)
  size      -> text + icon size
  variant   -> inline | badge

root:
  element: span
  description: >-
    An inline `<span>`. `sentiment` drives the text color (the glyph inherits it
    via currentColor); `variant="badge"` adds a matching status tint; `size` sets
    the text/icon size. With an `ariaLabel` it becomes `role="img"` with that
    label; as a tooltip trigger it is focusable.

parts:
  - id: icon
    description: >-
      Decorative direction glyph (`aria-hidden`) chosen from `direction` —
      up/down trend arrows, or a horizontal arrow for `flat`. Hidden when
      `showIcon` is false.
    element: svg
    optional: true
    visible_when: showIcon is true (default)
  - id: value
    description: >-
      The already-formatted change (`value`) — numeric (`12%`, `3.5 h`) or
      qualitative (`Improving`). Rendered with tabular figures.
    optional: true
    visible_when: a `value` is provided
  - id: comparison-label
    description: >-
      Secondary comparison caption (`comparisonLabel`), e.g. "vs previous
      quarter", in the muted secondary text color.
    optional: true
    visible_when: a `comparisonLabel` is provided

layout:
  type: flex
  direction: row
  align: center
  order: [icon, value, comparison-label]

# A pure function of its props. Sentiment/size/variant are the cva axes;
# direction selects the glyph.
states:
  - {
      id: positive,
      trigger: "sentiment === 'positive'",
      kind: prop,
      prop: sentiment,
      affects: [root, icon, value],
    }
  - {
      id: negative,
      trigger: "sentiment === 'negative'",
      kind: prop,
      prop: sentiment,
      affects: [root, icon, value],
    }
  - {
      id: neutral,
      trigger: "sentiment === 'neutral'",
      kind: prop,
      prop: sentiment,
      affects: [root, icon, value],
    }
  - {
      id: inline,
      trigger: "variant === 'inline'",
      kind: prop,
      prop: variant,
      affects: [root],
    }
  - {
      id: badge,
      trigger: "variant === 'badge'",
      kind: prop,
      prop: variant,
      affects: [root],
    }
  - {
      id: small,
      trigger: "size === 'small'",
      kind: prop,
      prop: size,
      affects: [root, icon, value],
    }
  - {
      id: medium,
      trigger: "size === 'medium'",
      kind: prop,
      prop: size,
      affects: [root, icon, value],
    }
