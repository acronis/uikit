spec_version: '1.0'
component: DialogFooterCarousel2

contract:
  properties:
    - name: variant
      type: "'start' | 'middle' | 'end'"
      required: false
      default: "'start'"
      description: Which slide position this renders for.
    - name: slideCount
      type: number
      required: false
      default: 1
      description: Total number of slides, used to render the dot indicator.
    - name: selectedIndex
      type: number
      required: false
      default: 0
      description: The currently active slide index (0-based).
    - name: backLabel
      type: string
      required: false
      default: "'Back'"
      description: '`Back` button label.'
    - name: nextLabel
      type: string
      required: false
      default: "'Next'"
      description: '`Next` button label (`variant="start" | "middle"`).'
    - name: primaryLabel
      type: string
      required: false
      default: "'Call to action'"
      description: Call-to-action button label (`variant="end"`).
    - name: goToSlideLabel
      type: '(index: number, count: number) => string'
      required: false
      description: Builds each dot's accessible name from its 0-based index and the slide count.

  events:
    - name: select-index
      payload: number
      description: Fired when a dot is activated, with its slide index (React `onSelectIndex`).
    - name: back
      description: Fired when `Back` is activated (React `onBack`).
    - name: next
      description: Fired when `Next` is activated (React `onNext`).
    - name: primary-action
      description: Fired when the call-to-action button is activated (React `onPrimaryAction`).

adapters:
  react:
    component: DialogFooterCarousel2
    status: implemented
    import: "import { DialogFooterCarousel2 } from '@acronis-platform/ui-react'"
    example: |
      <DialogFooterCarousel2
        variant="middle"
        slideCount={3}
        selectedIndex={1}
        onSelectIndex={setSelectedIndex}
        onBack={() => embla.scrollPrev()}
        onNext={() => embla.scrollNext()}
      />
  vue:
    component: AvDialogFooterCarousel2
    status: planned
    import: "import { AvDialogFooterCarousel2 } from '@acronis-platform/ui-vue'"
    example: |
      <AvDialogFooterCarousel2
        variant="middle"
        :slide-count="3"
        :selected-index="1"
        @select-index="onSelectIndex"
      />
  web-components:
    element: ui-dialog-footer-carousel-2
    status: planned
    import: "import '@acronis-platform/ui-wc/dialog-footer-carousel-2'"
    example: |
      <ui-dialog-footer-carousel-2
        variant="middle"
        slide-count="3"
        selected-index="1"
      ></ui-dialog-footer-carousel-2>
