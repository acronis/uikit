spec_version: '1.0'
component: Alert

contract:
  properties:
    - name: variant
      type: "'info' | 'success' | 'warning' | 'critical' | 'danger'"
      required: false
      default: "'info'"
      description: >-
        Severity. Sets the border color, the leading status-line color, and the
        default status icon. The surface stays neutral in every severity.
  content:
    - name: children
      description: >-
        The composed parts — AlertIcon, AlertContent (AlertText wrapping
        AlertTitle / AlertDescription, optionally AlertActions), and AlertClose.
  events: []
  methods: []

adapters:
  react:
    component: Alert
    status: implemented
    import: "import { Alert, AlertIcon, AlertContent, AlertText, AlertTitle, AlertDescription, AlertActions, AlertClose } from '@acronis-platform/ui-react'"
    example: |
      <Alert variant="danger">
        <AlertIcon />
        <AlertContent>
          <AlertText>
            <AlertTitle>Session expired</AlertTitle>
            <AlertDescription>Sign in again to keep working.</AlertDescription>
          </AlertText>
          <AlertActions>
            <Button variant="secondary">Sign in</Button>
          </AlertActions>
        </AlertContent>
        <AlertClose onClick={dismiss} />
      </Alert>
  vue:
    component: AvAlert
    status: planned
    import: "import { AvAlert } from '@acronis-platform/ui-vue'"
    example: |
      <AvAlert variant="danger" />
  web-components:
    element: ui-alert
    status: planned
    import: "import '@acronis-platform/ui-wc/alert'"
    example: |
      <ui-alert variant="danger"></ui-alert>
