spec_version: '1.0'
component: CarouselDialog
name: carousel-dialog
status: draft
category: layout
description: >-
  The control row inside a `DialogFooterCarousel`: a `Back` button (hidden on
  the first slide), a dot slide indicator, and a `Next`/call-to-action
  button. Pure controls — no Embla import; the slide count/index/callbacks
  are threaded down from `DialogWelcome`, which owns the carousel engine.
  Deliberately NOT exported from `@acronis-platform/ui-react`'s public entry
  point — it is an internal primitive consumed only by
  `DialogFooterCarousel`. Apps building a welcome/onboarding carousel dialog
  should use `DialogWelcome` instead.
since: 0.58.0
dependencies:
  components:
    - Button
figma:
  node: '6353-4718'
