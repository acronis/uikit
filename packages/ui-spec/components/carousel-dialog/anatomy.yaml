spec_version: '1.0'
component: CarouselDialog

schematic: |
  root: <div> (flex row, 32px tall, full width, space-between)
  +---------------------------------------------------------------+
  |  boxLeft: Back        * o o (listIndicator)   boxRight: Next  |
  +---------------------------------------------------------------+
     boxLeft       -> holds the `Back` button; empty on the first slide
     listIndicator -> one dot per slide; the active dot uses a stronger color
     boxRight      -> `Next` on the first/middle slide, the call-to-action
                       label on the last slide

  Hosted inside `DialogFooterCarousel`'s themed footer bar (not separately
  specced here — that component only supplies the bar's background/height/
  padding around this row).

root:
  element: div
  description: >-
    Flex row, fixed 32px height, full width, `justify-between` across the
    three parts. No tokens of its own — geometry only; color comes from the
    parts below and from the nested `Button` instances.

parts:
  - id: boxLeft
    description: Holds the `Back` button.
    element: div
    optional: true
    visible_when: 'variant is `"middle"` or `"last"` (hidden on `"first"`)'
  - id: listIndicator
    description: >-
      One dot per slide (`slideCount`). Each dot is a button; clicking it
      calls `onSelectIndex` with that slide's index. The active slide's dot
      (`selectedIndex`) renders in `--ui-glyph-on-surface-primary`; the rest in
      `--ui-glyph-on-surface-disabled`. Gap between dots comes from
      `--ui-carousel-dialog-list-indicator-gap`.
    element: div
  - id: boxRight
    description: >-
      Holds the `Next` button (`variant="first" | "middle"`) or the
      call-to-action button (`variant="last"`).
    element: div

layout:
  type: flex
  direction: row
  align: center
  order: [boxLeft, listIndicator, boxRight]

states:
  - id: first
    trigger: 'variant="first"'
    kind: prop
    prop: variant
    affects: [boxLeft, boxRight]
  - id: middle
    trigger: 'variant="middle"'
    kind: prop
    prop: variant
    affects: [boxLeft, boxRight]
  - id: last
    trigger: 'variant="last"'
    kind: prop
    prop: variant
    affects: [boxLeft, boxRight]
