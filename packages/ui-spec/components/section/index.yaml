spec_version: '1.0'
component: Section
name: section
status: ready
category: layout
description: >-
  A titled band that groups `Card`s (or a table) on a page. A compound
  component — `Section` (root) + `SectionHeader` + `SectionContent` — whose
  root `variant` threads through context so the header and content adapt
  their layout/padding without repeating it. Collapsibility is composed by
  wrapping the header and content in `AccordionContainer`, the same shared
  disclosure primitive `Card` uses.
since: 2.1.0
dependencies:
  components:
    - Switch
    - AccordionContainer
    - ButtonIcon
