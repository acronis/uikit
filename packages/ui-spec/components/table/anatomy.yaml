spec_version: '1.0'
component: Table

schematic: |
  view-options:  [ ⚙ View ▾ ]   (show/hide columns dropdown, optional)
  root: <table> (in a horizontally scrollable container)
  +-----------------------------------------------------------------+
  | header: <thead>                                                 |
  |   row: <tr>                                                     |
  |     select-cell ☐ | head: <th> Name ⇅ | head: <th> Status |     |
  |                                            settings-cell ⚙      |
  +-----------------------------------------------------------------+
  | body: <tbody>                                                   |
  |   row: <tr> (idle / hover / selected)                           |
  |     select-cell ☐ | cell: <td> John Smith | cell ▸ wrap |       |
  |                                            actions-cell ⋯       |
  +-----------------------------------------------------------------+
  | footer: <tfoot>                                                 |
  |   row > cell: Total ............................. $750.00       |
  +-----------------------------------------------------------------+
  caption: <caption> (optional, below the table)
  pagination:  "N of M selected"  [Rows per page ▾]  Page X of Y  ⏮ ◀ ▶ ⏭
     head    -> --ui-table-header-label-color; idle/hover/active via --ui-table-header-cell-color-*
     sortable head -> sort icon (--ui-table-header-sort-icon-color-*) + aria-sort;
                      the whole cell tints on hover/press and owns the focus ring
     row     -> idle/hover/active (selected) via --ui-table-data-row-color-*;
                divider via --ui-table-global-row-border-{color,width,style}
     cell    -> --ui-table-global-cell-{padding-x,padding-y,min-height},
                idle/hover/active via --ui-table-data-cell-color-*; wrap grows height
     select-cell   -> 32px leading column (padding-start only), holds a Checkbox
     actions-cell  -> 48px trailing column, end-aligned overflow trigger
     settings-cell -> 48px trailing header column, end-aligned settings trigger

root:
  element: table
  role: table
  description: >-
    The `<table>` (wrapped in a `overflow-auto` container for horizontal scroll).
    Text color comes from `--ui-table-data-value-color-idle`.

parts:
  - id: header
    description: Column-header section (`<thead>`).
    element: thead
    optional: true
  - id: body
    description: The data rows section (`<tbody>`).
    element: tbody
    optional: true
  - id: footer
    description: Summary section (`<tfoot>`) with a top divider.
    element: tfoot
    optional: true
  - id: row
    description: >-
      A table row (`<tr>`). Idle/hover come from `--ui-table-data-row-color-*`;
      `selected` applies the active token + `data-state="selected"`.
    element: tr
  - id: head
    description: >-
      A column header cell (`<th>`). When `sortable`, it renders a focusable sort
      button with a sort icon and sets `aria-sort`. `wrap` lets the label wrap onto
      multiple lines and drops the fixed row height (otherwise `h-10`).
    element: th
  - id: cell
    description: >-
      A data cell (`<td>`) — padding/border from the cell tokens. Truncates within
      the fixed row height (`h-10`) by default; `wrap` switches it to
      `whitespace-normal` and lets the row grow to fit multi-line content.
    element: td
  - id: select-cell
    description: >-
      The row-selection cell (Figma part `TableCheckbox`) — a fixed 32px leading
      column holding a label-less Checkbox. Only the inline-start padding is
      applied so the box sits flush against the first data cell. Renders `<th>`
      for the header's select-all cell, `<td>` for a row's.
    element: td/th
    optional: true
  - id: actions-cell
    description: >-
      The trailing row-actions cell (Figma part `TableActions`) — a fixed 48px
      end-aligned column holding the consumer's overflow trigger. The cell
      carries the hover/press tint and the focus ring. While a bulk selection is
      active (`bulk-selection-active`: one or more rows selected)
      it renders as an empty, untinted cell of the same width.
    element: td
    optional: true
  - id: settings-cell
    description: >-
      The trailing header cell holding the column-settings trigger (Figma part
      `TableSettings`) — a fixed 48px end-aligned column. Visual states only;
      what the trigger opens is the consumer's choice (TableViewOptions is the
      ready-made column-visibility menu).
    element: th
    optional: true
  - id: caption
    description: Optional table caption (`<caption>`), muted, below the table.
    element: caption
    optional: true
  - id: pagination
    description: >-
      TablePagination — a TanStack-independent pagination bar driven by plain
      props: an optional selection/row summary, a rows-per-page select, a page
      indicator, and first / prev / next / last controls.
    element: div
    optional: true
  - id: view-options
    description: >-
      TableViewOptions — a TanStack-independent show/hide-columns dropdown driven
      by a plain `{ id, label, hidden }[]` + `onToggle` (a checkbox per column).
    element: div
    optional: true

layout:
  type: table
  order: [header, body, footer]

states:
  - {
      id: selected,
      trigger: 'selected === true on a row',
      kind: prop,
      prop: selected,
      affects: [row],
    }
  - {
      id: sorted,
      trigger: "sort-direction is 'asc' or 'desc' on a sortable head",
      kind: prop,
      prop: sort-direction,
      affects: [head],
    }
  - {
      id: wrap,
      trigger: 'wrap === true on a cell or head',
      kind: prop,
      prop: wrap,
      affects: [cell, head],
    }
  - {
      id: header-hover,
      trigger: pointer hover over a sortable header,
      kind: pseudo,
      pseudo: ':hover',
      affects: [head, settings-cell],
    }
  - {
      id: header-press,
      trigger: pointer press on a sortable header or the settings cell,
      kind: pseudo,
      pseudo: ':active',
      affects: [head, settings-cell],
    }
  - {
      id: header-focus,
      trigger: keyboard focus on a sortable header,
      kind: pseudo,
      pseudo: ':focus-visible',
      affects: [head, settings-cell],
    }
  - {
      id: row-focus,
      trigger: keyboard focus on a focusable row,
      kind: pseudo,
      pseudo: ':focus-visible',
      affects: [row],
    }
  - {
      id: cell-hover,
      trigger: pointer hover over the row-actions cell,
      kind: pseudo,
      pseudo: ':hover',
      affects: [actions-cell],
    }
  - {
      id: cell-press,
      trigger: pointer press on the row-actions cell,
      kind: pseudo,
      pseudo: ':active',
      affects: [actions-cell],
    }
