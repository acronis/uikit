spec_version: '1.0'
component: StepperItem
name: stepper-item
status: ready
category: navigation
description: >-
  One step in a stepper — a consumer-composed avatar marker followed by the step
  name. `variant` is the step's structural role in the sequence (`current`,
  `completed`, `future`) and drives the container background and label color;
  `state` is the interaction look and only changes anything on a completed step.
  An optional trailing connecting line chains a row of steps together. The
  component owns the container, the label, and that connector only: the marker is
  supplied and styled entirely by the caller, and the step sequence, ordering, and
  navigation belong to the application.
since: 0.63.0
dependencies:
  components:
    - avatar
