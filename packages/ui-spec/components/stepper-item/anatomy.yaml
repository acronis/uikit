spec_version: '1.0'
component: StepperItem

schematic: |
  container (div by default, polymorphic)      variant: current | completed | future
  +---------------------------------------+                state: idle | hover | active
  |  ( avatar-slot )   label              |
  +---------------------------------------+

  avatar-slot -> the caller's Avatar, rendered verbatim (never restyled here)
  label       -> --ui-text-on-surface-primary, or --ui-text-on-surface-disabled when future
  container   -> --ui-background-surface-active (current, and completed+active)
                 --ui-background-surface-hover  (completed+hover)
                 no fill                        (completed+idle, future)

root:
  element: div
  description: >-
    The step's container. Lays the marker and the label out in a row and carries
    the background for the current step and for a completed step's hover/active
    look. Polymorphic via the `render` prop — a completed step is usually a real
    `<button>` that jumps back, and it then carries the library's 3px
    `focus-visible` ring. A future step is marked `aria-disabled`, dropped from
    the tab order (`tabindex="-1"`), and takes no pointer events; on the default
    `<div>` it also gets an explicit `role="link"` so `aria-disabled` is actually
    announced.

parts:
  - id: avatar-slot
    description: >-
      Required marker slot holding the caller's `Avatar` — the step number, a
      check icon, an image, whatever the sequence calls for. Rendered verbatim:
      the step never sizes, tints, or recolors it, which is why the Figma
      variables that color the digit inside the circle are not consumed here.
  - id: label
    description: >-
      The step name. Truncates rather than wrapping. Primary surface text, or the
      disabled surface text on a future step.
    element: span
    optional: true
    visible_when: a `label` is provided

layout:
  type: flex
  direction: row
  align: center
  order: [avatar-slot, label]

# Only five of the nine variant x state combinations exist in the design, and
# that asymmetry is the component's contract: `state` is a real axis, but it is
# only observable on a completed step.
states:
  - id: current
    trigger: "variant === 'current'"
    kind: prop
    prop: variant
    affects: [container, label]
  - id: completed
    trigger: "variant === 'completed'"
    kind: prop
    prop: variant
    affects: [container, label]
  - id: future
    trigger: "variant === 'future'"
    kind: prop
    prop: variant
    affects: [container, label]
  - id: idle
    trigger: "state === 'idle'"
    kind: prop
    prop: state
    affects: [container]
  - id: hover
    trigger: "state === 'hover' (visible only when variant === 'completed')"
    kind: prop
    prop: state
    affects: [container]
  - id: active
    trigger: "state === 'active' (visible only when variant === 'completed')"
    kind: prop
    prop: state
    affects: [container]
