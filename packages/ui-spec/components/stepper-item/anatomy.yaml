spec_version: '1.0'
component: StepperItem

schematic: |
  container (div by default, polymorphic)      variant: current | completed | future
  +---------------------------------------+                state: idle | hover | active | focus
  |  ( avatar-slot )   label              |
  +---------------------------------------+

  avatar-slot -> the caller's Avatar, rendered verbatim (never restyled here)
  label       -> --ui-stepper-item-{current,completed}-label-color, or -future-label-color
  container   -> border box reserved on every variant (transparent unless current)
                 --ui-stepper-item-current-container-color + border (current)
                 --ui-stepper-item-completed-container-color-{idle,hover,active} fill (completed+state)
                 --ui-stepper-item-completed-container-color-focus-ring 3px ring (completed+focus)
                 --ui-stepper-item-future-container-color fill (future)
                 the completed `idle` and `future` fills are wired to their own
                 tokens, transparent in the shipped brands — nothing paints today,
                 but a brand override is honored

root:
  element: div
  description: >-
    The step's container. Lays the marker and the label out in a row and carries
    the background for every variant: the current step's fill and border, a
    completed step's per-state fill (`idle`, `hover`, `active`) or focus ring, and
    the future step's own fill. The completed `idle` and future fills are wired to
    their own tokens but resolve to `transparent` in the shipped brands, so they
    read as no fill today while a brand override is still honored.
    Polymorphic via the `render` prop — a completed step is
    usually a real `<button>` that jumps back, and it then carries the library's
    3px `focus-visible` ring (the same color as the declarative `focus` state's
    ring, since the two tokens are identical). A future step is marked
    `aria-disabled`, dropped from the tab order (`tabindex="-1"`), and takes no
    pointer events; on the default `<div>` it also gets an explicit `role="link"`
    so `aria-disabled` is actually
    announced.

parts:
  - id: avatar-slot
    description: >-
      Required marker slot holding the caller's `Avatar` — the step number, a
      check icon, an image, whatever the sequence calls for. Rendered verbatim:
      the step never sizes, tints, or recolors it, which is why the Figma
      variables that color the digit inside the circle are not consumed here.
  - id: label
    description: >-
      The step name. Truncates rather than wrapping. Colored by the current /
      completed / future label-color token of the step's own variant, and typed
      by the tier's generated `.ui-stepper-item-global-container-text-style`
      class (applied on the container and inherited here), so the name keeps its
      500 weight in every variant.
    element: span
    optional: true
    visible_when: a `label` is provided

layout:
  type: flex
  direction: row
  align: center
  order: [avatar-slot, label]

# `state` gained a fourth value (`focus`) with the dedicated `--ui-stepper-item-*`
# token tier (re-synced 2026-08-24, see tokens.yaml) — it is a real axis, but it
# is only observable on a completed step.
states:
  - id: current
    trigger: "variant === 'current'"
    kind: prop
    prop: variant
    affects: [container, label]
  - id: completed
    trigger: "variant === 'completed'"
    kind: prop
    prop: variant
    affects: [container, label]
  - id: future
    trigger: "variant === 'future'"
    kind: prop
    prop: variant
    affects: [container, label]
  - id: idle
    trigger: "state === 'idle'"
    kind: prop
    prop: state
    affects: [container]
  - id: hover
    trigger: "state === 'hover' (visible only when variant === 'completed')"
    kind: prop
    prop: state
    affects: [container]
  - id: active
    trigger: "state === 'active' (visible only when variant === 'completed')"
    kind: prop
    prop: state
    affects: [container]
  - id: focus
    trigger: "state === 'focus' (visible only when variant === 'completed')"
    kind: prop
    prop: state
    affects: [container]
