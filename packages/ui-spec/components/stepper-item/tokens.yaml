spec_version: '1.0'
component: StepperItem

# References only. Values live in @acronis-platform/tokens-pd and resolve per
# brand/theme at paint time; never restate values here.
#
# ── Dedicated `--ui-stepper-item-*` tier (re-synced 2026-08-24) ──
# @acronis-platform/tokens-pd now ships a `Stepper` tier
# (`packages/tokens-pd/css/Stepper/default.css`), generated from a Figma sync
# that added the `Stepper.Item` component. This replaces the semantic/generic
# placeholder tokens (`--ui-background-surface-*`, `--ui-text-on-surface-*`)
# the implementation used before the tier existed. Two things changed in the
# same sync:
#   - the container's horizontal padding is asymmetric — `padding-l` (8px) and
#     `padding-r` (16px) are separate tokens, not one shared value;
#   - the completed step's interaction states gained a fourth role,
#     `container-color-focus-ring`, alongside `-hover` and `-active`.
# The label's typography ships as the generated class
# `.ui-stepper-item-global-container-text-style` (family / size / weight 500 /
# line-height / letter-spacing), which tokens-pd emits alongside the Stepper
# tier, rather than as individual `--ui-*` custom properties — so it is not
# listed below. The implementation consumes it by applying that class name
# verbatim.
#
# The variables that color the digit *inside* the avatar circle
# (`components/Stepper/Item/{current,future}/label/color/*`) are intentionally
# not consumed: the marker is supplied and styled by the caller, so those
# belong to whatever Avatar composition is passed in.
source: '@acronis-platform/tokens-pd'

tokens:
  - name: --ui-stepper-item-global-container-gap
    affects: container
    description: Marker-to-label gap.
  - name: --ui-stepper-item-global-container-padding-l
    affects: container
    description:
      Container's inline-start padding (closer to the avatar than the end side);
      Figma's `l` names its LTR frame, so it maps to `padding-inline-start`.
  - name: --ui-stepper-item-global-container-padding-r
    affects: container
    description: Container's inline-end padding (gives the label room); maps to
      `padding-inline-end`.
  - name: --ui-stepper-item-global-container-padding-y
    affects: container
    description: Container's vertical padding.
  - name: --ui-stepper-item-global-container-border-radius
    affects: container
    description: Container corner radius.
  - name: --ui-stepper-item-current-container-color
    affects: container
    description: Container fill for the current step.
  - name: --ui-stepper-item-current-container-border-color
    affects: container
    description:
      Container border color for the current step. Other variants keep
      the same border box with a transparent color, so no variant is sized
      differently from its siblings.
  - name: --ui-stepper-item-current-container-border-width
    affects: container
    description:
      Container border width. Reserved on every variant (the tier ships
      only this one width) so the current step is not larger than its siblings;
      only the current step paints a visible color.
  - name: --ui-stepper-item-current-label-color
    affects: label
    description: Step-name color for the current step.
  - name: --ui-stepper-item-completed-container-color-hover
    affects: container
    description: Container fill for a completed step in its `hover` state.
  - name: --ui-stepper-item-completed-container-color-active
    affects: container
    description: Container fill for a completed step in its `active` state.
  - name: --ui-stepper-item-completed-container-color-focus-ring
    affects: container
    description: >-
      Container ring color for a completed step in its `focus` state.
      Byte-identical to `--ui-focus-primary` — it names a ring, not a fill.
  - name: --ui-stepper-item-completed-label-color
    affects: label
    description: Step-name color for a completed step (all interaction states).
  - name: --ui-stepper-item-future-label-color
    affects: label
    description: Step-name color for a future step.
  - name: --ui-focus-primary
    affects: container
    description: >-
      The 3px `focus-visible` ring, which only ever shows on a step composed as a
      real control via `render`. Not a Stepper-tier token — it is the
      library-wide focus token (`CardFilter`, `BreadcrumbLink`), so a composed
      step focuses like every other control in the kit.
