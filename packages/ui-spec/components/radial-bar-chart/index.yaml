spec_version: '1.0'
component: RadialBarChart
name: radial-bar-chart
status: draft
category: data-display
description: >-
  A typed radial-bar-chart composition over the shared `Chart` primitives (a
  polar/radial type). Plots each data row as a concentric arc sized by `dataKey`
  and colored per `nameKey` — or, with `dataKeys`, one arc per metric — inside a
  `ChartContainer` with an optional background track, tooltip, and legend. No
  variant axes: the sweep (start/end angle), radii and centre are plain props.
  `valueDomain` scales the arcs against a known range, which is what turns a
  single value into a readable gauge; `segments` draws such a gauge's ring as
  notched pieces and `centerLabel` puts the reading in the hole. Ported from the
  apps/demo `RadialChartPlayground`.
since: 0.58.0
