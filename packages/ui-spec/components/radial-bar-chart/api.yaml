spec_version: '1.0'
component: RadialBarChart

# Framework-agnostic contract. RadialBarChart has NO cva variant axes — its sweep
# (start/end angle) and radii are plain geometry props, so there are no variant
# enums to conformance-check. Rows become concentric arcs (like Pie/Funnel: one
# `dataKey`, named by `nameKey`).
contract:
  properties:
    - name: data
      type: ReadonlyArray<Record<string, string | number>>
      required: true
      description: Row-per-arc data — each row holds a `nameKey` label and a `dataKey` numeric value.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Arcs take their colour from the container's `palette`; each entry, keyed
        by the arc's `nameKey` value, maps that arc to a `label` and an optional
        `tone`. Resolved into the `--color-<name>` custom properties the arcs
        fill from.
    - name: dataKey
      type: string
      required: true
      description: The numeric field that sizes each arc. Ignored when dataKeys is set.
    - name: dataKeys
      type: string[]
      required: false
      description: >-
        Multi-metric mode: one arc per key instead of one per row, colored and
        named from config keyed by the KEY (the cartesian-chart convention).
        Every metric shares one angular scale, so pair it with valueDomain.
    - name: nameKey
      type: string
      required: true
      description: >-
        The label field that names each arc (drives legend, tooltip, and the
        `--color-<name>` lookup). Values should be unique per chart — arcs sharing
        a name share one config/color entry.
    - name: innerRadius
      type: number
      required: false
      default: '30'
      description: Inner radius of the innermost arc.
    - name: outerRadius
      type: number
      required: false
      default: '110'
      description: Outer radius of the outermost arc.
    - name: startAngle
      type: number
      required: false
      default: '90'
      description: Angle (degrees) the arcs sweep from.
    - name: endAngle
      type: number
      required: false
      default: '-270'
      description: Angle (degrees) the arcs sweep to (default is a full clockwise circle).
    - name: valueDomain
      type: '[number, number]'
      required: false
      description: >-
        The value range the sweep represents. Without it every arc is drawn
        relative to the largest value in the data, so a single value always fills
        the sweep — which is never what a gauge means.
    - name: cornerRadius
      type: number
      required: false
      default: '4'
      description: Corner radius on each arc's ends.
    - name: cx
      type: number | string
      required: false
      default: "'50%'"
      description: Horizontal center of the arcs, in px or a percentage of the width.
    - name: cy
      type: number | string
      required: false
      default: "'50%'"
      description: >-
        Vertical center of the arcs, in px or a percentage of the height. Worth
        moving for a half-circle gauge, whose drawn half otherwise sits in the
        upper half of the surface.
    - name: barSize
      type: number
      required: false
      description: Thickness of each arc, in px. Omit to let the radii and gaps size it.
    - name: barGap
      type: number | string
      required: false
      description: Gap between the arcs of different metrics in one band, in px.
    - name: barCategoryGap
      type: number | string
      required: false
      description: Gap between bands, in px or a percentage string.
    - name: minAngle
      type: number
      required: false
      description: >-
        Smallest angle a non-zero arc may occupy, in degrees, so a tiny value
        stays visible. The floor also applies to a 0, which then reads as a small
        positive — leave unset when a metric can legitimately be zero.
    - name: margin
      type: '{ top?: number; right?: number; bottom?: number; left?: number }'
      required: false
      description: Plot-area margin, in px. Omit for recharts' default (5 a side).
    - name: segments
      type: number
      required: false
      description: >-
        Draw a single-value gauge's ring as this many equal segments, notched
        apart. Needs valueDomain, and applies only to a single-value gauge:
        anything else — more than one row, dataKeys set, fewer than two segments,
        or a dataKey value that is not a number — falls back to the normal
        concentric arcs (legend included) rather than erroring. The ring is then
        synthetic geometry, so the arc labels and the legend are suppressed and
        showBackground is redundant (the unreached segments are the track); the
        tooltip reads the metric wherever the ring is hovered.
    - name: segmentGap
      type: number
      required: false
      default: '3'
      description: >-
        Gap between a segmented gauge's segments, in degrees. Clamped so the
        segments always keep at least half the sweep.
    - name: centerLabel
      type: '{ value?: string | number; label?: string | number }'
      required: false
      description: >-
        The readout in the hole — a headline value and/or a caption, stacked and
        centered. Needs an innerRadius big enough to hold the text; it is not
        clipped to the hole.
    - name: showPolarGrid
      type: boolean
      required: false
      default: 'false'
      description: Draw the concentric polar grid behind the arcs.
    - name: showBackground
      type: boolean
      required: false
      default: 'true'
      description: Render a muted background track behind each arc.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
    - name: showLabels
      type: boolean
      required: false
      default: 'false'
      description: Render a value label on each data point/segment.
    - name: labelPosition
      type: "'outside' | 'center' | 'centerTop' | 'centerBottom' | 'insideStart' | 'insideEnd' | 'end'"
      required: false
      default: "'insideStart'"
      description: >-
        Where the value labels sit on the arc. Polar positions only — the
        cartesian ones collapse to the same mid-radius placement. Inside
        placements switch the label to the on-fill token.
    - name: labelFormat
      type: "'value' | 'name-value'"
      required: false
      default: "'value'"
      description: >-
        What each data label reads — the value alone, or the arc's name and its
        value. The name is the row's nameKey value, or the metric's config label
        in multi-metric mode.
    - name: labelFormatter
      type: '(value) => string'
      required: false
      description: >-
        Format each label value (reuses the tick formatters). Formats only the
        numeric part, so a label and its tooltip stay in the same units.
  events: []
  methods: []

adapters:
  react:
    component: RadialBarChart
    status: implemented
    import: "import { RadialBarChart } from '@acronis-platform/ui-react'"
    example: |
      <RadialBarChart
        config={config}
        data={data}
        dataKey="value"
        nameKey="browser"
        className="h-[360px] w-[360px]"
      />
  vue:
    component: AvRadialBarChart
    status: planned
    import: "import { AvRadialBarChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvRadialBarChart :config="config" :data="data" data-key="value" name-key="browser" />
  web-components:
    element: ui-radial-bar-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/radial-bar-chart'"
    example: |
      <ui-radial-bar-chart></ui-radial-bar-chart>
