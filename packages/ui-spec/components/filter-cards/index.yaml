component: FilterCards
name: filter-cards
status: ready
category: data-display
description: >-
  A horizontal row container (the Figma `FilterCards` component) that lays out
  a set of `CardFilter` items, stretching each to an equal share of the
  available width. Pure layout — it owns no visual styling of its own besides
  the inter-card gap. Figma's nested `ListCards` slot maps to `children`.
