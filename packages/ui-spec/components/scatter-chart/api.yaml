spec_version: '1.0'
component: ScatterChart

# Framework-agnostic contract. ScatterChart has NO cva variant axes (its shape is
# fixed; expressiveness is in the data mapping), so there are no variant enums to
# conformance-check. Each series carries its own point array — points are not
# columns of a shared row the way bar/line/area series are — so the contract
# takes a `series` list rather than `dataKeys` over one `data` array.
contract:
  properties:
    - name: series
      type: ScatterSeries[]
      required: true
      description: >-
        One `<Scatter>` per entry, each `{ key, data }` with its own point array.
        `key` matches a `config` entry and drives its `--color-<key>` fill. A
        single entry gives an ungrouped scatter.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Per-series map of label / color, keyed by `series[].key` (from the shared
        Chart primitives). Turned into `--color-<key>` custom properties. Colors
        are caller-supplied.
    - name: xKey
      type: string
      required: true
      description: Numeric field for the horizontal axis.
    - name: yKey
      type: string
      required: true
      description: Numeric field for the vertical axis.
    - name: xAxisLabel
      type: string
      required: false
      description: Title rendered beneath the horizontal (X) axis.
    - name: yAxisLabel
      type: string
      required: false
      description: Title rendered beside the vertical (Y) axis (rotated).
    - name: xUnit
      type: string
      required: false
      description: Unit suffix appended to X-axis tick values (recharts `unit`).
    - name: yUnit
      type: string
      required: false
      description: Unit suffix appended to Y-axis tick values (recharts `unit`).
    - name: zKey
      type: string
      required: false
      description: Optional numeric field mapped to point size (a bubble chart), via recharts `ZAxis`.
    - name: zRange
      type: '[number, number]'
      required: false
      default: '[60, 400]'
      description: Point-size range `[min, max]` the `zKey` maps into. Ignored when `zKey` is unset (points use recharts' default size).
    - name: shape
      type: "'circle' | 'cross' | 'diamond' | 'square' | 'star' | 'triangle' | 'wye'"
      required: false
      default: "'circle'"
      description: Marker shape for every point.
    - name: showGrid
      type: boolean
      required: false
      default: 'true'
      description: Render the CartesianGrid.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: showXAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the X axis (its ticks and title). Set false to hide it.
    - name: showYAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the Y axis (its ticks and title). Set false to hide it.
    - name: xTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each X-axis tick value. Unlike the `unit` suffix (append-only), a
        formatter transforms the value — abbreviate, prefix a symbol, or map to a
        label. Use formatCompactNumber / formatPercent / createTickFormatter from
        the shared Chart primitives, or any function.
    - name: yTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each Y-axis tick value (see xTickFormatter).
    - name: xAxisAngle
      type: number
      required: false
      description: Rotate the X-axis tick labels by this many degrees (a negative angle tilts them up toward the right); the tick anchor + axis height adjust.
    - name: xAxisInterval
      type: "number | 'preserveStart' | 'preserveEnd' | 'preserveStartEnd' | 'equidistantPreserveStart'"
      required: false
      description: >-
        X-axis tick density — a recharts placement strategy, or a fixed number of
        ticks to skip between two rendered ones (recharts interval: 0 shows every
        tick, 1 every other one, 2 every third).
    - name: yAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the value axis (recharts tickCount; a hint, not
        exact). Applies to whichever axis holds the values — Y for most charts, X
        for BarChart with orientation="horizontal".
    - name: yAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Value-axis domain preset — auto (fit the data at both ends; the axis need
        not include 0), zero (anchor the axis at 0, which is also recharts'
        behaviour when the prop is omitted), or dataMin-dataMax (tight to the
        data, no padding). Applies to whichever axis holds the values — Y for most
        charts, X for BarChart with orientation="horizontal".
    - name: gridDashed
      type: boolean
      required: false
      description: Draw grid lines dashed instead of solid.
    - name: gridHorizontal
      type: boolean
      required: false
      description: Show horizontal grid lines (defaults to the chart's own default when unset).
    - name: gridVertical
      type: boolean
      required: false
      description: Show vertical grid lines (defaults to the chart's own default when unset).
  events: []
  methods: []

adapters:
  react:
    component: ScatterChart
    status: implemented
    import: "import { ScatterChart } from '@acronis-platform/ui-react'"
    example: |
      <ScatterChart
        config={config}
        series={series}
        xKey="hours"
        yKey="score"
        zKey="weight"
        className="h-[360px] w-[520px]"
      />
  vue:
    component: AvScatterChart
    status: planned
    import: "import { AvScatterChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvScatterChart :config="config" :series="series" x-key="hours" y-key="score" />
  web-components:
    element: ui-scatter-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/scatter-chart'"
    example: |
      <ui-scatter-chart></ui-scatter-chart>
