spec_version: '1.0'
component: Separator

contract:
  properties:
    - name: orientation
      type: "'horizontal' | 'vertical'"
      required: false
      default: "'horizontal'"
      description: >-
        Direction of the rule; sets aria-orientation and swaps the 1px
        dimension.
    - name: size
      type: "'S1' | 'S2' | 'S3'"
      required: false
      default: "'S1'"
      description: >-
        Surrounding spacing baked into the rule (Figma variant `Size`). `S1`
        (default) has none; `S2`/`S3` apply `--ui-gap-4`/`--ui-gap-8` as
        margin on the axis perpendicular to the line.
  events: []
  methods: []

adapters:
  react:
    component: Separator
    status: implemented
    import: "import { Separator } from '@acronis-platform/ui-react'"
    example: |
      <Separator className="my-4" />
      <Separator orientation="vertical" />
      <Separator size="S2" />
  vue:
    component: AvSeparator
    status: planned
    import: "import { AvSeparator } from '@acronis-platform/ui-vue'"
    example: |
      <AvSeparator orientation="vertical" />
  web-components:
    element: ui-separator
    status: planned
    import: "import '@acronis-platform/ui-wc/separator'"
    example: |
      <ui-separator orientation="vertical"></ui-separator>
