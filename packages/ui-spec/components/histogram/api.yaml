spec_version: '1.0'
component: Histogram

# No cva: Histogram has no visual variant axes. `binCount` / `domain` are plain
# props driving the binning, not conformance-checked variants.
contract:
  properties:
    - name: values
      type: ReadonlyArray<number>
      required: true
      description: Raw continuous samples to bin. Non-finite values are ignored.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        The single series takes its colour from the container's `palette`; the
        entry, keyed by `dataKey`, maps it to a `label` and an optional `tone`.
        Resolved into the `--color-<dataKey>` custom property the bars fill from.
    - name: dataKey
      type: string
      required: false
      default: "'count'"
      description: The `config` key that colors + labels the frequency bars.
    - name: binCount
      type: number
      required: false
      default: '10'
      description: Number of equal-width bins to split the range into.
    - name: domain
      type: '[number, number]'
      required: false
      description: >-
        Fix the binning range instead of deriving it from the data's min/max;
        samples outside the domain are dropped.
    - name: xAxisLabel
      type: string
      required: false
      description: Title rendered beneath the horizontal (X) axis.
    - name: yAxisLabel
      type: string
      required: false
      description: Title rendered beside the vertical (Y) axis (rotated).
    - name: yUnit
      type: string
      required: false
      description: >-
        Unit suffix appended to Y-axis tick values (recharts `unit`); the X axis
        is the bin label.
    - name: barRadius
      type: number
      required: false
      default: '0'
      description: Corner radius on the top of each bar (0 = square, the histogram default).
    - name: showGrid
      type: boolean
      required: false
      default: 'true'
      description: Render the CartesianGrid.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: showXAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the X axis (its ticks and title). Set false to hide it.
    - name: showYAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the Y axis (its ticks and title). Set false to hide it.
    - name: xTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each X-axis tick value. Unlike the `unit` suffix (append-only), a
        formatter transforms the value — abbreviate, prefix a symbol, or map to a
        label. Use formatCompactNumber / formatPercent / createTickFormatter from
        the shared Chart primitives, or any function.
    - name: yTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each Y-axis tick value (see xTickFormatter).
    - name: xAxisAngle
      type: number
      required: false
      description: Rotate the X-axis tick labels by this many degrees (a negative angle tilts them up toward the right); the tick anchor + axis height adjust.
    - name: xAxisInterval
      type: "number | 'preserveStart' | 'preserveEnd' | 'preserveStartEnd' | 'equidistantPreserveStart'"
      required: false
      description: >-
        X-axis tick density — a recharts placement strategy, or a fixed number of
        ticks to skip between two rendered ones (recharts interval: 0 shows every
        tick, 1 every other one, 2 every third).
    - name: yAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the value axis (recharts tickCount; a hint, not
        exact). Applies to whichever axis holds the values — Y for most charts, X
        for BarChart with orientation="horizontal".
    - name: yAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Value-axis domain preset — auto (fit the data at both ends; the axis need
        not include 0), zero (anchor the axis at 0, which is also recharts'
        behaviour when the prop is omitted), or dataMin-dataMax (tight to the
        data, no padding). Applies to whichever axis holds the values — Y for most
        charts, X for BarChart with orientation="horizontal".
    - name: gridDashed
      type: boolean
      required: false
      description: Draw grid lines dashed instead of solid.
    - name: gridHorizontal
      type: boolean
      required: false
      description: Show horizontal grid lines (defaults to the chart's own default when unset).
    - name: gridVertical
      type: boolean
      required: false
      description: Show vertical grid lines (defaults to the chart's own default when unset).
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
  events: []
  methods: []

adapters:
  react:
    component: Histogram
    status: implemented
    import: "import { Histogram } from '@acronis-platform/ui-react'"
    example: |
      <Histogram
        config={{ count: { label: 'Frequency', color: 'var(--ui-background-brand-secondary)' } }}
        values={[12, 15, 18, 20, 22, 25, 30, 42]}
        binCount={10}
        className="h-[320px] w-[560px]"
      />
  vue:
    component: AvHistogram
    status: planned
    import: "import { AvHistogram } from '@acronis-platform/ui-vue'"
    example: |
      <AvHistogram :values="values" :bin-count="10" />
  web-components:
    element: ui-histogram
    status: planned
    import: "import '@acronis-platform/ui-wc/histogram'"
    example: |
      <ui-histogram></ui-histogram>
