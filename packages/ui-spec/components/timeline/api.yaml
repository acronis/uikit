spec_version: '1.0'
component: Timeline

# `variant` is the only cva axis on Timeline (its enum matches the cva keys in the
# ui-react source). The remaining rows document Timeline.Item, whose props are
# plain (not cva). Nesting is flat: a row declares its own `level` and whether it
# opens a branch, and the root reads those levels to drop the rows beneath a
# collapsed one — so `collapsible` works with no wiring. The kit never sorts,
# groups, or interprets events.
contract:
  properties:
    # ── Timeline ──
    - name: variant
      type: "'default' | 'tree'"
      required: false
      default: default
      description: >-
        What a collapsible row's disclosure control is, and where it sits. `default`
        puts a chevron at the trailing edge of the card header, which hides that
        row's body; `tree` reserves a dedicated button ahead of the marker, which
        hides the row's descendants and widens the indent step. Given via context.
    # ── Timeline.Item ──
    - name: title
      type: ReactNode
      required: true
      description: (Timeline.Item) The event title — the primary line in the card header.
    - name: timestamp
      type: ReactNode
      required: false
      description: (Timeline.Item) Event time — pass a `<time dateTime>` for an accessible stamp.
    - name: tag
      type: ReactNode
      required: false
      description: (Timeline.Item) Slot beside the title, before the timestamp — e.g. a Tag.
    - name: description
      type: ReactNode
      required: false
      description: (Timeline.Item) Optional secondary description under the title.
    - name: icon
      type: ReactNode
      required: false
      description: >-
        (Timeline.Item) Icon rendered inside the marker Avatar. Takes precedence
        over `initials`.
    - name: initials
      type: string
      required: false
      description: >-
        (Timeline.Item) Initials rendered inside the marker Avatar when no `icon`
        is given.
    - name: color
      type: "'blue' | 'gray' | 'green' | 'teal' | 'violet' | 'red' | 'yellow' | 'orange'"
      required: false
      default: blue
      description: (Timeline.Item) Marker Avatar color scheme.
    - name: level
      type: '1 | 2 | 3'
      required: false
      default: '1'
      description: (Timeline.Item) Nesting depth — drives the indent only.
    - name: branchStart
      type: boolean
      required: false
      default: 'false'
      description: >-
        (Timeline.Item) This row opens a branch: draw the elbow joining it to its
        parent's connector. Ignored at `level` 1, which has no parent.
    - name: connector
      type: boolean
      required: false
      description: >-
        (Timeline.Item) Force the descending connector on or off. Leave it unset —
        the root derives it from the levels, drawing it only when the next visible
        row is at this row's depth or deeper.
    - name: collapsible
      type: boolean
      required: false
      default: 'false'
      description: >-
        (Timeline.Item) Give this row a disclosure control. Under `variant="tree"`
        collapsing hides the descendant rows; otherwise it hides only this row's
        own body.
    - name: expanded
      type: boolean
      required: false
      description: (Timeline.Item) Disclosure state (controlled).
    - name: defaultExpanded
      type: boolean
      required: false
      default: 'true'
      description: (Timeline.Item) Initial disclosure state when uncontrolled.
    - name: toggleLabel
      type: string
      required: false
      default: Toggle event details
      description: (Timeline.Item) Accessible name for the disclosure control.

  events:
    - name: onExpandedChange
      payload: '(expanded: boolean) => void'
      description: >-
        (Timeline.Item) Fired with the requested disclosure state whenever the
        control is activated. Uncontrolled, the root also collapses the row; pass
        `expanded` to own the state instead.

  content:
    - name: default
      description: >-
        `Timeline` takes `Timeline.Item`s as direct children, in visual order —
        never wrapped in a fragment, or their levels cannot be read. Each
        `Timeline.Item` takes optional card-body content as its children, revealed
        below a divider and hidden while the row is collapsed.

  methods: []

adapters:
  react:
    component: Timeline
    status: implemented
    import: "import { Timeline } from '@acronis-platform/ui-react'"
    example: |
      <Timeline>
        <Timeline.Item
          icon={<CircleInfoIcon />}
          title="Retention policy applied"
          tag={<Tag variant="warning">Warning</Tag>}
          timestamp={<time dateTime="2026-12-22T08:30:00+01:00">Dec 22, 08:30 AM</time>}
          description="Weekly archives pruned"
        />
        <Timeline.Item
          level={2}
          branchStart
          icon={<CircleCheckIcon />}
          color="green"
          title="Archive pruned"
          timestamp="Dec 22, 08:31 AM"
        />
      </Timeline>
  vue:
    component: AvTimeline
    status: planned
    import: "import { AvTimeline } from '@acronis-platform/ui-vue'"
    example: |
      <AvTimeline><AvTimelineItem title="Event" :level="1" /></AvTimeline>
  web-components:
    element: ui-timeline
    status: planned
    import: "import '@acronis-platform/ui-wc/timeline'"
    example: |
      <ui-timeline></ui-timeline>
