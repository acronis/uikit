spec_version: '1.0'
component: Timeline

# `variant` is the only cva axis on Timeline (its enum matches the cva keys in the
# ui-react source). The remaining rows document Timeline.Item, whose props are
# plain (not cva). Nesting is flat: a row declares its own `level`, and the root
# reads that sequence to place the connectors *and* the elbows and to decide which
# rows get a disclosure control. `connector` / `branchStart` only override it.
# Branch collapsing is the variant, not a per-row flag — there is deliberately no
# `collapsible` property. A card's own
# body disclosure (`collapsibleBody`) is a separate, orthogonal axis that behaves the
# same under both variants. The kit never sorts, groups, or interprets events.
contract:
  properties:
    # ── Timeline ──
    - name: variant
      type: "'default' | 'tree'"
      required: false
      default: default
      description: >-
        Whether the list collapses. `default` never does. `tree` gives every row
        that has descendants a disclosure button ahead of its marker, which hides
        those descendants, and widens the indent step to reserve the button on
        every row. Given via context.
    # ── Timeline.Item ──
    - name: title
      type: ReactNode
      required: true
      description: (Timeline.Item) The event title — the primary line in the card header.
    - name: timestamp
      type: ReactNode
      required: false
      description: (Timeline.Item) Event time — pass a `<time dateTime>` for an accessible stamp.
    - name: tag
      type: ReactNode
      required: false
      description: (Timeline.Item) Slot beside the title, before the timestamp — e.g. a Tag.
    - name: description
      type: ReactNode
      required: false
      description: (Timeline.Item) Optional secondary description under the title.
    - name: icon
      type: ReactNode
      required: false
      description: >-
        (Timeline.Item) Icon rendered inside the marker Avatar. Takes precedence
        over `initials`.
    - name: initials
      type: string
      required: false
      description: >-
        (Timeline.Item) Initials rendered inside the marker Avatar when no `icon`
        is given.
    - name: color
      type: "'blue' | 'gray' | 'green' | 'teal' | 'violet' | 'red' | 'yellow' | 'orange'"
      required: false
      default: blue
      description: (Timeline.Item) Marker Avatar color scheme.
    - name: level
      type: '1 | 2 | 3'
      required: false
      default: '1'
      description: >-
        (Timeline.Item) Nesting depth — drives the indent, and (as a sequence
        across rows) the connector and elbow the root derives.
    - name: branchStart
      type: boolean
      required: false
      description: >-
        (Timeline.Item) Force the elbow joining this row to its parent's connector
        on or off. Leave it unset — the root derives it from the levels, drawing it
        whenever this row is deeper than the one above it. Ignored at `level` 1,
        which has no parent.
    - name: connector
      type: boolean
      required: false
      description: >-
        (Timeline.Item) Force the descending connector on or off. Leave it unset —
        the root derives it from the levels, drawing it only when the next visible
        row is at this row's depth or deeper.
    - name: expanded
      type: boolean
      required: false
      description: >-
        (Timeline.Item) Branch disclosure state (controlled). Only meaningful under
        `variant="tree"` on a row that has descendants.
    - name: defaultExpanded
      type: boolean
      required: false
      default: 'true'
      description: (Timeline.Item) Initial branch disclosure state when uncontrolled.
    - name: toggleLabel
      type: string
      required: false
      default: Toggle nested events
      description: >-
        (Timeline.Item) Accessible name for the branch disclosure control — the one
        that drops this row's descendant rows. Distinct from `bodyToggleLabel` by
        default, because a tree row can carry both controls at once.
    - name: collapsibleBody
      type: boolean
      required: false
      default: 'false'
      description: >-
        (Timeline.Item) Give this row's card a chevron at the trailing edge of its
        header that folds the card's own body. Orthogonal to `variant` — it is the
        card's control, not the timeline's, so it works the same in `default` and
        `tree`, and a tree row can carry both.
    - name: bodyExpanded
      type: boolean
      required: false
      description: (Timeline.Item) Card-body disclosure state (controlled).
    - name: defaultBodyExpanded
      type: boolean
      required: false
      default: 'true'
      description: (Timeline.Item) Initial card-body disclosure state when uncontrolled.
    - name: bodyToggleLabel
      type: string
      required: false
      default: Toggle event details
      description: >-
        (Timeline.Item) Accessible name for the card-body disclosure control — the
        one that folds this row's own body. Distinct from `toggleLabel` by default.

  events:
    - name: onExpandedChange
      payload: '(expanded: boolean) => void'
      description: >-
        (Timeline.Item) Fired with the requested branch disclosure state whenever
        the control is activated. Uncontrolled, the root also collapses the branch;
        pass `expanded` to own the state instead.
    - name: onBodyExpandedChange
      payload: '(expanded: boolean) => void'
      description: >-
        (Timeline.Item) Fired with the requested card-body disclosure state whenever
        the card's own chevron is activated.

  content:
    - name: default
      description: >-
        `Timeline` takes `Timeline.Item`s as direct children, in visual order —
        never wrapped in a fragment, or their levels cannot be read. Each
        `Timeline.Item` takes optional card-body content as its children, rendered
        below a divider. Collapsing a *branch* never hides it; only that row's own
        `collapsibleBody` chevron does.

  methods: []

adapters:
  react:
    component: Timeline
    status: implemented
    import: "import { Timeline } from '@acronis-platform/ui-react'"
    example: |
      <Timeline>
        <Timeline.Item
          icon={<CircleInfoIcon />}
          title="Retention policy applied"
          tag={<Tag variant="warning">Warning</Tag>}
          timestamp={<time dateTime="2026-12-22T08:30:00+01:00">Dec 22, 08:30 AM</time>}
          description="Weekly archives pruned"
        />
        <Timeline.Item
          level={2}
          icon={<CircleCheckIcon />}
          color="green"
          title="Archive pruned"
          timestamp="Dec 22, 08:31 AM"
        />
      </Timeline>
  vue:
    component: AvTimeline
    status: planned
    import: "import { AvTimeline } from '@acronis-platform/ui-vue'"
    example: |
      <AvTimeline><AvTimelineItem title="Event" :level="1" /></AvTimeline>
  web-components:
    element: ui-timeline
    status: planned
    import: "import '@acronis-platform/ui-wc/timeline'"
    example: |
      <ui-timeline></ui-timeline>
