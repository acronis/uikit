spec_version: '1.0'
component: Timeline

schematic: |
  <ol> (root)                              variant: default | tree
   ├─ <li> item ─────────────────────────────────────────────────
   │  (toggle)  (marker) ┌───────────── card ─────────────────┐
   │  tree rows  │       │ title [tag] Dec 22, 08:30 AM (body- │
   │  with       │       │ description                 toggle) │
   │  descendants│       ├────────────── divider ──────────────┤
   │   connector │       │ (… body …)                          │ ← body
   │  elbow ─────┘       └─────────────────────────────────────┘
   └─ <li> item (last visible: connector hidden)

  parts: item · toggle · body-toggle · marker · connector · elbow · card
       · title · tag · timestamp · description · body
  level -> indent · branchStart -> elbow · connector -> trailing line
  variant=tree -> rows with descendants get a toggle, indent step widens
  collapsed -> the descendant rows are dropped (never the row's own body)
  collapsibleBody -> a chevron in this card's header folds this card's body only

root:
  element: ol
  description: >-
    A semantic ordered list of rows in visual order. `variant` decides whether the
    list collapses at all: `default` never does, `tree` gives every row that has
    descendants a disclosure button ahead of its marker and widens the indent step
    to reserve it. The root reads its children's `level`s to decide which rows get
    that control, to drop the rows beneath a collapsed one, and to derive each
    row's connector.

parts:
  - id: item
    description: >-
      One event — a `<li>` (Timeline.Item) holding the marker column, the card,
      and its connector geometry. Indented by `level`.
    element: li
  - id: toggle
    description: >-
      The branch disclosure control (a `ButtonIcon` with a chevron), ahead of the
      marker. Collapsing drops the row's descendant rows; it never hides the row's
      own body. Derived, not a prop — there is no `collapsible` property.
    element: button
    optional: true
    visible_when: '`variant` is `tree` and the row has descendants'
  - id: body-toggle
    description: >-
      The card's own disclosure control (a `ButtonIcon` with a chevron) at the
      trailing edge of the card header. Folds this card's body and nothing else —
      orthogonal to `variant`, so a `tree` row can carry this and the branch toggle
      at once.
    element: button
    optional: true
    visible_when: '`collapsibleBody` is true'
  - id: marker
    description: >-
      The Avatar at the start of the row, tinted by `color` and holding the `icon`
      or `initials`. Decorative (`aria-hidden`); Avatar's outset ring is switched
      off, matching the design's strokeless marker.
  - id: connector
    description: >-
      The vertical line descending from the marker into the row gap, meeting the
      next row's marker or elbow. Decorative; drawn only when the next visible row
      is at this row's depth or deeper *and* shares this row's marker width, so it
      never dangles and never runs crooked.
  - id: elbow
    description: >-
      The right angle joining a nested row to its parent's connector. Decorative;
      drawn only when the row starts a branch.
    optional: true
    visible_when: '`branchStart` is true and `level` is greater than 1'
  - id: card
    description: The bordered container holding the row's content (a `Card`).
  - id: title
    description: The event title (primary line in the card header).
  - id: tag
    description: Slot beside the title, before the timestamp — e.g. a `Tag`.
    optional: true
    visible_when: a `tag` is provided
  - id: timestamp
    description: Event time (`timestamp`) — pass a `<time dateTime>` for a machine-readable stamp.
    optional: true
    visible_when: a `timestamp` is provided
  - id: description
    description: Optional secondary description line under the title.
    optional: true
    visible_when: a `description` is provided
  - id: body
    description: >-
      The item's `children`, rendered in the card below a divider. Collapsing a
      branch never hides it; only this card's own `collapsibleBody` chevron does.
    optional: true
    visible_when: '`children` are provided and the card body is not folded'

layout:
  type: flex
  direction: column
  align: stretch
  order: [item]

states:
  - {
      id: default,
      trigger: "variant === 'default'",
      kind: prop,
      prop: variant,
      affects: [root, item],
    }
  - {
      id: tree,
      trigger: "variant === 'tree'",
      kind: prop,
      prop: variant,
      affects: [root, item, toggle],
    }
  - {
      id: level-1,
      trigger: 'level === 1',
      kind: prop,
      prop: level,
      affects: [item],
    }
  - {
      id: level-2,
      trigger: 'level === 2',
      kind: prop,
      prop: level,
      affects: [item],
    }
  - {
      id: level-3,
      trigger: 'level === 3',
      kind: prop,
      prop: level,
      affects: [item],
    }
  - {
      id: branch-start,
      trigger: 'branchStart is true and level is greater than 1',
      kind: prop,
      prop: branchStart,
      affects: [elbow],
    }
  - {
      id: connected,
      trigger: 'the next visible row is at this level or deeper, with the same marker width',
      kind: prop,
      prop: connector,
      affects: [connector],
    }
  - {
      id: expanded,
      trigger: 'expanded is true',
      kind: prop,
      prop: expanded,
      affects: [toggle, item],
    }
  - {
      id: body-expanded,
      trigger: 'collapsibleBody is true and the card body is shown',
      kind: prop,
      prop: bodyExpanded,
      affects: [body-toggle, body],
    }
  - {
      id: toggle-hover,
      trigger: 'pointer over a disclosure button',
      kind: pseudo,
      pseudo: ':hover',
      affects: [toggle, body-toggle],
    }
  - {
      id: toggle-focus-visible,
      trigger: 'keyboard focus on a disclosure button',
      kind: pseudo,
      pseudo: ':focus-visible',
      affects: [toggle, body-toggle],
    }
