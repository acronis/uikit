spec_version: '1.0'
component: Timeline
name: timeline
status: stable
category: data-display
description: >-
  A presentational, chronological tree of events — an activity feed, audit log,
  or status history. `Timeline` + `Timeline.Item` render a semantic ordered list
  in which each row pairs an Avatar marker with a Card carrying the title, an
  optional tag, the timestamp, and a description; rows join their parent through
  an elbow and their next sibling through a vertical connector. Nesting is flat
  and explicit — a row declares its own `level` (1-3) — so the component owns
  structure and connector geometry only: it never sorts, groups, fetches, or
  interprets events, ships no domain event types or icons, and does not manage
  tree state. Not a temporal chart.
dependencies:
  components:
    - avatar
    - card
    - button-icon
