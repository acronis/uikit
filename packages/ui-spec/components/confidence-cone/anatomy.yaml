spec_version: '1.0'
component: ConfidenceCone

schematic: |
  root: <div>                                       (plain wrapper, no variants)
    container: <ChartContainer>                     (themed, sized, responsive)
      plot: recharts <ComposedChart>                (one color per metric)
        grid:      <CartesianGrid>                  (horizontal lines)
        x-axis:    <XAxis dataKey=xKey>             (time / category; forecast ticks styled)
        y-axis:    <YAxis>                          (value)
        region:    <ReferenceArea>                  (shaded forecast region, behind all)
        divider:   <ReferenceLine>                  (dashed vertical at the hand-off)
        threshold: <ReferenceLine y=value>          (dashed horizontal, 0..n)
        per series, in this order — all cones, then all actuals, then all forecasts:
          cone:     <Area dataKey=__cone:actualKey> (band [lower, upper], tinted, behind lines)
          actual:   <Area|Line dataKey=actualKey>   (solid; filled area unless actualType="line")
          forecast: <Line dataKey=forecastKey>      (dashed)
        tooltip:   <ChartTooltip> → tooltip-content (bands filtered out)
        legend:    <ChartLegend>  → legend-content  (one entry per metric)

root:
  element: div
  description: >-
    Plain wrapper (no CVA variants). Renders the shared `ChartContainer` around a
    recharts `ComposedChart` composing each series' cone band + two lines.

parts:
  - id: container
    element: div
    description: >-
      The shared `ChartContainer` — supplies the `--color-<key>` custom
      properties from `config` and themes recharts' internals.
  - id: region
    element: g
    description: >-
      A `ReferenceArea` shading the forecast period (from the hand-off to the
      last point), drawn behind everything. Rendered when `showForecastRegion`.
  - id: divider
    element: g
    description: >-
      A dashed vertical `ReferenceLine` at the hand-off point (the first row with
      a forecast value), separating actuals from the forecast. Rendered when
      `showForecastRegion`.
  - id: cone
    element: g
    description: >-
      One `Area` per coned series over a synthetic `[lower, upper]` range field,
      tinted with that series' metric color at low opacity and drawn behind every
      line. Breaks where a bound is missing (e.g. the actual-only period). A
      series that omits `lowerKey`/`upperKey` has no cone at all. Never marks
      points.
  - id: actual
    element: g
    description: >-
      One mark per series over its `actualKey` — the known/observed values, a
      solid line in that series' metric color. An `Area` with a low-opacity fill
      beneath it by default, or a bare `Line` with `actualType="line"`. Marks each
      point with a filled dot when `showDots`.
  - id: forecast
    element: g
    description: >-
      One dashed `Line` per series over its `forecastKey` — the projection, in the
      same metric color as its actual (actual vs forecast differ by line style,
      not hue). Marks each point with a hollow dot when `showDots`.
  - id: threshold
    element: g
    description: >-
      A dashed horizontal `ReferenceLine` on the value axis per `referenceLine`
      entry, with an optional caption at its right end. Extends the domain so a
      threshold beyond the data max stays visible.
  - id: grid
    element: g
    description: '`CartesianGrid` — horizontal value lines.'
  - id: x-axis
    element: g
    description: >-
      `XAxis` — the time/category dimension (`xKey`). With `styleForecastTicks`,
      the ticks over the projected period render italic in the first series' hue.
  - id: y-axis
    element: g
    description: '`YAxis` — the value axis.'
  - id: tooltip-content
    element: div
    description: >-
      `ChartTooltipContent` — hover card with the actual / forecast values; the
      synthetic band series is filtered out. Rendered when `showTooltip`.
  - id: legend-content
    element: div
    description: >-
      `ChartLegendContent` — one swatch + label per metric. A series' actual,
      forecast and band are three recharts series painting a single metric in a
      single hue (each forecast key's `--color-*` is re-pointed at its actual
      series' color), so only the actual series reach the legend. Rendered when
      `showLegend`.

states:
  - id: forecast-region
    trigger: rows with forecast + bound fields (vs actual-only rows)
    kind: prop
    prop: data
    affects: [cone, actual, forecast]
  - id: region-marker
    trigger: showForecastRegion toggles the shaded region + hand-off divider
    kind: prop
    prop: showForecastRegion
    affects: [region, divider]
  - id: band-less
    trigger: a series omits lowerKey / upperKey — a point projection with no interval
    kind: prop
    prop: lowerKey
    affects: [cone]
  - id: actual-as-line
    trigger: actualType="line" drops the filled region under the observed values
    kind: prop
    prop: actualType
    affects: [actual]
  - id: dotted
    trigger: showDots marks each point — filled on the actuals, hollow on the projection
    kind: prop
    prop: showDots
    affects: [actual, forecast]
  - id: styled-forecast-ticks
    trigger: styleForecastTicks italicizes + accents the projected period's X ticks
    kind: prop
    prop: styleForecastTicks
    affects: [x-axis]
  - id: empty
    trigger: data is an empty array
    kind: prop
    prop: data
    affects: [cone, actual, forecast]
