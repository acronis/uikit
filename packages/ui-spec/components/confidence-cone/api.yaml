spec_version: '1.0'
component: ConfidenceCone

# No cva: ConfidenceCone has no visual variant axes. The field-name props map
# columns onto each series' actual line / forecast line / cone bounds.
contract:
  properties:
    - name: data
      type: ReadonlyArray<Record<string, string | number | null | undefined>>
      required: true
      description: >-
        Row-per-point data. Rows are naturally sparse — a point carries either an
        actual value or a forecast + its bounds — so missing fields are allowed.
        Field names starting with `__cone` are reserved for the internal
        prediction-band series and must not be used for a caller's own column.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Series take their colour from the container's `palette`; each entry maps
        a data key to a `label` and an optional `tone`. Resolved into the
        `--color-<key>` custom properties the lines and areas paint from. Each
        metric renders in one hue: its cone band and forecast line both reuse its
        actual series' color — actual and forecast differ by line style, not hue.
    - name: xKey
      type: string
      required: true
      description: The time / category dimension key shared across rows.
    - name: series
      type: 'ReadonlyArray<{ actualKey: string; forecastKey: string; lowerKey?: string; upperKey?: string }>'
      required: false
      description: >-
        Plot several metrics against one shared axis — each with its own actual /
        forecast / bound fields and its own hue (from config[actualKey]). Takes
        precedence over the single-series actualKey / forecastKey / lowerKey /
        upperKey shorthand; pass one form or the other, not both.
    - name: actualKey
      type: string
      required: false
      description: >-
        Single-series shorthand — field for the known/actual values, drawn as a
        solid line with a filled area. Ignored when series is set.
    - name: forecastKey
      type: string
      required: false
      description: >-
        Single-series shorthand — field for the projected values, drawn as a
        dashed line. Ignored when series is set.
    - name: lowerKey
      type: string
      required: false
      description: >-
        Field for the cone's lower bound. Omit (with upperKey) for a band-less
        projection: a bare dashed forecast line, no cone.
    - name: upperKey
      type: string
      required: false
      description: >-
        Field for the cone's upper bound. Omit (with lowerKey) for a band-less
        projection: a bare dashed forecast line, no cone.
    - name: showDots
      type: boolean
      required: false
      default: 'false'
      description: >-
        Mark each data point — a filled dot on the observed values, a hollow one
        on the projection — so a point reads as measured or predicted at a glance.
    - name: styleForecastTicks
      type: boolean
      required: false
      default: 'false'
      description: >-
        Italicize the X-axis ticks over the forecast period and paint them in the
        first series' hue, so the projected columns read as projected even when
        the shaded region is off.
    - name: referenceLine
      type: '{ value: number; label?: string } | Array<{ value: number; label?: string }>'
      required: false
      description: >-
        One or more dashed horizontal thresholds on the value axis — e.g. a target
        or a capacity limit. Pass a single object or an array to draw several. A
        threshold beyond the data max extends the domain so it stays visible.
    - name: xAxisLabel
      type: string
      required: false
      description: Title rendered beneath the horizontal (X) axis.
    - name: yAxisLabel
      type: string
      required: false
      description: Title rendered beside the vertical (Y) axis (rotated).
    - name: yUnit
      type: string
      required: false
      description: >-
        Unit suffix appended to Y-axis tick values (recharts `unit`); the X axis
        is categorical.
    - name: actualType
      type: "'area' | 'line'"
      required: false
      default: "'area'"
      description: >-
        How the known/actual period is drawn — a filled area under the line, or a
        bare line, for a chart where the cone should be the only shaded region or
        where several metrics' fills would muddy each other.
    - name: strokeWidth
      type: number
      required: false
      default: '2'
      description: Stroke width of the actual + forecast lines.
    - name: showForecastRegion
      type: boolean
      required: false
      default: 'true'
      description: >-
        Set off the forecast period with a dashed divider at the hand-off point
        (the first row with a forecast value) and a subtle shaded band over the
        forecast region.
    - name: showGrid
      type: boolean
      required: false
      default: 'true'
      description: Render the CartesianGrid.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip (the band series is filtered out of it).
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: Render the legend (the band series is filtered out of it).
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: showXAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the X axis (its ticks and title). Set false to hide it.
    - name: showYAxis
      type: boolean
      required: false
      default: 'true'
      description: Render the Y axis (its ticks and title). Set false to hide it.
    - name: xTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format each X-axis tick value. Unlike the `unit` suffix (append-only), a
        formatter transforms the value — abbreviate, prefix a symbol, or map to a
        label. Use formatCompactNumber / formatPercent / createTickFormatter from
        the shared Chart primitives, or any function.
    - name: yTickFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format each Y-axis tick value (see xTickFormatter).
    - name: xAxisAngle
      type: number
      required: false
      description: Rotate the X-axis tick labels by this many degrees (a negative angle tilts them up toward the right); the tick anchor + axis height adjust.
    - name: xAxisInterval
      type: "number | 'preserveStart' | 'preserveEnd' | 'preserveStartEnd' | 'equidistantPreserveStart'"
      required: false
      description: >-
        X-axis tick density — a recharts placement strategy, or a fixed number of
        ticks to skip between two rendered ones (recharts interval: 0 shows every
        tick, 1 every other one, 2 every third).
    - name: yAxisTickCount
      type: number
      required: false
      description: >-
        Desired number of ticks on the value axis (recharts tickCount; a hint, not
        exact). Applies to whichever axis holds the values — Y for most charts, X
        for BarChart with orientation="horizontal".
    - name: yAxisDomain
      type: "'auto' | 'dataMin-dataMax' | 'zero'"
      required: false
      description: >-
        Value-axis domain preset — auto (fit the data at both ends; the axis need
        not include 0), zero (anchor the axis at 0, which is also recharts'
        behaviour when the prop is omitted), or dataMin-dataMax (tight to the
        data, no padding). Applies to whichever axis holds the values — Y for most
        charts, X for BarChart with orientation="horizontal".
    - name: gridDashed
      type: boolean
      required: false
      description: Draw grid lines dashed instead of solid.
    - name: gridHorizontal
      type: boolean
      required: false
      description: Show horizontal grid lines (defaults to the chart's own default when unset).
    - name: gridVertical
      type: boolean
      required: false
      description: Show vertical grid lines (defaults to the chart's own default when unset).
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
  events: []
  methods: []

adapters:
  react:
    component: ConfidenceCone
    status: implemented
    import: "import { ConfidenceCone } from '@acronis-platform/ui-react'"
    example: |
      <ConfidenceCone
        config={{
          actual: { label: 'Actual', color: 'var(--ui-background-brand-secondary)' },
          forecast: { label: 'Forecast', color: 'var(--ui-background-brand-secondary)' },
        }}
        data={data}
        xKey="month"
        actualKey="actual"
        forecastKey="forecast"
        lowerKey="lower"
        upperKey="upper"
        className="h-[320px] w-[560px]"
      />
  vue:
    component: AvConfidenceCone
    status: planned
    import: "import { AvConfidenceCone } from '@acronis-platform/ui-vue'"
    example: |
      <AvConfidenceCone :data="data" x-key="month" />
  web-components:
    element: ui-confidence-cone
    status: planned
    import: "import '@acronis-platform/ui-wc/confidence-cone'"
    example: |
      <ui-confidence-cone></ui-confidence-cone>
