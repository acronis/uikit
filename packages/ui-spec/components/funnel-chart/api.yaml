spec_version: '1.0'
component: FunnelChart

# Framework-agnostic contract. `lastShape` is the CVA variant axis
# (conformance-checked against the ui-react cva keys). `data` / `config` /
# `dataKey` / `nameKey` are the data contract; `palette` is the only source of a
# stage's colour; the rest toggle direction, geometry and chrome. A funnel plots
# a single series of stages (rows). There is no legend-placement prop and no
# gradient colour mode: the legend is always the column beside the plot.
contract:
  properties:
    - name: lastShape
      type: "'triangle' | 'rectangle'"
      required: false
      default: "'triangle'"
      description: >-
        How the funnel ends. `triangle` narrows the final stage to a point;
        `rectangle` keeps a flat lower edge (a stack of trapezoids).
    - name: data
      type: ReadonlyArray<Record<string, string | number>>
      required: true
      description: Row-per-stage data — each row holds a `nameKey` label and a `dataKey` numeric value.
    - name: config
      type: ChartConfig
      required: true
      description: >-
        Stages take their colour from `palette`; each entry, keyed by the stage's
        `nameKey` value, maps that stage to a `label` and an optional `tone`. The
        labels are what the legend and the tooltip read. Resolved into the
        `--color-<name>` custom properties the segments fill from.
    - name: dataKey
      type: string
      required: true
      description: >-
        The numeric field that sizes each stage — and the value each legend row
        shows on its inline end.
    - name: nameKey
      type: string
      required: true
      description: >-
        The label field that names each stage (drives the legend, the tooltip,
        the on-plot labels, and the `--color-<name>` lookup). Values should be
        unique per chart — stages sharing a name share one config/color entry
        and one legend row.
    - name: palette
      type: ChartPalette
      required: false
      default: "{ type: 'sequential', ramp: 'blue' }"
      description: >-
        The dataviz palette the stages are painted from — the only source of a
        stage's colour, bar a per-stage `stageSettings.color`. Unlike every other
        chart, which takes the shared categorical default, a funnel defaults to
        the sequential blue ramp: its stages are an ordered series, which is what
        a ramp is for. Exported as FUNNEL_CHART_DEFAULT_PALETTE.
    - name: reversed
      type: boolean
      required: false
      default: 'false'
      description: >-
        Flip the stack so the funnel widens toward the bottom instead of
        narrowing. The gap-free stage — the one flush with the top of the plot
        area — becomes the last row rather than the first.
    - name: showLabels
      type: boolean
      required: false
      default: 'false'
      description: >-
        Render a label for each stage — see labelFormat and labelPosition. Off by
        default: the design's funnel carries no on-plot labels, because the legend
        beside it already names every stage.
    - name: labelFormat
      type: "'name' | 'value' | 'percent' | 'name-value' | 'name-percent' | 'value-percent'"
      required: false
      default: "'name'"
      description: >-
        What each stage's label says. A percentage is the stage's share of the
        widest stage — its conversion from the top of the funnel, not a share of
        the sum, because a funnel's stages are nested subsets rather than parts of
        a whole. The value is formatted by labelFormatter and the share by
        percentFormatter. A composite format (a pair) narrows the funnel to leave
        itself room, unless funnelWidth says otherwise.
    - name: labelPosition
      type: "'right' | 'left' | 'inside'"
      required: false
      default: "'right'"
      description: >-
        Where each stage's label sits. `right`/`left` place it beside the segment
        on the chart surface; `inside` centres it on the segment, which switches
        the label to the on-fill color so it keeps contrast over a saturated fill.
        `inside` only works while every stage is wide enough to hold the text — a
        funnel narrows, so its last stages often are not; keep the text short
        there (`percent`) or leave the labels beside the funnel.
    - name: showValueLabels
      type: boolean
      required: false
      default: 'false'
      description: >-
        Render a second label carrying the stage's value, so the name and the
        number can sit on opposite sides of the funnel.
    - name: valuePosition
      type: "'right' | 'left' | 'inside'"
      required: false
      default: the side opposite labelPosition
      description: >-
        Where the value label sits. Defaults to the side opposite labelPosition,
        where every stage has room — so it follows the names rather than pinning
        itself to one edge, which would overprint them when the names move. See
        labelPosition before choosing inside.
    - name: labelFill
      type: string
      required: false
      description: >-
        Color for both label lists, overriding the contrast-matched default. Pass
        a --ui-* token; only needed when the default doesn't work on the surface.
    - name: labelFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: Format the numeric part of a label.
    - name: percentFormatter
      type: '(value: number | string, index?: number) => string'
      required: false
      description: >-
        Format the conversion share behind the percent formats. Receives the share
        as a fraction (0.52); defaults to a one-decimal bare percentage ("52.0%").
        Replace it for a locale that doesn't write a bare percent sign.
    - name: showLegend
      type: boolean
      required: false
      default: 'true'
      description: >-
        Render the stage list beside the plot — one two-column row per visible
        stage, a sibling of the plot rather than a renderer legend. On by default,
        because it is where the design's funnel names its stages. With it off the
        row centres its lone plot.
    - name: legendValueFormatter
      type: '(value: string | number) => string'
      required: false
      description: >-
        Format the value in each legend row — the stage's dataKey number. Omit to
        stringify the raw value.
    - name: stageSettings
      type: 'Record<string, { color?: string; hidden?: boolean }>'
      required: false
      description: >-
        Per-stage overrides keyed by the stage's nameKey value. `color` replaces
        that stage's palette stop, in the funnel and in its legend marker;
        `hidden` drops the stage from the funnel, its labels, the legend, and the
        conversion percentages.
    - name: showActiveShape
      type: boolean
      required: false
      default: 'false'
      description: >-
        Outline the hovered segment, rather than changing its fill, so it keeps
        the color that ties it to its legend entry and label.
    - name: stroke
      type: string
      required: false
      description: >-
        Segment border color — reference an existing --ui-* token. Defaults to the
        border token when strokeWidth is set on its own, because the renderer's own
        default there is a hardcoded white the container neutralizes.
    - name: strokeWidth
      type: number
      required: false
      description: Segment border width, in px. Implies a default stroke when given alone.
    - name: funnelWidth
      type: number | string
      required: false
      description: >-
        Funnel width — px, or a percentage of the plot area ('70%'). Defaults to
        the full plot area, except that a composite labelFormat beside the funnel
        narrows it: the renderer word-wraps a label against the gap between its
        segment and the plot-area edge, so narrowing the funnel is what creates
        label room. A margin cannot — it moves that edge inward with the funnel.
    - name: margin
      type: '{ top?: number; right?: number; bottom?: number; left?: number }'
      required: false
      default: '{ top: 4, right: 8, bottom: 4, left: 8 }'
      description: >-
        Plot-area inset, in px, merged over the defaults per side so passing one
        side keeps the others. The default is the design's own tight inset — the
        room the rounded corners and the apex need — and applies whenever nothing
        sits beside the funnel. As soon as a label list does, the side it sits on
        widens so unwrappable text isn't clipped at the SVG edge; see funnelWidth
        for the label's wrap room.
    - name: showTooltip
      type: boolean
      required: false
      default: 'true'
      description: Render the hover tooltip.
    - name: tooltipContent
      type: 'ReactElement | ((props) => ReactNode)'
      required: false
      description: >-
        Replace the default tooltip. Pass a configured ChartTooltipContent (from
        this library) — e.g. with a formatter / labelFormatter — to customize the
        tooltip content without composing recharts. Ignored when showTooltip is
        false.
    - name: animate
      type: boolean
      required: false
      default: 'false'
      description: >-
        Enable entrance animation. Off by default so output/baselines are
        unchanged.
    - name: animationDuration
      type: number
      required: false
      description: Animation duration in ms.
    - name: animationBegin
      type: number
      required: false
      description: Delay before the animation starts, in ms.
    - name: animationEasing
      type: "'ease' | 'ease-in' | 'ease-out' | 'ease-in-out' | 'linear'"
      required: false
      description: Easing curve.
  events: []
  methods: []

adapters:
  react:
    component: FunnelChart
    status: implemented
    import: "import { FunnelChart } from '@acronis-platform/ui-react'"
    example: |
      <FunnelChart
        config={config}
        data={data}
        dataKey="value"
        nameKey="stage"
        lastShape="triangle"
      />
  vue:
    component: AvFunnelChart
    status: planned
    import: "import { AvFunnelChart } from '@acronis-platform/ui-vue'"
    example: |
      <AvFunnelChart :config="config" :data="data" data-key="value" name-key="stage" />
  web-components:
    element: ui-funnel-chart
    status: planned
    import: "import '@acronis-platform/ui-wc/funnel-chart'"
    example: |
      <ui-funnel-chart></ui-funnel-chart>
