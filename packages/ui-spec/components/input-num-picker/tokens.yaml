spec_version: '1.0'
component: InputNumPicker

# References only — values live in @acronis-platform/tokens-pd. The field
# container/label/box/value tokens come from the component's own
# `--ui-input-num-picker-*` tier; the decrement/increment buttons reuse the
# already-themed `ButtonIconInput` (`--ui-button-icon-input-*`) instead of
# duplicating their own idle/hover/active/disabled set.
source: '@acronis-platform/tokens-pd'

tokens:
