# .github/workflows/visual-regression.yml
name: Visual Regression

on: [pull_request]

# One live run per pull request. Without this every push leaves the previous
# push's eight legs running to completion against a commit nobody will merge —
# and because a leg is mostly Docker + Playwright, that is the most expensive
# thing in this repo to leave orphaned. It also gives a hung run a way out: the
# next push cancels it instead of waiting for the timeout below.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    # A leg is ~2.5 min (icons-react) to ~11.5 min (ui-legacy, full corpus),
    # install and Storybook build included. 30 gives real headroom while still
    # killing a hang in minutes rather than at GitHub's 6-hour default — one
    # `ui-react, light` leg sat in its Docker step for 28 minutes with the same
    # commit's `dark` leg green in 5m50s, and would otherwise have held the PR's
    # status for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui-legacy
            filter: '@acronis-platform/shadcn-uikit'
            dir: packages/ui-legacy
          - name: ui-react
            filter: '@acronis-platform/ui-react'
            dir: packages/ui-react
            color_mode: light
          - name: ui-react
            filter: '@acronis-platform/ui-react'
            dir: packages/ui-react
            color_mode: dark
          # ── The four profiles that own no baselines ──────────────────────────
          # `[data-theme]` and the OS `prefers-color-scheme` are two independent
          # inputs; the two legs above pin the attribute and leave the OS at light,
          # covering two of the six states the pair can be in. These four are the
          # rest of the cross product, and each re-renders an EXISTING baseline
          # under a different theme input rather than recording its own:
          #
          #   system-dark   no attribute, OS dark   -> must equal `--dark` PNGs
          #   system-light  no attribute, OS light  -> must equal light PNGs
          #   forced-light  attr light,  OS dark    -> must equal light PNGs
          #   forced-dark   attr dark,   OS dark    -> must equal `--dark` PNGs
          #
          # Any diff is styling that keyed off the attribute instead of resolving
          # through a token (chart.tsx's `THEMES` block is the known instance), or
          # a `prefers-color-scheme` fallback firing where it should not. See
          # packages/ui-react/.storybook/visual-regression.ts.
          #
          # `subset: true` routes a leg to the capture script instead of `docker
          # compose`, and it is a matrix field rather than a `color_mode !=` list
          # in the step conditions so that adding a profile cannot silently run it
          # as a baseline-owning leg. Each runs a curated ~15% sample, so a leg
          # costs a fraction of a full one.
          - name: ui-react
            filter: '@acronis-platform/ui-react'
            dir: packages/ui-react
            color_mode: system-dark
            subset: true
          - name: ui-react
            filter: '@acronis-platform/ui-react'
            dir: packages/ui-react
            color_mode: system-light
            subset: true
          - name: ui-react
            filter: '@acronis-platform/ui-react'
            dir: packages/ui-react
            color_mode: forced-light
            subset: true
          - name: ui-react
            filter: '@acronis-platform/ui-react'
            dir: packages/ui-react
            color_mode: forced-dark
            subset: true
          # icons-react renders currentColor icons whose color is story-fixed,
          # not theme-driven — a single (light) pass, like ui-legacy.
          - name: icons-react
            filter: '@acronis-platform/icons-react'
            dir: packages/icons-react
    name: visual-regression (${{ matrix.name }}${{ matrix.color_mode && format(', {0}', matrix.color_mode) || '' }})
    steps:
      - uses: actions/checkout@v6

      # Snapshots only need refreshing when a library's own components / styles /
      # Storybook config change, or when the shared design tokens (which can alter
      # any rendered color) change. The job always runs and reports a status; the
      # build + Docker steps below are skipped when nothing relevant changed, so
      # docs-only / tooling-only PRs don't pay for a full Storybook + Playwright run.
      - name: Detect relevant changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            ui-legacy:
              - 'packages/ui-legacy/src/**'
              - 'packages/ui-legacy/.storybook/**'
              # Not load-bearing at build time (`storybook:build` is plain
              # `storybook build`), but these scripts generate committed render
              # inputs — the white-label themes, the full CSS, the icon stories.
              - 'packages/ui-legacy/scripts/**'
              - 'packages/ui-legacy/test/__snapshots__/**'
              - 'packages/ui-legacy/package.json'
              - 'packages/ui-legacy/Dockerfile.storybook'
              - 'packages/ui-legacy/docker-compose.storybook*.yml'
              - 'packages/tokens-pd/**'
              - 'packages/design-tokens/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/visual-regression.yml'
            ui-react:
              - 'packages/ui-react/src/**'
              - 'packages/ui-react/.storybook/**'
              # The capture runner and the subset definition are what CI executes
              # for the theme legs (`node …/scripts/visual-capture.mjs`), so a PR
              # that edits only SUBSET_GROUPS — dropping a mechanism, or leaving a
              # stale title — would otherwise match no filter path, skip every
              # ui-react leg, and merge green having run no visual test at all.
              - 'packages/ui-react/scripts/**'
              # Baselines themselves: a PR that only commits regenerated PNGs has
              # to be the PR that proves they reproduce.
              - 'packages/ui-react/test/__snapshots__/**'
              - 'packages/ui-react/package.json'
              - 'packages/ui-react/Dockerfile.storybook'
              - 'packages/ui-react/docker-compose.storybook*.yml'
              - 'packages/tokens-pd/**'
              - 'packages/design-tokens/**'
              - 'packages/icons-react/**'
              - 'packages/design-assets/**'
              # A dependency bump renders too: Base UI, recharts, react-day-picker
              # and friends all put pixels on screen, and a lockfile-only PR would
              # otherwise ship a rendering change with the gate skipped. The cost is
              # that every dependency PR now pays the ui-react legs — accepted
              # deliberately, because a missed render regression is dearer than the
              # runner minutes.
              - 'pnpm-lock.yaml'
              - '.github/workflows/visual-regression.yml'
            icons-react:
              # Whole-package glob: unlike the two above this one already covers
              # its own scripts/ and test/__snapshots__ — and its scripts ARE
              # load-bearing, since `storybook:build` runs `pnpm run generate`
              # first.
              - 'packages/icons-react/**'
              - 'packages/design-assets/**'
              - 'tools/style-dictionary/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/visual-regression.yml'

      - name: Setup PNPM
        if: steps.changes.outputs[matrix.name] == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.changes.outputs[matrix.name] == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Get pnpm store directory
        if: steps.changes.outputs[matrix.name] == 'true'
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        if: steps.changes.outputs[matrix.name] == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.changes.outputs[matrix.name] == 'true'
        run: pnpm install --frozen-lockfile

      # Vite module cache + Storybook builder cache — key on source so only
      # changed files are recompiled when the cache is restored.
      - name: Cache Storybook build
        if: steps.changes.outputs[matrix.name] == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.dir }}/node_modules/.vite
            ${{ matrix.dir }}/node_modules/.cache/storybook
          key: storybook-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles(format('{0}/src/**', matrix.dir), format('{0}/.storybook/**', matrix.dir), format('{0}/package.json', matrix.dir)) }}
          restore-keys: storybook-${{ matrix.name }}-${{ runner.os }}-

      # ui-react depends on generated @acronis-platform/icons-react output
      # (generated sources + dist/ are gitignored). Build that package (and its
      # own prerequisites) before Storybook so imports resolve. Avoid broad
      # ui-react recursive builds here: they also pull in tokens-pd/style-dictionary,
      # which is unrelated to visual snapshots and can fail on in-flight
      # design-assets schema migrations.
      - name: Build workspace dependencies
        if: matrix.name == 'ui-react' && steps.changes.outputs[matrix.name] == 'true'
        run: pnpm --filter @acronis-platform/icons-react... run build

      - name: Build Storybook
        if: steps.changes.outputs[matrix.name] == 'true'
        run: pnpm --filter ${{ matrix.filter }} storybook:build

      # Docker only serves the pre-built static output and runs Playwright.
      # --build rebuilds the image when Dockerfile or .storybook config changes.
      - name: Run visual regression tests
        if: steps.changes.outputs[matrix.name] == 'true' && !matrix.subset
        env:
          STORYBOOK_COLOR_MODE: ${{ matrix.color_mode || 'light' }}
        run: docker compose -f ${{ matrix.dir }}/docker-compose.storybook.yml up --build --abort-on-container-exit --exit-code-from test-runner

      # `--skip-build` because the cached "Build Storybook" step above already
      # produced storybook-static. These legs go THROUGH the capture script rather
      # than calling `docker compose` directly, because the script supplies the
      # subset test-path pattern, refuses to run if a subset title no longer
      # exists, and fails the job if jest ran a different number of stories than
      # the subset defines — a filtered run that silently matched fewer files would
      # otherwise pass green.
      - name: Run visual regression tests (system-theme subset)
        if: steps.changes.outputs[matrix.name] == 'true' && matrix.subset
        run: node ${{ matrix.dir }}/scripts/visual-capture.mjs --skip-build --mode ${{ matrix.color_mode }}

      - name: Upload diff artifacts on failure
        if: failure() && steps.changes.outputs[matrix.name] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs-${{ matrix.name }}${{ matrix.color_mode && format('-{0}', matrix.color_mode) || '' }}
          path: ${{ matrix.dir }}/test/__snapshots__/__diff_output__/
