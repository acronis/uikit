# Builds the docs site + the ui-react Storybook into a single GitHub Pages
# artefact and deploys it. The docs site is the Pages root; the Storybook is
# nested under it.
#
# All sub-sites must ship in ONE artefact: GitHub Pages serves a single artefact
# per deployment, so each deploy replaces the whole site. A separate per-app
# deploy workflow would clobber the others.
#
# Trigger: every push to main, plus GitHub Release published (kept so a
# release always re-deploys even if a prior push-triggered deploy failed)
# and manual workflow_dispatch. Push-triggered runs are best-effort: build
# and deploy failures are logged but do not fail the job, so a broken Pages
# deploy never blocks or shows as a failing check on the commit.
name: Docs & Storybook - Deploy to Pages

on:
  push:
    branches: [main]

  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Push-triggered runs cancel a stale in-progress
# push build (only the latest commit's site matters); release/manual runs
# should still be allowed to finish, so cancellation only applies to pushes.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled

      - name: Setup PNPM
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ui-react Storybook, served under the docs root.
      # ui-react consumes its generated deps (icons-react, which pulls in
      # tokens-pd/design-assets/style-dictionary) from dist, so build those first;
      # ui-react's own source is bundled by Storybook via the .storybook alias.
      # Storybook's static build uses relative asset paths, so it works under the
      # subpath with no base flag.
      - name: Build ui-react storybook dependencies
        run: pnpm --filter @acronis-platform/icons-react... run build

      - name: Build ui-react storybook
        run: pnpm --filter ./packages/ui-react run storybook:build

      # The docs import @acronis-platform/ui-react (and icons-react) from their
      # built dist — the ui-react Storybook build above only bundles src, it does
      # not emit the library dist — so build the ui-react library (+ its deps)
      # before the docs build, or the static export fails to resolve the package.
      - name: Build docs dependencies
        run: pnpm --filter "@acronis-platform/ui-react..." run build

      # The docs site is now the Pages root (it replaced the demo SPA), so it
      # builds at /uikit rather than /uikit/docs.
      - name: Build docs
        run: DOCS_STATIC_EXPORT=true DOCS_BASE_PATH=/uikit pnpm --filter ./apps/docs run build

      - name: Copy the Storybook into the docs output
        run: |
          rm -rf apps/docs/out/storybook-react
          cp -r packages/ui-react/storybook-static apps/docs/out/storybook-react

      # /uikit/docs was the docs root until the demo SPA was removed. GitHub
      # Pages can't redirect, so leave a meta-refresh at the old entry point.
      - name: Leave a redirect at the previous docs URL
        run: |
          mkdir -p apps/docs/out/docs
          cat > apps/docs/out/docs/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Redirecting…</title>
          <meta http-equiv="refresh" content="0; url=/uikit/">
          <link rel="canonical" href="/uikit/">
          <p>The docs moved to <a href="/uikit/">/uikit/</a>.</p>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

      - name: Log build failure
        if: failure() && github.event_name == 'push'
        run: 'echo "### :warning: Pages build failed for this push — see the failed step above. Deploy was skipped; the site was not updated." >> "$GITHUB_STEP_SUMMARY"'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # NOTE: needs.build.result reports 'success' even when a step failed,
    # because build's own continue-on-error masks the failure from this
    # gate — so on push this job always attempts to run. If the artifact
    # upload didn't happen, deploy-pages fails fast and is logged below.
    needs: build
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Log deploy failure
        if: failure() && github.event_name == 'push'
        run: 'echo "### :warning: Pages deploy failed for this push — see the failed step above." >> "$GITHUB_STEP_SUMMARY"'
